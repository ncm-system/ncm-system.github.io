<!-- ============================================================
     CORE — no DOM in here. Reads an .xlsx with nothing but the
     browser (zip directory + DecompressionStream + the sheet XML),
     then builds the model with the SAME rules the app uses, so a
     figure here and a figure on a guard's phone cannot disagree.
     ============================================================ -->
<script id="core">
const NCM = (() => {
"use strict";

const EXPIRY_WINDOW = 30;                 // days that count as "expiring soon" — the app's number
const IND_TAB = "تصاريح أفراد";           // matched trimmed: the real tab carries a trailing space
const VEH_TAB = "تصاريح مركبات";
const EMP_TAB = "employees";

/* ---------- text ---------- */
function toLatinDigits(s){
  return String(s)
    .replace(/[٠-٩]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x0660 + 48))
    .replace(/[۰-۹]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x06F0 + 48));
}
function normalize(s){
  if(s === null || s === undefined) return "";
  return toLatinDigits(String(s)).replace(/\s+/g, " ").trim();
}
function clean(s){ return (s === null || s === undefined) ? "" : String(s).trim(); }
function digitsOnly(s){ return normalize(s).replace(/[^\d]/g, ""); }
/* One shape per Arabic letter, for MATCHING only — the same folding the
   permits app does. What is shown is always what the sheet says. */
function foldArabic(s){
  return normalize(s)
    .replace(/[ً-ْٰ]/g, "")
    .replace(/ـ/g, "")
    .replace(/[أإآ]/g, "ا")
    .replace(/[ىئ]/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .replace(/\s+/g, "")
    .toLowerCase();
}

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2, "0");
function today0(){ const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function mkDate(y, m, d){
  if(y < 1900 || y > 2200 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d); dt.setHours(0, 0, 0, 0);
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}
function fmt(dt){ return pad2(dt.getDate()) + "/" + pad2(dt.getMonth() + 1) + "/" + dt.getFullYear(); }
// The employees sheet: dd/mm/yyyy text (or ISO). Never the browser's own parser.
function parseStrict(v){
  const s = clean(v); if(!s) return null;
  let h;
  if((h = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return mkDate(+h[3], +h[2], +h[1]);
  if((h = s.match(/^(\d{4})[\-\/.](\d{1,2})[\-\/.](\d{1,2})/)))  return mkDate(+h[1], +h[2], +h[3]);
  return null;
}
// The permits sheet: a leading date, day first unless that is impossible,
// with whatever was typed after it kept as a note ("18-11-2025(ABNA SINA)").
const LEADING_DATE = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/;
function parseLoose(v){
  const s = normalize(v); const m = s.match(LEADING_DATE);
  if(!m) return null;
  const a = +m[1], b = +m[2], y = +m[3];
  let day, month;
  if(b > 12 && a <= 12){ month = a; day = b; } else { day = a; month = b; }
  const date = mkDate(y, month, day);
  if(!date) return null;
  const rest = s.slice(m[0].length).replace(/^[\s\-\/(),.:؛;]+/, "").replace(/[)\]]+$/, "").trim();
  return { date, text: fmt(date), rest, year: y };
}
function daysTo(dt){
  const t = today0();
  return Math.round((Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) -
                     Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
}

/* ---------- national id ---------- */
const GOV = {
  "01":"القاهرة","02":"الإسكندرية","03":"بورسعيد","04":"السويس","11":"دمياط","12":"الدقهلية",
  "13":"الشرقية","14":"القليوبية","15":"كفر الشيخ","16":"الغربية","17":"المنوفية","18":"البحيرة",
  "19":"الإسماعيلية","21":"الجيزة","22":"بني سويف","23":"الفيوم","24":"المنيا","25":"أسيوط",
  "26":"سوهاج","27":"قنا","28":"أسوان","29":"الأقصر","31":"البحر الأحمر","32":"الوادي الجديد",
  "33":"مطروح","34":"شمال سيناء","35":"جنوب سيناء","88":"خارج الجمهورية"
};
function nidInfo(d){
  if(!/^\d{14}$/.test(d) || !/^[23]/.test(d) || !GOV[d.slice(7, 9)]) return null;
  const birth = mkDate((d[0] === "2" ? 1900 : 2000) + +d.slice(1, 3), +d.slice(3, 5), +d.slice(5, 7));
  if(!birth) return null;
  const t = today0();
  let age = t.getFullYear() - birth.getFullYear();
  if(t.getMonth() < birth.getMonth() || (t.getMonth() === birth.getMonth() && t.getDate() < birth.getDate())) age--;
  return { birth: fmt(birth), age, gov: GOV[d.slice(7, 9)], govCode: d.slice(7, 9), male: (+d[12]) % 2 === 1 };
}

/* ============================================================
   XLSX — just enough of the format to read values.
   The 247k-row ASE Data tab is never even decompressed.
   ============================================================ */
// An error the page can say in its own words, in whichever language it is showing:
// `code` says what went wrong, `extra` carries the detail.
function fail(code, message, extra){
  const e = new Error(message);
  e.code = code; e.extra = extra;
  return e;
}
function zipEntries(buf){
  const dv = new DataView(buf), n = buf.byteLength;
  let eocd = -1;
  for(let i = n - 22; i >= Math.max(0, n - 22 - 65535); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw fail("NOT_XLSX", "الملف ده مش ملف إكسيل xlsx");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder("utf-8"), out = new Map();
  for(let i = 0; i < count; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
    out.set(dec.decode(new Uint8Array(buf, off + 46, nl)), {
      method: dv.getUint16(off + 10, true),
      csize:  dv.getUint32(off + 20, true),
      lho:    dv.getUint32(off + 42, true)
    });
    off += 46 + nl + el + cl;
  }
  return out;
}
async function unzip(buf, e){
  const dv = new DataView(buf);
  const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
  const bytes = new Uint8Array(buf, start, e.csize);
  if(e.method === 0) return new TextDecoder("utf-8").decode(bytes);
  if(e.method !== 8) throw fail("NOT_XLSX", "ضغط غير مدعوم جوّه الملف");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new TextDecoder("utf-8").decode(await new Response(stream).arrayBuffer());
}
const ENT = { amp:"&", lt:"<", gt:">", quot:'"', apos:"'" };
function xmlText(s){
  // A line break typed inside a cell sits in the file as CR LF. Every XML
  // parser hands that back as a single LF, and so must this — otherwise the
  // text comes out two characters longer per break than Excel itself has it.
  if(s.indexOf("\r") !== -1) s = s.replace(/\r\n?/g, "\n");
  if(s.indexOf("&") !== -1){
    s = s.replace(/&(?:#(\d+)|#x([0-9a-fA-F]+)|(amp|lt|gt|quot|apos));/g,
      (m, d, h, n) => d ? String.fromCodePoint(+d) : h ? String.fromCodePoint(parseInt(h, 16)) : ENT[n]);
  }
  if(s.indexOf("_x") !== -1) s = s.replace(/_x([0-9A-Fa-f]{4})_/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
  return s;
}
function attr(a, name){
  const m = new RegExp("(?:^|\\s)" + name + '="([^"]*)"').exec(a);
  return m ? m[1] : null;
}
function sharedStrings(xml){
  const out = [], re = /<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g;
  let m;
  while((m = re.exec(xml))){
    let body = m[1];
    if(!body){ out.push(""); continue; }
    if(body.indexOf("<rPh") !== -1) body = body.replace(/<rPh\b[\s\S]*?<\/rPh>/g, "");
    let s = "", k; const tr = /<t\b[^>]*?(?:\/>|>([\s\S]*?)<\/t>)/g;
    while((k = tr.exec(body))) if(k[1]) s += xmlText(k[1]);
    out.push(s);
  }
  return out;
}
/* Which cell styles are dates. A date in Excel is only a number wearing a
   date format, so the format is the one thing that tells them apart. */
function dateStyles(xml){
  const custom = {}; let m;
  const nf = /<numFmt\b([^>]*)>/g;
  while((m = nf.exec(xml))){
    const id = attr(m[1], "numFmtId"), code = attr(m[1], "formatCode");
    if(id !== null && code !== null) custom[id] = xmlText(code);
  }
  const isDateCode = code => {
    const c = code.replace(/"[^"]*"/g, "").replace(/\[[^\]]*\]/g, "").replace(/\\./g, "");
    return /[dmyhs]/i.test(c);
  };
  const block = (xml.match(/<cellXfs\b[\s\S]*?<\/cellXfs>/) || [""])[0];
  const out = [], xf = /<xf\b([^>]*)>/g;
  while((m = xf.exec(block))){
    const id = +(attr(m[1], "numFmtId") || 0);
    out.push((id >= 14 && id <= 22) || (id >= 27 && id <= 36) || (id >= 45 && id <= 47) || (id >= 50 && id <= 58)
             || (custom[id] !== undefined && isDateCode(custom[id])));
  }
  return out;
}
function colIndex(letters){
  let n = 0;
  for(let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}
function serialToDMY(serial){
  const ms = Math.round((Math.floor(serial) - 25569) * 86400000);
  const d = new Date(ms);
  if(isNaN(d.getTime())) return String(serial);
  return pad2(d.getUTCDate()) + "/" + pad2(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear();
}
function numText(raw){
  if(/^-?\d+$/.test(raw)) return raw;
  const n = Number(raw);
  if(!isFinite(n)) return raw;
  return (Number.isInteger(n) && Math.abs(n) < 1e21) ? n.toFixed(0) : String(n);
}
/* -> [{n: the row's number in Excel, c: [text per column]}], empty rows dropped */
function sheetRows(xml, shared, dateXf, maxCol){
  const rows = [], rre = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
  let m;
  while((m = rre.exec(xml))){
    if(!m[2]) continue;
    const rn = +(attr(m[1], "r") || 0) || rows.length + 1;
    const cells = []; let any = false, ci = -1, c;
    const cre = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    while((c = cre.exec(m[2]))){
      const ref = /(?:^|\s)r="([A-Z]+)\d+"/.exec(c[1]);
      ci = ref ? colIndex(ref[1]) : ci + 1;
      if(c[2] === undefined || (maxCol && ci >= maxCol)) continue;
      const t = attr(c[1], "t");
      let v = "";
      if(t === "inlineStr"){
        let k; const tr = /<t\b[^>]*?(?:\/>|>([\s\S]*?)<\/t>)/g;
        while((k = tr.exec(c[2]))) if(k[1]) v += xmlText(k[1]);
      }else{
        const vm = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(c[2]);
        if(!vm) continue;
        const raw = vm[1];
        if(t === "s") v = shared[+raw] || "";
        else if(t === "str") v = xmlText(raw);
        else if(t === "b") v = raw === "1" ? "TRUE" : "FALSE";
        else if(t === "e") v = "";
        else v = dateXf[+(attr(c[1], "s") || 0)] ? serialToDMY(+raw) : numText(raw);
      }
      if(v !== ""){ cells[ci] = v; any = true; }
    }
    if(any){
      for(let i = 0; i < cells.length; i++) if(cells[i] === undefined) cells[i] = "";
      rows.push({ n: rn, c: cells });
    }
  }
  return rows;
}

/* Reads one workbook and says which of the two it is. */
async function readFile(file, onStep){
  const step = onStep || (() => {});
  const buf = await file.arrayBuffer();
  const ent = zipEntries(buf);
  const get = async name => {
    const e = ent.get(name);
    if(!e) throw fail("NOT_XLSX", "ناقص جوّه الملف: " + name);
    return unzip(buf, e);
  };
  const wbXml = await get("xl/workbook.xml"), relXml = await get("xl/_rels/workbook.xml.rels");
  const rel = {}; let m;
  const rre = /<Relationship\b([^>]*)>/g;
  while((m = rre.exec(relXml))) rel[attr(m[1], "Id")] = attr(m[1], "Target");
  const tabs = [], sre = /<sheet\b([^>]*)>/g;
  while((m = sre.exec(wbXml))){
    const target = rel[attr(m[1], "r:id")] || "";
    tabs.push({ name: xmlText(attr(m[1], "name") || ""),
                path: target.charAt(0) === "/" ? target.slice(1) : "xl/" + target });
  }
  const find = want => tabs.find(t => t.name.trim() === want);
  const ind = find(IND_TAB), veh = find(VEH_TAB), emp = find(EMP_TAB);
  const kind = (ind && veh) ? "per" : emp ? "emp" : null;
  if(!kind){
    const found = tabs.map(t => t.name.trim()).join(" · ");
    throw fail("NOT_OURS", "«" + file.name + "» مش شيت التصاريح ولا شيت الموظفين — التابات اللي فيه: " + found, found);
  }
  step("بقرا النصوص من «" + file.name + "»");
  const shared = ent.has("xl/sharedStrings.xml") ? sharedStrings(await get("xl/sharedStrings.xml")) : [];
  const dateXf = ent.has("xl/styles.xml") ? dateStyles(await get("xl/styles.xml")) : [];
  const tab = async (t, maxCol, label) => {
    step("بقرا " + label);
    const rows = sheetRows(await get(t.path), shared, dateXf, maxCol);
    const header = rows.length ? rows[0].c : [];
    return { header, rows: rows.slice(1) };
  };
  const payload = {
    kind, fileName: file.name, lastModified: file.lastModified || 0, size: file.size || buf.byteLength,
    loadedAt: Date.now(), tabs: tabs.map(t => t.name), sheets: {}
  };
  if(kind === "per"){
    payload.sheets.ind = await tab(ind, 16, "تصاريح الأفراد");
    payload.sheets.veh = await tab(veh, 8, "تصاريح المركبات");
  }else{
    payload.sheets.emp = await tab(emp, 0, "الموظفين");
  }
  return payload;
}

/* ============================================================
   EMPLOYEES — the rules are the app's, word for word.
   ============================================================ */
const EMP_COLS = {
  "الكود":"emp_code", "الاسم":"full_name", "الاسم بالإنجليزي":"full_name_en",
  "الرقم القومي":"national_id", "الوظيفة":"job_title", "القسم":"department",
  "النوع":"category", "رقم الهاتف":"phone", "تاريخ التعيين":"hire_date",
  "العنوان":"address", "تاريخ التصريح":"permit_date", "حالة التصريح":"permit_status",
  "سبب المنع":"ban_reason", "انتهاء الاستقالة":"resignation_end_date", "ملاحظات":"notes",
  // the letter the permit came on — added to the table on 2 October 2026
  "رقم الخطاب":"letter_number", "تاريخ الخطاب":"letter_date", "الشركة":"letter_company", "ملاحظات الخطاب":"letter_note"
};
function empStatus(e){
  const raw = e.permit_status, dl = e.dl;
  if(raw === "ممنوع") return { k:"ban", label:"ممنوع", code:"BANNED" };
  if(e.resigned){
    if(raw === "ساري" && dl !== null && dl >= 0) return { k:"ok", label:"ساري", code:"VERIFIED" };
    return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
  }
  if(raw === "ساري"){
    if(e.permit_date === "ساري حتى الاستقالة") return { k:"ok", label:"ساري", code:"VERIFIED" };
    if(dl === null) return { k:"mute", label:"بدون تاريخ", code:"NO DATE" };
    if(dl < 0) return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
    if(dl <= EXPIRY_WINDOW) return { k:"warn", label:"قرب الانتهاء", code:"EXPIRING" };
    return { k:"ok", label:"ساري", code:"VERIFIED" };
  }
  if(raw === "منتهي الصلاحية") return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
  if(raw === "بدون تصريح" || raw === "") return { k:"mute", label:"بدون تصريح", code:"NO PERMIT" };
  return { k:"mute", label:raw, code:"UNKNOWN" };
}
function byCode(a, b){
  const x = parseInt(digitsOnly(a.emp_code), 10), y = parseInt(digitsOnly(b.emp_code), 10);
  if(isNaN(x) && isNaN(y)) return 0;
  if(isNaN(x)) return 1;
  if(isNaN(y)) return -1;
  return x - y;
}
function buildEmployees(p){
  const sh = p.sheets.emp, idx = {};
  sh.header.forEach((h, i) => { const k = EMP_COLS[clean(h)]; if(k && !(k in idx)) idx[k] = i; });
  const missing = Object.keys(EMP_COLS).filter(h => !(EMP_COLS[h] in idx));
  const list = [];
  sh.rows.forEach(r => {
    const e = { row: r.n };
    Object.values(EMP_COLS).forEach(k => { e[k] = (k in idx) ? clean(r.c[idx[k]]) : ""; });
    if(!e.emp_code) return;
    e.resigned = !!e.resignation_end_date;                       // any value counts, even «غير محدد»
    e.foreign  = !(e.national_id.length === 14 && /^[0-9]+$/.test(e.national_id));
    e.pdate    = parseStrict(e.permit_date);
    e.dl       = e.pdate ? daysTo(e.pdate) : null;
    e.st       = empStatus(e);
    e.works    = !e.resigned && e.permit_status !== "ممنوع";     // worksHere() in the app
    e.nid      = digitsOnly(e.national_id);
    e.hay      = [foldArabic(e.full_name), e.full_name_en.toLowerCase().replace(/\s+/g, ""), e.emp_code,
                  e.nid, foldArabic(e.job_title), foldArabic(e.department), digitsOnly(e.phone),
                  foldArabic(e.letter_number), foldArabic(e.letter_company)].join("|");
    list.push(e);
  });
  list.sort(byCode);
  const byCodeMap = new Map(), byNid = new Map();
  list.forEach(e => {
    byCodeMap.set(e.emp_code, e);
    if(!e.foreign){ if(!byNid.has(e.nid)) byNid.set(e.nid, []); byNid.get(e.nid).push(e); }
  });
  return { list, byCode: byCodeMap, byNid, missing };
}

/* ============================================================
   PERMITS — columns are read by position, exactly as the app does.
   ============================================================ */
const IND_COL = { NAME:2, JOB:3, ID:4, ADDR:5, NOTE:6, SENDER:7, PERMIT:8, DAY:9, MAIL:10, LETTER:11, COMPANY:12, LDATE:13, ANOTE:14 };
const VEH_COL = { PLATE:2, TYPE:3, OWNER:4, PERMIT:5, DAY:6, MAIL:7 };
const EXPECT = {
  ind: ["الاسم","الوظيفة","الرقم القومى","العنوان","ملاحظات","المرسل","تصريح","Mail Day","MAIL TYPE","Letter Number"],
  veh: ["رقم السيارة","النوع","تابعه","تصريح","Mail Day","MAIL TYPE"]
};
const RENEW_WORDS = ["عايز تجديد","الرخصه منتهيه","غيرت لوحات","تجديد"];
function classify(rawValue){
  const s = normalize(rawValue);
  /* Two different answers that used to share one box: "pending" is a permit
     still out for a reply (an empty cell, or the words «فى انتظار الرد»), and
     "undet" is one whose standing nobody knows («غير محدد موقف», question
     marks, or any wording that is none of the others). */
  // `auto` marks the two wordings that are the system's own and not the sheet's,
  // so the page can say them in whichever language it is showing
  if(s === "") return { cat:"pending", cls:"warn", main:"في انتظار الرد", auto:"pending", note:"", date:null, dl:null, raw:s };
  if(/^[؟?]+$/.test(s.replace(/\s+/g, ""))) return { cat:"undet", cls:"mute", main:"غير محدد موقفه حتى الآن", auto:"undet", note:"", date:null, dl:null, raw:s };
  if(s.includes("منع")) return { cat:"ban", cls:"ban", main:s, note:"", date:null, dl:null, raw:s };
  if(RENEW_WORDS.some(w => s.includes(w))) return { cat:"renew", cls:"bad", main:s, note:"", date:null, dl:null, raw:s };
  if(s.includes("مؤقت")) return { cat:"temp", cls:"mute", main:s, note:"", date:null, dl:null, raw:s };
  const p = parseLoose(s);
  if(p){
    const dl = daysTo(p.date);
    return { cat: dl < 0 ? "expired" : dl <= EXPIRY_WINDOW ? "soon" : "ok",
             cls: dl < 0 ? "bad" : dl <= EXPIRY_WINDOW ? "warn" : "ok",
             main: p.text, note: p.rest, date: p.date, dl, raw: s, year: p.year };
  }
  if(s.includes("انتظار")) return { cat:"pending", cls:"warn", main:s, note:"", date:null, dl:null, raw:s };
  return { cat:"undet", cls:"mute", main:s, note:"", date:null, dl:null, raw:s };
}
// dated first in order, undated after them; the LAST one is what the app opens on
function sortByDay(records){
  return records.slice().sort((a, b) => {
    if(a.dayDate && b.dayDate) return a.dayDate - b.dayDate;
    if(a.dayDate) return -1;
    if(b.dayDate) return 1;
    return 0;
  });
}
function headerDrift(header, expect){
  const plain = s => normalize(s).replace(/ـ/g, "");
  const got = expect.map((_, i) => plain(header[2 + i]));
  return got.every((g, i) => g === plain(expect[i])) ? null : got;
}
function buildIndividuals(p){
  const sh = p.sheets.ind, C = IND_COL, groups = new Map();
  sh.rows.forEach(r => {
    const c = r.c;
    const idVal = normalize(c[C.ID]), nameVal = normalize(c[C.NAME]);
    if(!idVal && !nameVal) return;
    const key = idVal ? "ID:" + digitsOnly(idVal) : "NAME:" + nameVal;
    if(!groups.has(key)) groups.set(key, { key, name: nameVal, nationalId: idVal, nid: digitsOnly(idVal), records: [], names: new Map() });
    const g = groups.get(key);
    const f = foldArabic(nameVal);
    if(f && !g.names.has(f)) g.names.set(f, nameVal);
    const day = parseLoose(c[C.DAY]);
    g.records.push({
      row: r.n, name: nameVal, job: normalize(c[C.JOB]), address: normalize(c[C.ADDR]), note: normalize(c[C.NOTE]),
      sender: normalize(c[C.SENDER]), mail: normalize(c[C.MAIL]), letter: normalize(c[C.LETTER]),
      company: normalize(c[C.COMPANY]), ldate: normalize(c[C.LDATE]), anote: normalize(c[C.ANOTE]),
      permit: normalize(c[C.PERMIT]), day: normalize(c[C.DAY]), dayDate: day ? day.date : null,
      dayText: day ? day.text : "", dayNote: day ? day.rest : normalize(c[C.DAY]), p: classify(c[C.PERMIT])
    });
  });
  const list = [], byNid = new Map();
  groups.forEach(g => {
    g.records = sortByDay(g.records);
    g.cur = g.records[g.records.length - 1];
    g.p = g.cur.p;
    g.hay = [[...g.names.keys()].join("|"), g.nid, foldArabic(g.cur.job), foldArabic(g.cur.company), foldArabic(g.cur.sender)].join("|");
    if(g.nid) byNid.set(g.nid, g);
    list.push(g);
  });
  return { list, groups, byNid, rows: sh.rows.length, drift: headerDrift(sh.header, EXPECT.ind) };
}
function buildVehicles(p){
  const sh = p.sheets.veh, C = VEH_COL, groups = new Map();
  sh.rows.forEach(r => {
    const c = r.c, plate = normalize(c[C.PLATE]);
    if(!plate) return;
    const key = foldArabic(plate);
    if(!groups.has(key)) groups.set(key, { key, plate, records: [], forms: new Set() });
    const g = groups.get(key);
    g.forms.add(plate);
    const day = parseLoose(c[C.DAY]);
    g.records.push({
      row: r.n, plate, type: normalize(c[C.TYPE]), owner: normalize(c[C.OWNER]), mail: normalize(c[C.MAIL]),
      permit: normalize(c[C.PERMIT]), day: normalize(c[C.DAY]), dayDate: day ? day.date : null,
      dayText: day ? day.text : "", dayNote: day ? day.rest : normalize(c[C.DAY]), p: classify(c[C.PERMIT])
    });
  });
  const list = [];
  groups.forEach(g => {
    g.records = sortByDay(g.records);
    g.cur = g.records[g.records.length - 1];
    g.p = g.cur.p;
    g.hay = [g.key, foldArabic(g.cur.type), foldArabic(g.cur.owner)].join("|");
    list.push(g);
  });
  return { list, groups, rows: sh.rows.length, drift: headerDrift(sh.header, EXPECT.veh) };
}

      base.concat(["الرقم المكتوب"]),
      E.filter(e => /^[0-9]+$/.test(e.national_id) && ![7, 9].includes(e.national_id.length) && !nidInfo(e.national_id))

    const dupN = [...emp.byNid.values()].filter(a => a.length > 1);
    add("e-dupnid", "الموظفين", "bad", "رقم قومي متكرر", "نفس الرقم القومي على أكتر من كود",
      base.concat(["الرقم القومي"]), dupN.flat().map(e => row(e, [e.national_id])));
    const seen = new Map(); E.forEach(e => seen.set(e.emp_code, (seen.get(e.emp_code) || 0) + 1));

      base.concat(["المكتوب"]), E.filter(e => e.category !== "blue" && e.category !== "white").map(e => row(e, [e.category || "فاضي"])));
    add("e-nodate", "الموظفين", "warn", "ساري من غير تاريخ", "الحالة «ساري» وخانة التاريخ فاضية أو مش تاريخ — بيظهر في التطبيق «بدون تاريخ»",
      base.concat(["المكتوب في التاريخ"]), E.filter(e => e.st.code === "NO DATE").map(e => row(e, [e.permit_date || "فاضي"])));
    add("e-unknown", "الموظفين", "warn", "حالة تصريح مش معروفة", "كلمة غير «ساري / بدون تصريح / ممنوع / منتهي الصلاحية»",
      base.concat(["المكتوب"]), E.filter(e => e.st.code === "UNKNOWN").map(e => row(e, [e.permit_status])));
    const okWords = ["ساري حتى الاستقالة", "غير معروف", "غير محدد"];
    const badDates = [];
    E.forEach(e => [["تاريخ التعيين", e.hire_date], ["تاريخ التصريح", e.permit_date], ["انتهاء الاستقالة", e.resignation_end_date]]
      .forEach(([lab, v]) => { if(v && !parseStrict(v) && !okWords.includes(v)) badDates.push(row(e, [lab, v])); }));
    add("e-dates", "الموظفين", "warn", "تاريخ مش مقري", "خانة تاريخ فيها حاجة مش بصيغة يوم/شهر/سنة",
      base.concat(["الخانة", "المكتوب"]), badDates);
    add("e-ban", "الموظفين", "warn", "ممنوع من غير سبب", "الحالة «ممنوع» وخانة سبب المنع فاضية",
      base, E.filter(e => e.permit_status === "ممنوع" && !e.ban_reason).map(e => row(e, [])));
  }

  if(emp && ind){
    const E = emp.list, base = ["الكود", "الاسم"];
    const row = (e, extra) => ({ open: "emp:" + e.emp_code, cells: [e.emp_code, e.full_name].concat(extra) });
    const link = e => e.foreign ? null : ind.byNid.get(e.nid) || null;
    add("x-none", "بين الشيتين", "info", "موظف موجود ومالوش صف في شيت التصاريح",

      "ممكن يكون المنع اتشال من شيت واحد بس", base.concat(["سبب المنع", "آخر تصريح"]),

    }));
    G.forEach(g => { if(g.nationalId && !nidInfo(g.nid)) g.records.forEach(r => bad.push({ open: "ind:" + g.key, cells: [r.row, r.name, g.nationalId] })); });
    add("p-nid", "تصاريح الأفراد", "bad", "رقم قومي مش مظبوط", "مش 14 خانة صحيحة — الراجل ده مش هيتلاقى بالرقم",

      ["الرقم القومي", "الأسماء المكتوبة"],
      G.filter(g => g.nid && g.names.size > 1).map(g => ({ open: "ind:" + g.key, cells: [g.nationalId, [...g.names.values()].join(" ← ")] })));
    const byName = new Map();

    add("p-day", "تصاريح الأفراد", "warn", "تاريخ إرسال مش مقري", "خانة Mail Day فيها حاجة مش تاريخ",

    add("p-year", "تصاريح الأفراد", "warn", "سنة تصريح غريبة", "تاريخ تصريح بره 2020 – 2035",

  if(veh){

function buildModel(data){
  const M = { emp: null, ind: null, veh: null, checks: [] };
  if(data.emp) M.emp = buildEmployees(data.emp);
  if(data.per){ M.ind = buildIndividuals(data.per); M.veh = buildVehicles(data.per); }
  if(M.emp && M.ind){
    M.emp.list.forEach(e => { e.per = e.foreign ? null : (M.ind.byNid.get(e.nid) || null); });
    M.ind.list.forEach(g => { g.emp = (g.nid && M.emp.byNid.get(g.nid)) || null; });
  }
  M.checks = runChecks(M);
  M.issues = M.checks.filter(c => c.sev !== "info").reduce((n, c) => n + c.rows.length, 0);
  return M;
}

/* ============================================================
   WRITING AN .xlsx — the other direction, for «تصدير Excel».
   A real workbook, not a CSV: one sheet, the company mark, a header that stays
   put, a filter on every column, rows ruled and banded, columns as wide as
   what is in them, dates that are dates and sort as dates, and long numbers
   (national ids) kept as text so Excel cannot turn them into 2.92E+13.
   Still nothing but the browser: the sheet XML is written by hand and zipped
   with CompressionStream.
   ============================================================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function deflateRaw(bytes){
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function zip(files){                       // files: [[name, text or bytes, kept as it is (not squeezed)?]]
  const enc = new TextEncoder(), parts = [], dir = [];
  let at = 0;
  for(const f of files){
    // a file that is already squeezed (a Word file, a PDF) goes in as it is: squeezing it again buys nothing and takes time
    const name = enc.encode(f[0]), raw = typeof f[1] === "string" ? enc.encode(f[1]) : f[1], how = f[2] ? 0 : 8, data = f[2] ? raw : await deflateRaw(raw), crc = crc32(raw);
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true); head.setUint16(4, 20, true); head.setUint16(6, 0x0800, true); head.setUint16(8, how, true);
    head.setUint16(10, 0, true); head.setUint16(12, 0x21, true);            // a fixed stamp: 1980-01-01
    head.setUint32(14, crc, true); head.setUint32(18, data.length, true); head.setUint32(22, raw.length, true);
    head.setUint16(26, name.length, true); head.setUint16(28, 0, true);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true); cen.setUint16(10, how, true);
    cen.setUint16(12, 0, true); cen.setUint16(14, 0x21, true);
    cen.setUint32(16, crc, true); cen.setUint32(20, data.length, true); cen.setUint32(24, raw.length, true);
    cen.setUint16(28, name.length, true); cen.setUint32(42, at, true);
    parts.push(new Uint8Array(head.buffer), name, data);
    dir.push(new Uint8Array(cen.buffer), name);
    at += 30 + name.length + data.length;
  }
  const dirSize = dir.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, dirSize, true); end.setUint32(16, at, true);
  const all = parts.concat(dir, [new Uint8Array(end.buffer)]);
  const out = new Uint8Array(all.reduce((n, p) => n + p.length, 0));
  let o = 0; for(const p of all){ out.set(p, o); o += p.length; }
  return out;
}
const xmlOut = v => String(v).replace(/[^\x09\x0A\x0D\x20-\uD7FF\uE000-\uFFFD\u{10000}-\u{10FFFF}]/gu, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function colName(i){ let s = ""; for(i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; }
// how wide a value is on the sheet, in Excel's column units; Arabic letters run a little wider than digits
function cellWidth(v){
  let w = 0;
  for(const line of String(v).split("\n")){
    let n = 0;
    for(const ch of line) n += /[؀-ۿ]/.test(ch) ? 1.12 : /[A-Z]/.test(ch) ? 1.25 : 1;
    if(n > w) w = n;
  }
  return w;
}
/* The company mark that heads every exported sheet: NCM over NUCLEAR CONCRETE

const COL_PX = 8;                                // one unit of column width, in pixels, for the sheet's own font (Arial 11)
function markBytes(){
  const s = atob(MARK.png), out = new Uint8Array(s.length);

/* sheet = { name, header: [text], rows: [[cell]], rtl, text: [column indexes that must stay text], red: [true for a row to be red] }
   The first row of every sheet is the company mark; the second is the header.
   A cell is a value, or { v, tone } with tone "ok" | "warn" | "bad" | "mute" — the colour the page shows it in.
   What a cell IS decides how it is written, never where it sits:
     dd/mm/yyyy                    -> a date
     a whole number, up to 9 digits, no leading zero -> a number
     anything else                 -> text                                    */
const TONES = ["", "ok", "warn", "bad", "mute"];
const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const EMU = 9525;                                // English Metric Units to the pixel
// styles: 0 plain · 1 the mark's row · 2 header · then band(3: plain, tinted, red) x tone(5) x kind(3: text, number, date)
const styleOf = (band, tone, kind) => 3 + band * 15 + Math.max(0, TONES.indexOf(tone || "")) * 3 + kind;
// One sheet of the workbook: its own XML, the drawing that puts the mark over it, and its tab name.
function sheetParts(sheet, used){
  const ncol = sheet.header.length, last = colName(ncol - 1), nrow = sheet.rows.length;
  const asText = new Set(sheet.text || []);
  const widths = sheet.header.map(h => cellWidth(h) + 4);          // + room for the filter arrow
  const rowsXML = [];
  sheet.rows.forEach((row, ri) => {
    const r = ri + 3, band = sheet.red && sheet.red[ri] ? 2 : ri % 2;      // 2: a red row, whatever its turn in the banding
    let cells = "";
    for(let ci = 0; ci < ncol; ci++){
      let cell = row[ci], tone = "";
      if(cell && typeof cell === "object"){ tone = cell.tone; cell = cell.v; }
      const ref = colName(ci) + r;
      const s = cell === null || cell === undefined ? "" : String(cell).trim();
      let date = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s);
      if(date && !mkDate(+date[3], +date[2], +date[1])) date = null;      // «31/02/2026» is text, not the 3rd of March
      if(s === "") cells += '<c r="' + ref + '" s="' + styleOf(band, tone, 0) + '"/>';
      else if(date && !asText.has(ci)){
        cells += '<c r="' + ref + '" s="' + styleOf(band, tone, 2) + '"><v>' + (Date.UTC(+date[3], +date[2] - 1, +date[1]) / 86400000 + 25569) + "</v></c>";
        widths[ci] = Math.max(widths[ci], 12);
      }
      else if(/^-?(0|[1-9]\d{0,8})$/.test(s) && !asText.has(ci)){
        cells += '<c r="' + ref + '" s="' + styleOf(band, tone, 1) + '"><v>' + s + "</v></c>";
        widths[ci] = Math.max(widths[ci], s.length + 2);
      }
      else{
        cells += '<c r="' + ref + '" s="' + styleOf(band, tone, 0) + '" t="inlineStr"><is><t xml:space="preserve">' + xmlOut(s) + "</t></is></c>";
        widths[ci] = Math.max(widths[ci], cellWidth(s) + 2);
      }
    }
    rowsXML.push('<row r="' + r + '" spans="1:' + ncol + '" ht="21" customHeight="1">' + cells + "</row>");
  });
  const final = widths.map(w => Math.min(60, Math.max(9, Math.ceil(w))));
  const cols = final.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join("");
  // where the mark starts so that it sits in the middle of the table: so many pixels in, counted column by column
  let markCol = 0, markOff = Math.max(0, Math.round((final.reduce((n, w) => n + w, 0) * COL_PX - MARK.w) / 2));
  while(markCol < ncol - 1 && markOff >= final[markCol] * COL_PX){ markOff -= final[markCol] * COL_PX; markCol++; }
  const head = sheet.header.map((h, i) => '<c r="' + colName(i) + '2" s="2" t="inlineStr"><is><t xml:space="preserve">' + xmlOut(h) + "</t></is></c>").join("");
  const markCells = sheet.header.map((h, i) => '<c r="' + colName(i) + '1" s="1"/>').join("");
  const xml = XML_HEAD +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' +
    '<dimension ref="A1:' + last + (nrow + 2) + '"/>' +
    '<sheetViews><sheetView workbookViewId="0"' + (sheet.rtl ? ' rightToLeft="1"' : "") + ' showGridLines="0">' +
      '<pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A3" sqref="A3"/></sheetView></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/>' +
    "<cols>" + cols + "</cols>" +
    "<sheetData>" +
      '<row r="1" spans="1:' + ncol + '" ht="' + (MARK_ROW * 0.75) + '" customHeight="1">' + markCells + "</row>" +
      '<row r="2" spans="1:' + ncol + '" ht="27" customHeight="1">' + head + "</row>" +
      rowsXML.join("") +
    "</sheetData>" +
    '<autoFilter ref="A2:' + last + (nrow + 2) + '"/>' +
    (ncol > 1 ? '<mergeCells count="1"><mergeCell ref="A1:' + last + '1"/></mergeCells>' : "") +
    '<printOptions horizontalCentered="1"/>' +
    '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.6" header="0.3" footer="0.3"/>' +
    '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>' +
    '<headerFooter><oddFooter>&amp;C&amp;P / &amp;N</oddFooter></headerFooter>' +
    // a national id kept as text is what is wanted here, not a mistake to flag in every cell
    (nrow ? '<ignoredErrors><ignoredError sqref="A3:' + last + (nrow + 2) + '" numberStoredAsText="1"/></ignoredErrors>' : "") +
    '<drawing r:id="rId1"/>' +
    "</worksheet>";
  const drawing = XML_HEAD +
    '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">' +
    "<xdr:oneCellAnchor>" +
      "<xdr:from><xdr:col>" + markCol + "</xdr:col><xdr:colOff>" + markOff * EMU + "</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>" + Math.round((MARK_ROW - MARK.h) / 2) * EMU + "</xdr:rowOff></xdr:from>" +
      '<xdr:ext cx="' + MARK.w * EMU + '" cy="' + MARK.h * EMU + '"/>' +
      "<xdr:pic>" +
        '<xdr:nvPicPr><xdr:cNvPr id="2" name="NCM" descr="NCM — NUCLEAR CONCRETE MIXES"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +
        '<xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
        '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + MARK.w * EMU + '" cy="' + MARK.h * EMU + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>' +
      "</xdr:pic><xdr:clientData/>" +
    "</xdr:oneCellAnchor></xdr:wsDr>";
  // a tab name may not hold  \ / ? * [ ] :  , may not run past 31 characters, and no two tabs may share one
  let tab = (String(sheet.name || "Sheet").replace(/[\\\/?*\[\]:]/g, " ").trim() || "Sheet").slice(0, 31);
  for(let n = 2; used.has(tab.toLowerCase()); n++) tab = tab.slice(0, 28) + " " + n;
  used.add(tab.toLowerCase());
  return { xml, drawing, tab, range: "$A$2:$" + last + "$" + (nrow + 2) };
}

/* THE RENEWAL FORMS. The two sheets that go out with a request to renew — one

   filled in: its columns and their widths, its row height, the grey head and
   the grey serial column, thin black borders, everything centred, Calibri 11,
   the sheet right to left, the third column a plain number where it is one,
   and Excel's own colouring of a value written twice in that column. No logo
   and none of the system's colours: it is their form, not our report. */
async function writeForm(form){              // { header: [..], widths: [..], rows: [[serial, ..], ..] }

  };

      // the third column is a number when it is one (a national id) and text when it is not (a passport, a plate)
      if(c === 2) return cell(i + 2, c, /^[1-9]\d{0,14}$/.test(String(v)) ? +v : v, 4);
      return cell(i + 2, c, v, 3);
    }).join(""))).join("");
  const sheetXML = X + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<dimension ref="A1:' + colName(form.header.length - 1) + (rows + 1) + '"/>' +
    '<sheetViews><sheetView rightToLeft="1" tabSelected="1" workbookViewId="0"/></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/>' +
    "<cols>" + form.widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" style="1" customWidth="1"/>').join("") + "</cols>" +
    "<sheetData>" + body + "</sheetData>" +
    '<conditionalFormatting sqref="C1:C' + (rows + 1) + '"><cfRule type="duplicateValues" dxfId="0" priority="1"/></conditionalFormatting>' +
    '<pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/></worksheet>';
  const edge = '<color indexed="64"/>', centred = '<alignment horizontal="center" vertical="center"/></xf>';
  const stylesXML = X + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +

      '<fill><patternFill patternType="solid"><fgColor rgb="FFD9D9D9"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' +
      '<border><left style="thin">' + edge + '</left><right style="thin">' + edge + '</right><top style="thin">' + edge + '</top><bottom style="thin">' + edge + "</bottom><diagonal/></border></borders>" +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1">' + centred +
      '<xf numFmtId="0" fontId="0" fillId="2" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1">' + centred +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1">' + centred +

    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '<dxfs count="1"><dxf><font><color rgb="FF9C0006"/></font><fill><patternFill><bgColor rgb="FFFFC7CE"/></patternFill></fill></dxf></dxfs>' +
    "</styleSheet>";
  const REL = '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">', TYPE = "http://schemas.openxmlformats.org/officeDocument/2006/relationships/";
  return zip([
    ["[Content_Types].xml", X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +

      '<bookViews><workbookView/></bookViews><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>'],

/* THE ASE EXPORT, read for the «ASE SEARCH» page. Two hundred thousand rows and more: opened whole, its one sheet is
   a hundred megabytes of text — so it never is. The sheet is opened as a stream and taken a row at a time; what is
   kept of a row is its twelve cells as text, under the export's own headings. Answers [[row, FullName, ID, Status,
   Organization, Position, AccessArea, Citizenship, Letter Date, Letter Number, Confirm, OwnerLetterNumber, Note]]. */
const ASE_HEAD = ["FullName", "ID", "Status", "Organization", "Position", "AccessArea", "Citizenship", "Letter Date", "Letter Number", "Confirm", "OwnerLetterNumber", "Note"];
async function readAse(file, said){
  const buf = await file.arrayBuffer(), ent = zipEntries(buf);
  const get = name => unzip(buf, ent.get(name));
  if(!ent.has("xl/workbook.xml")) throw fail("NOT_ASE", "not an ASE export");
  const wbXml = await get("xl/workbook.xml"), relXml = await get("xl/_rels/workbook.xml.rels");
  const rel = {}; let m;
  const rre = /<Relationship\b([^>]*)>/g;
  while((m = rre.exec(relXml))) rel[attr(m[1], "Id")] = attr(m[1], "Target");
  let path = "";
  const sre = /<sheet\b([^>]*)>/g;
  while((m = sre.exec(wbXml))) if(xmlText(attr(m[1], "name") || "").trim() === "Sheet1"){ const target = rel[attr(m[1], "r:id")] || ""; path = target.charAt(0) === "/" ? target.slice(1) : "xl/" + target; }
  const e = ent.get(path);
  if(!e) throw fail("NOT_ASE", "not an ASE export");
  const shared = ent.has("xl/sharedStrings.xml") ? sharedStrings(await get("xl/sharedStrings.xml")) : [];
  const dv = new DataView(buf), start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
  let stream = new Blob([new Uint8Array(buf, start, e.csize)]).stream();
  if(e.method === 8) stream = stream.pipeThrough(new DecompressionStream("deflate-raw"));
  else if(e.method !== 0) throw fail("NOT_ASE", "not an ASE export");
  const reader = stream.pipeThrough(new TextDecoderStream("utf-8")).getReader();
  const rows = [], letters = "ABCDEFGHIJKL";
  let tail = "", headed = false;
  for(;;){
    const got = await reader.read();
    const text = tail + (got.value || "");
    const rowRe = /<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
    let last = 0, r;
    while((r = rowRe.exec(text))){
      last = rowRe.lastIndex;
      if(!r[1]) continue;
      const cells = ["", "", "", "", "", "", "", "", "", "", "", ""], cellRe = /<c r="([A-L])\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
      let c;
      while((c = cellRe.exec(r[1]))){
        const inner = c[3] || "", type = attr(c[2], "t") || "n", v = /<v>([\s\S]*?)<\/v>/.exec(inner);
        cells[letters.indexOf(c[1])] = (type === "inlineStr" ? xmlText((/<t[^>]*>([\s\S]*?)<\/t>/.exec(inner) || ["", ""])[1]) : !v ? "" : type === "s" ? (shared[+v[1]] || "") : xmlText(v[1])).trim();
      }
      if(!headed){
        if(cells.join("|") !== ASE_HEAD.join("|")) throw fail("NOT_ASE", "not an ASE export");
        headed = true;
        continue;
      }
      if(cells[0] || cells[1] || cells[2]) rows.push([rows.length + 1].concat(cells));
    }
    tail = text.slice(last);
    if(said) said(rows.length);
    if(got.done) break;
  }
  if(!headed) throw fail("NOT_ASE", "not an ASE export");
  return rows;
}

   list — the names, and each one's sealed key — is locked in USERS_BOX under a
   long random key that only the system's icon has. The icon opens the address
   with that key after the #, the one part of an address that is never sent to
   any server. Opened from a bare link the page has nobody to show and nothing
   to try a PIN against: it says it opens from its icon, and that is all. The
   key is kept on the device the icon opened it on (so the page can load itself

   it is typed — which user it was tried for, on which device — so the admin's
   activity log shows it at once. The database counts: the third in a row
   locks the device, and a locked device shows nobody at its gate and takes
   no PIN until the admin lets it back in from his log page (he can also lock
   a device himself, whenever he likes). Whether this device is locked is
   asked when the page opens, and every minute while it is open.
   For that the page has to reach the database before anyone has signed in.
   What it needs — the address, the key, and a token that can do those two
   things and nothing else — is locked in GATE_BOX under the icon's key, as
   the users are: opened from a bare link the page still knows nothing.

   the admin sees every try. But the PIN itself is checked by the page, so
   someone who holds the icon and wipes the browser's data is a new device
   with three tries more — each of them in the admin's log. */
const BLOCK_KEY = "ncm_system_blocked", FAIL_KEY = "ncm_system_fail", DEVICE_KEY = "ncm_system_device", MAX_WRONG = 3;

function deviceId(){

function deviceTag(){

  const os = /Windows/.test(ua) ? "Windows" : /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS" : /Mac OS/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "?";
  const br = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "?";
  return os + " · " + br + " · " + deviceId().slice(-6);
}
async function gateCall(fn, args){
  if(!GATE) throw new Error("the gate has nothing to call with");
  const stop = new AbortController(), timer = setTimeout(() => stop.abort(), 7000);       // a database out of reach must not hold the gate up
  try{
    const r = await fetch(GATE.db + "/rest/v1/rpc/system_gate_" + fn, { method: "POST", cache: "no-store", signal: stop.signal,
      headers: { apikey: GATE.k, Authorization: "Bearer " + GATE.k, "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ p_token: GATE.t, p_device: deviceId() }, args)) });
    if(!r.ok) throw new Error("the gate was answered " + r.status);
    return await r.json();
  }finally{ clearTimeout(timer); }
}
/* Is this device locked? The database says. Wrong PINs typed while it was out
   of reach are told first, so that going offline to guess gains nothing. If
   it cannot be asked, what the device remembers stands. */
async function gateState(){
  if(!GATE) return;
  try{
    let owed = 0;
    try{ owed = +localStorage.getItem(FAIL_KEY) || 0; }catch(e){}
    for(let i = 0; i < owed; i++) await gateCall("wrong", { p_tag: deviceTag(), p_user: "" });
    if(owed) try{ localStorage.removeItem(FAIL_KEY); }catch(e){}
    const s = await gateCall("state", {});
    try{ if(s && s.blocked) localStorage.setItem(BLOCK_KEY, String(Date.now())); else localStorage.removeItem(BLOCK_KEY); }catch(e){}
  }catch(e){}
}
async function unboxUsers(){
  if(!USERS_BOX) return;                            // this PC's own copy: the list is written out above
  let k = "";
  if(ICON_RE.test(ARGS.i || "")){ k = ARGS.i; try{ localStorage.setItem(ICON_KEY, k); }catch(e){} }
  else try{ k = localStorage.getItem(ICON_KEY) || ""; }catch(e){}
  if(!ICON_RE.test(k)) return;
  let list = null;
  try{
    const raw = Uint8Array.from(atob(k.replace(/-/g, "+").replace(/_/g, "/") + "="), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const open = async box => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.data))));
    list = await open(USERS_BOX);
    if(GATE_BOX) GATE = await open(GATE_BOX);
  }catch(e){ return; }                              // not this system's key (an icon made before the key was changed): nothing opens
  await gateState();
  if(blocked()) return;                             // locked: the gate shows nobody, and says why
  PIN_LEN = list.pinLen; USERS = list.users;
}
/* THE USERS THE ADMIN ADDED. The page carries its first users sealed inside it; one added later from the ADMIN page is
   kept, sealed the same way, in the database, and the gate asks for them (with the gate's own token — the seals are
   noise without their PINs, as the page's own are). A name the admin has switched off is not at the gate. */
let USERS_IN = null;                                // the users the page itself carries, once the gate has asked for the others
const usersIn = () => USERS_IN || USERS;
/* ANOTHER PASSWORD, GIVEN FROM THE ADMIN PAGE. For a user the page was built with, the new password's seal is kept in
   the database beside the added users — marked here `over` — and from then on the page's own seal of him is refused
   at this gate even when the old password opens it (see submitPin): his ordinary way in (`viewer`) and, for the
   admin, his admin's way in (`admin`) each have their own. What the gate was last told is kept on the device, so a
   gate that cannot reach the database still knows whose password was changed. */
const GATE_USERS_KEY = "ncm_system_gate_users";
async function gateUsers(){
  if(!ONLINE || !GATE || blocked()) return;
  if(!USERS_IN){ if(!USERS.length) return; USERS_IN = USERS.slice(); }
  let got = null;
  try{ got = await gateCall("users", {}); try{ localStorage.setItem(GATE_USERS_KEY, JSON.stringify(got)); }catch(x){} }
  catch(e){ try{ got = JSON.parse(localStorage.getItem(GATE_USERS_KEY) || "null"); }catch(x){} }
  if(!got || !USERS_IN) return;
  const off = new Set(got.off || []), whole = u => u && u.name && u.salt && u.iv && u.data, built = n => USERS_IN.some(x => x.name === n);
  const more = (got.users || []).filter(whole).map(u => built(u.name) ? Object.assign({}, u, { over: "viewer" }) : u);
  const adm = (got.admins || []).filter(u => whole(u) && built(u.name)).map(u => Object.assign({}, u, { over: "admin" }));
  const now = USERS_IN.concat(more, adm).filter(u => !off.has(u.name)), sig = list => JSON.stringify(list.map(u => u.name + u.iv + (u.over || "")));
  if(sig(now) === sig(USERS)) return;
  const picked = gateUser();
  USERS = now;
  if($("gate").hidden || gateBusy) return;
  gateIdx = picked ? gateNames().indexOf(picked.name) : -1;
  paintNames(); paintUser();
}

// A wrong PIN. It answers how many tries are left; at none, the device has just been locked.
async function noteFail(name){
  let left;
  try{ const r = await gateCall("wrong", { p_tag: deviceTag(), p_user: name }); left = r.blocked ? 0 : +r.left || 0; }
  catch(e){                                         // the database is out of reach: counted here, and told as soon as it can be
    let n = 1;
    try{ n = (+localStorage.getItem(FAIL_KEY) || 0) + 1; localStorage.setItem(FAIL_KEY, String(n)); }catch(x){}
    left = Math.max(0, MAX_WRONG - n);
  }
  if(left > 0) return left;
  blockHere();
  return 0;
}

function permitText(p){
  if(p.auto === "pending") return t("cPending");

const idb = (() => {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("ncm_system", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  async function get(k){
    try{
      const d = await db();
      return await new Promise((res, rej) => {
        const q = d.transaction("kv").objectStore("kv").get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    }catch(e){ return undefined; }
  }
  async function set(k, v){
    try{
      const d = await db();
      await new Promise((res, rej) => {
        const tx = d.transaction("kv", "readwrite");
        if(v === null || v === undefined) tx.objectStore("kv").delete(k); else tx.objectStore("kv").put(v, k);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
      return true;
    }catch(e){ return false; }
  }
  return { get, set };
})();

/* ============================================================
   LIVE LINK TO THE SHEETS
   Every few seconds each workbook is asked for one byte. The reply carries
   the time it was last saved, and costs a few milliseconds; only when that
   time has moved is the workbook actually read again. A save in Excel shows
   up here on its own, with nothing to press.
   ============================================================ */
const LIVE = location.protocol === "file:";
const RESUME_KEY = "ncm_system_resume";
/* A window that reloads itself to take a newer copy of the system comes back
   where it was: the page, the open sender, what was typed into the search.
   It is kept for the length of the reload only, in this tab only. */
function keepPlace(){

}
function takePlace(use){
  try{

    sessionStorage.removeItem(RESUME_KEY);
    if(!was || !use) return;                  // online, with nobody signed in, what was kept is simply dropped
    if(document.querySelector('#nav button[data-view="' + was.view + '"]')) st.view = was.view;

    st.multi.text = was.text || ""; if(was.mode === "veh" || was.mode === "ind") st.multi.mode = was.mode;

}
const seen = { per: "", emp: "" };          // the save time of what is on screen
/* Is each sheet where it is meant to be? A sheet that has been moved or
   renamed cannot be re-read: what is on screen is then the last copy, growing
   older by the day. That must be said out loud rather than left looking live. */
const reach = { per: null, emp: null };
const lost = kind => live === true && reach[kind] === false;
let live = null;                            // null: not tried yet · true: reading the disk · false: the browser will not let us
let syncing = false;
function ask(kind, whole){
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    try{
      x.open("GET", fileURL(SOURCES[kind]));
      x.responseType = "arraybuffer";
      if(!whole) x.setRequestHeader("Range", "bytes=0-0");
      x.onload = () => resolve({ stamp: x.getResponseHeader("last-modified") || "", buf: x.response });
      x.onerror = () => resolve(null);
      x.send();
    }catch(e){ resolve(null); }
  });
}
async function sync(force){
  if(!LIVE || syncing) return;
  syncing = true;
  const fresh = [];
  let reached = 0, moved = false;
  try{
    for(const kind of ["per", "emp"]){
      const head = await ask(kind, false);
      if(reach[kind] !== !!head){ reach[kind] = !!head; moved = true; }
      if(!head) continue;
      reached++;
      if(!force && DATA[kind] && (!head.stamp || head.stamp === seen[kind])) continue;
      // Excel replaces the file as it saves; a read that lands in the middle
      // fails or parses to nonsense. Either way nothing is kept and the next
      // tick tries again — what is on screen stays until a clean read lands.
      try{
        const got = await ask(kind, true);
        if(!got || !got.buf) continue;
        const payload = await NCM.readFile({
          name: SOURCES[kind].split("/").pop(), size: got.buf.byteLength,
          lastModified: got.stamp ? Date.parse(got.stamp) : Date.now(),
          arrayBuffer: async () => got.buf
        });
        if(payload.kind !== kind) continue;
        payload.stamp = got.stamp; payload.path = SOURCES[kind];
        DATA[kind] = payload; seen[kind] = got.stamp;
        idb.set(kind, payload);
        fresh.push(kind);
      }catch(e){ console.warn("[NCM SYSTEM] " + kind + " not readable yet", e); }
    }
  }finally{ syncing = false; }
  const was = live;
  live = reached > 0;
  if(fresh.length){
    rebuild(true);
    // said only for a save that arrives while the system is open, not for the first read
    if(was !== null && !force) toast(t("updated", fresh.map(sheetName).join(t("and"))));
  }
  else if(was !== live || moved){ paintShell(); if(st.view === "src" || (!DATA.emp && !DATA.per)) render(); }
  return fresh;
}
async function refresh(){
  if(ONLINE){
    await cloudSync();
    const ok = net.per !== false && net.emp !== false;
    return toast(t(ok ? "reread" : "rereadFail"), !ok);
  }
  if(live){
    const fresh = await sync(true);
    const ok = !!(fresh && fresh.length);
    return toast(t(ok ? "reread" : "rereadFail"), !ok);
  }
  const kinds = ["per", "emp"].filter(k => HANDLES[k]);
  if(!kinds.length) return pick();
  const items = [];
  try{
    for(const k of kinds){
      const h = HANDLES[k];
      let perm = await h.queryPermission({ mode: "read" });
      if(perm !== "granted") perm = await h.requestPermission({ mode: "read" });
      if(perm !== "granted") continue;
      items.push({ kind: k, file: await h.getFile(), handle: h });
    }
  }catch(e){
    console.warn(e);
    toast(t("oldFilesFail"), true);
    return pick();
  }
  if(!items.length) return pick();
  // an unchanged file is not read again; the one that was saved since is
  const changed = items.filter(it =>
    !(DATA[it.kind] && DATA[it.kind].lastModified === it.file.lastModified && DATA[it.kind].size === it.file.size));
  if(!changed.length){ rebuild(); return toast(t("noNewSave")); }
  return takeFiles(changed);
}
/* ============================================================
   ONLINE — signing in, and the two sources read over the network
   ============================================================ */
const SESSION_KEY = "ncm_system_session", LAST_USER_KEY = "ncm_system_user", BUILT_KEY = "ncm_system_built";
let session = null;                          // { v, u: the user's name, k: his unsealed key } — in this tab only, never on disk for good
const net = { per: null, emp: null };        // did the last read of each source get through?
const sig = { per: "", emp: "" };            // fingerprint of what was read last, to tell "changed" from "the same again"
let cloudBusy = false, cloudTimer = null, lastCloud = 0;
let cloudGen = 0;                            // moves on at every sign-out: a read begun before it is thrown away when it lands
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function fingerprint(s){
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return s.length + ":" + (h >>> 0);
}
// Throws when the password is wrong: AES-GCM refuses to authenticate the blob.
async function unseal(user, pass){
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(user.salt), iterations: KDF_ROUNDS, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(user.iv) }, key, b64(user.data)));
}
function parseCSV(text){
  const rows = []; let row = [], cell = "", quoted = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(quoted){
      if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    }
    else if(ch === '"') quoted = true;
    else if(ch === ","){ row.push(cell); cell = ""; }
    else if(ch === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(ch !== "\r") cell += ch;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
/* The permits, exactly the way the app fetches them: the sheet's CSV export,
   tab by tab. The export wants a tab's gid, and every upload replaces the tabs
   and so changes the gids — they are looked up by NAME on each read. Only if
   that fails is gviz used: it blanks text cells in a column that is mostly
   dates, so a read that came that way is marked as a fallback. */
async function cloudPermits(key, at){
  const gids = {}, BS = String.fromCharCode(92), SHEET = at.sheet;
  try{
    const r = await fetch(SHEET + "/htmlview?_=" + Date.now(), { cache: "no-store" });
    if(r.ok){
      const html = await r.text(), re = /items\.push\(\{name: "((?:[^"\\]|\\.)*)"[\s\S]*?gid: "(\d+)"/g;
      let m;
      while((m = re.exec(html))){
        try{ gids[JSON.parse('"' + m[1].replace(/\\x([0-9a-fA-F]{2})/g, BS + "u00$1") + '"')] = m[2]; }catch(e){}
      }
    }
  }catch(e){}
  let fallback = false;
  /* What comes back has to be the tab's rows. Google sometimes answers with a
     web page instead — an error page, a sign-in page — and says 200 all the
     same; read as rows, that page emptied the permits and every search said
     "not in the sheet". A page, or nothing at all, is a read that failed: what
     is on screen stays, and the sheet is shown as out of reach. */
  const isRows = text => !!text.trim() && !/^\s*</.test(text);
  const tab = async name => {
    if(gids[name]){
      const r = await fetch(SHEET + "/export?format=csv&gid=" + gids[name] + "&_=" + Date.now(), { cache: "no-store" });
      if(r.ok){ const text = await r.text(); if(isRows(text)) return text; }
    }
    fallback = true;
    const g = await fetch(SHEET + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(name) + "&_=" + Date.now(), { cache: "no-store" });
    if(!g.ok) throw new Error("sheet " + g.status);
    const text = await g.text();
    if(!isRows(text)) throw new Error("the sheet answered with a page, not rows");
    return text;
  };
  const texts = await Promise.all([tab(CLOUD.tabs.ind), tab(CLOUD.tabs.veh)]);
  const shape = (text, maxCol) => {
    const rows = parseCSV(text);
    return { header: (rows[0] || []).slice(0, maxCol),
             rows: rows.slice(1).map((c, i) => ({ n: i + 2, c: c.slice(0, maxCol) })).filter(r => r.c.some(v => v !== "")) };
  };
  return { kind: "per", cloud: true, fallback, fileName: "Google Sheet", lastModified: Date.now(), loadedAt: Date.now(),
           size: texts[0].length + texts[1].length, sheets: { ind: shape(texts[0], 16), veh: shape(texts[1], 8) } };
}
/* The staff table, a page at a time: a plain select hands back the first 1000
   rows and says nothing about the rest. Ordering by id is what makes the pages
   line up. The rows are handed to the model in the shape of the sheet — same
   column names, same order — so one set of rules serves both editions. */
async function cloudEmployees(key, at){
  const recs = [], PAGE_ROWS = 1000;
  for(let from = 0; ; from += PAGE_ROWS){
    const r = await fetch(at.db + "/rest/v1/employees?select=*&order=id.asc&limit=" + PAGE_ROWS + "&offset=" + from,
      { headers: { apikey: key, Authorization: "Bearer " + key }, cache: "no-store" });
    if(r.status === 401 || r.status === 403){ const e = new Error("refused"); e.code = "AUTH"; throw e; }
    if(!r.ok) throw new Error("database " + r.status);
    const part = await r.json();
    recs.push(...part);
    if(part.length < PAGE_ROWS) break;
  }
  if(!recs.length) throw new Error("the database answered with no rows");
  const header = Object.keys(NCM.EMP_COLS);
  const text = v => (v === null || v === undefined) ? "" : String(v);
  return { kind: "emp", cloud: true, fileName: "employees", lastModified: Date.now(), loadedAt: Date.now(), size: recs.length,
           sheets: { emp: { header, rows: recs.map((rec, i) => ({ n: i + 2, c: header.map(h => text(rec[NCM.EMP_COLS[h]])) })) } } };
}
async function cloudSync(first){
  if(cloudBusy || !session) return [];
  cloudBusy = true; lastCloud = Date.now();

  const fresh = [];

  await Promise.all([["per", cloudPermits], ["emp", cloudEmployees]].map(async job => {
    const kind = job[0];
    try{
      const payload = await job[1](key, at);
      if(gen !== cloudGen) return;           // signed out while this was on its way: none of it is kept
      // a read that could only be had the poor way — it blanks the text cells of the permit column, the bans among them — never replaces a complete one
      if(payload.fallback && DATA[kind] && !DATA[kind].fallback) throw new Error("only the fallback read answered; the complete read on screen is kept");
      if(net[kind] !== true){ net[kind] = true; moved = true; }

      }

  cloudBusy = false;

  if(refused){ signOut(t("sessionEnded")); return []; }

}

    // what the PIN opens: the key, and with it where the data is kept. A PIN that opens nothing is a wrong try — that, and nothing else, is counted
    let got = null;
    for(const seal of USERS.filter(u => u.name === user.name)){
      try{
        const o = JSON.parse(await unseal(seal, pin.value));
        // the page's own seal of a way in whose password was changed since: the old password is a wrong one
        if(!seal.over && USERS.some(x => x.name === seal.name && x.over === (o.role === "admin" ? "admin" : "viewer"))) continue;
        got = o; break;
      }catch(x){}
    }
    // a password changed from the ADMIN page: the seal kept in the database takes the place of the page's own
    if(got && !ONLINE) got = await sealOver(got, user.name, pin.value);
    if(!got){
      // on this PC's own copy nothing is locked and nothing is counted: a wrong PIN is simply a wrong PIN
      if(!ONLINE){
        err.className = "gate-err"; err.textContent = t("connectBad");
        const own = $("gate-form");
        own.classList.add("shake"); setTimeout(() => own.classList.remove("shake"), 400);
        pin.value = ""; paintBoxes(); pin.focus();
        return;
      }
      const left = await noteFail(user.name);
      if(!left){ pin.value = ""; return showGate(); }      // the third wrong PIN: the device is locked, and the gate says so
      err.className = "gate-err"; err.textContent = t("wrongLeft", left);
      const card = $("gate-form");
      card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 400);
      pin.value = ""; paintBoxes(); pin.focus();
      return;
    }
    // …and what this user is, the salt and token of the lists kept in the database, and a name for this visit in the activity log
    session = { v: SESSION_V, u: user.name, k: got.k, src: { sheet: got.sheet || "", db: got.db || "", bucket: got.bucket || "" },
                role: got.role === "admin" ? "admin" : "viewer", rs: got.rs || "", rt: got.rt || "",
                sid: [].map.call(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, "0")).join(""), at: Date.now(), seen: Date.now() };
    lastTouch = session.seen;
    keepSession();
    try{ localStorage.removeItem(FAIL_KEY); }catch(x){}
    // the device is made known — and one the admin has locked is refused even with the right PIN
    let dev = null;
    const mine = session;
    try{ dev = await dbCall("system_gate_ok", { p_device: deviceId(), p_tag: deviceTag(), p_user: user.name }); }catch(x){}
    if(session !== mine) return;                    // signed out again while the database was being told: that sign-in is over
    if(dev && dev.blocked){ blockHere(); session = null; try{ sessionStorage.removeItem(SESSION_KEY); }catch(x){} pin.value = ""; return showGate(); }
    await permsSync();                              // what is in his menu — before the first page is drawn
    if(session !== mine) return;                    // switched off: he is back at the gate
    logAct("in");
    pin.value = ""; paintBoxes(); pin.blur();
    err.className = "gate-err"; err.textContent = "";
    $("gate").hidden = true;
    if(ONLINE) startOnline(); else startLocal();
  }finally{ gateBusy = false; }
}
/* A PASSWORD CHANGED FROM THE ADMIN PAGE, as this PC's own copy sees it. The page carries its own seals (the ones it
   was built with); a password given later from ADMIN is sealed in the database instead. Online the gate is told of
   those before anyone types (gateUsers); here there is nothing to ask with until a PIN has opened something — so the
   page's own seal is opened first, and what it opens is then asked whether this way in has another seal now. If it
   has, that one has to open with the same PIN; if it does not, the password was changed and this is not it. A
   database out of reach leaves this PC's own seal as it was: he can still get into his own copy. */
async function sealOver(got, name, pin){
  let said = null;
  try{
    const r = await fetch(got.db + "/rest/v1/rpc/system_gate_users", { method: "POST", cache: "no-store",
      headers: { apikey: got.k, Authorization: "Bearer " + got.k, "Content-Type": "application/json" },
      body: JSON.stringify({ p_token: got.rt, p_device: deviceId() }) });
    if(r.ok) said = await r.json();
  }catch(e){}
  if(!said) return got;
  if((said.off || []).indexOf(name) >= 0) return null;                    // switched off from ADMIN
  const over = ((got.role === "admin" ? said.admins : said.users) || []).filter(u => u && u.name === name && u.salt && u.iv && u.data);
  if(!over.length) return got;
  for(const seal of over){
    try{ return JSON.parse(await unseal(seal, pin)); }catch(e){}
  }
  return null;
}
/* The unsealed key lives in sessionStorage: it survives a reload of the tab
   and is gone the moment the browser is closed — so a PC that is walked away
   from does not stay signed in for good — and a session left untouched for
   IDLE_MS is closed by the page itself. The time of the last touch is kept
   with the key, so reloading the tab does not start the clock again. */
const IDLE_MS = 30 * 60 * 1000;
let lastTouch = Date.now();
function keepSession(){ try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){} }
const idleTooLong = () => !!session && Date.now() - lastTouch > IDLE_MS;
// A touch after too long a silence does not count as a touch: it closes the session instead.
function idleOut(){ logAct("idle"); signOut(t("idleOut")); }
function touched(){ if(idleTooLong()) idleOut(); else lastTouch = Date.now(); }
function idleTick(){
  if(!session) return;
  if(idleTooLong()) return idleOut();
  if(session.seen !== lastTouch){ session.seen = lastTouch; keepSession(); }
}
function signOut(message){
  session = null;
  appOffer();                                     // the app is offered to the admin alone: it goes with him
  cloudGen++; cloudBusy = false;
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  clearInterval(cloudTimer); cloudTimer = null;
  // nothing that was read stays behind in the page once its reader has left
  DATA.emp = DATA.per = null; sig.per = sig.emp = ""; net.per = net.emp = null;
  st.multi.text = ""; st.multi.res = null;
  st.spc.text = ""; st.spc.res = null; st.spc.cat = ""; st.multi.cat = ""; st.ase.cat = "";
  CMP.res = null; CMP.of = null; CMP.cat = "";
  st.ask.text = ""; st.ask.res = null; st.ask.cat = "";
  Object.keys(PICK).forEach(k => delete PICK[k]);
  st.ase.text = ""; st.ase.res = null; ASE.info = null; DESK.orders = []; DESK.beat = 0;      // the ASE list and its answers, and the desk's orders, go with him
  st.emp.q = st.ind.q = st.veh.q = ""; st.snd = { kind: "per", q: "", open: null, tab: "ind" }; st.rnw = { q: "", open: null, tab: "" }; st.view = "multi";
  st.month = "";
  RENEW = []; renewAt = 0; hashes.clear(); renewIndex = new Map(); indexFor = null; LOG = []; DEVICES = []; logWho = ""; $("nb-log").textContent = "";
  HIST = [];                                        // out of the page; what is kept on the device stays sealed
  shownPage = "";                                   // whoever signs in next sees his first page arrive
  if(SEALED_SOURCES) CLOUD.sheet = CLOUD.db = CLOUD.bucket = "";
  // the card that was last open is emptied, not just hidden: it holds a person and the address of his photos
  $("dr-b").innerHTML = ""; $("dr-t").textContent = ""; $("zoom-img").removeAttribute("src"); $("zoom").classList.remove("on");
  trail.length = 0;
  closeDrawer();

}

/* `quiet` is for a sheet that changed underneath an open page: the figures are
   redrawn where they stand, and a box someone is typing in is left alone —
   redrawing the whole page would take the cursor out of his hands. */
function rebuild(quiet){
  builtDay = NCM.today0().getTime();
  M = NCM.buildModel(DATA);
  if(st.multi.res) runMulti();          // the list stays; its answers come from the new sheets
  paintShell();
  if(quiet && st.view === "multi" && $("mt")) return paintMulti(true);
  if(quiet && LISTS[st.view] && $("tbl") && M[LISTS[st.view].need]) return paintTable(st.view, true);
  const listPage = st.view === "snd" || st.view === "rnw";
  if(quiet && listPage && sndState().open === null && $("tbl")){ buildSenders(); return (st.view === "rnw" ? paintRenew : paintSenders)(); }
  if(quiet && listPage && $("tbl")){ const at = rowsAt($("tbl")); render(); return rowsTo($("tbl"), at); }

/* A NEW DAY. Every status — valid, about to run out, run out — and every count
   of days left is worked out against today's date at the moment the sheets are
   read. A window left open past midnight went on showing yesterday's: a permit
   that ran out at midnight stayed valid on screen until a sheet happened to
   change. The day the figures were worked out for is remembered; when it is no
   longer today they are worked out again, where they stand. */
let builtDay = NCM.today0().getTime();
function newDay(){
  if(NCM.today0().getTime() === builtDay || (!DATA.emp && !DATA.per)) return;
  rebuild(true);
}

/* BACK. Every move from one page to another leaves behind what that page was
   showing — which page, and how its list was filtered and sorted — and Back
   puts exactly that on screen again. What is typed into the search page and
   its answers are not part of it: they stay as they are whichever way you go. */
const trail = [];
const where = () => JSON.stringify({ view: st.view, emp: st.emp, ind: st.ind, veh: st.veh, snd: st.snd, rnw: st.rnw });
function leave(){

/* EVERY PAGE IS TWO PARTS. A head that never moves — the mark, the title, the
   page's own buttons and filters — and under it the one part that scrolls,
   with a bar of its own. `body` arrives already wrapped in whichever of the
   two movers it is: .pg-scroll for a page of boxes, .pg-table for a table
   (there the rows move and the column names stay with the head). */
const BRAND =
  '<div class="brand cbrand">' +
    '<span class="ncm">N<i>C</i><b>M</b></span>' +
    '<span class="tagline">NUCLEAR CONCRETE MIXES</span>' +
    '<span class="hr"></span>' +
    '<span class="appname">SYSTEM</span>' +
  "</div>";
let shownPage = "", enterTimer = null;
function page(head, body){
  out.innerHTML = '<div class="pg-fixed">' + BRAND + head + "</div>" + body;
  /* Opened, or only redrawn? The page is the same page while it is the same
     view, showing the same sender's sheet (or none), with something read or
     nothing. Only a page that was not on screen a moment ago arrives with
     movement (see "boxes arriving" in the styles). */
  const key = [st.view, st.snd.kind, st.snd.open, st.rnw.open, DATA.emp || DATA.per ? 1 : 0].join("|");
  const opened = key !== shownPage;
  shownPage = key;
  freeze();
  clearTimeout(enterTimer);
  out.classList.toggle("enter", opened);
  if(!opened) return;
  enterTimer = setTimeout(() => out.classList.remove("enter"), 1200);
  countUp();
  logAct("page", { v: st.view, o: st.view === "snd" || st.view === "rnw" ? (sndState().open || "") : "" });
}
/* The figures in the boxes run up to their value as the boxes arrive. The
   value itself is what the box was drawn with: the run is set by the clock,
   not by counting frames, so a window that was not being looked at shows the
   true figure the moment it is, and a box that has left the page is let be. */
function countUp(){
  if(document.hidden || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  const els = [].filter.call(out.querySelectorAll(".tile-v"), el => /^\d+$/.test(el.textContent) && +el.textContent > 0);
  if(!els.length) return;
  const ends = els.map(el => +el.textContent), t0 = performance.now(), RUN = 700;
  const put = k => els.forEach((el, i) => { if(el.isConnected) el.textContent = k >= 1 ? ends[i] : Math.round(ends[i] * k); });
  const step = now => {
    const x = Math.min(1, (now - t0) / RUN);
    put(x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));
    if(x < 1) requestAnimationFrame(step);
  };
  put(0);
  requestAnimationFrame(step);
  setTimeout(() => put(1), RUN + 400);          // whatever became of the frames, the true figure is there in the end
}
