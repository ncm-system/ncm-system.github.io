  for(let i = 0; i < 12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    buckets.push({ y: d.getFullYear(), m: d.getMonth(), n: 0 });
  }
  // a month that has dropped off the front of the chart takes its list with it
  if(st.month && !buckets.some(b => b.y + "-" + b.m === st.month)) st.month = "";
  expiring(st.chart).forEach(x => {
    const d = x[0];
    if(d < now) return;
    const i = (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth();
    if(i >= 0 && i < 12) buckets[i].n++;
  });
  const max = Math.max(1, ...buckets.map(b => b.n));
  // a month with permits in it is a button (its list opens under the chart); an empty month is not
  return '<div class="cols">' + buckets.map(b => {
      const k = b.y + "-" + b.m, tag = b.n ? "button" : "div";
      return "<" + tag + (b.n ? ' type="button" data-month="' + k + '"' : "") + ' class="col' + (b.n ? "" : " zero") + (st.month === k ? " on" : "") +
        '" data-tip="' + esc(t("monthTip", MONTHS[lang][b.m], b.y, b.n)) + '">' +
        (b.n ? '<span class="col-v num">' + b.n + "</span>" : "") +
        '<span class="col-bar" style="height:' + (b.n / max * 100).toFixed(1) + '%"></span></' + tag + ">";
    }).join("") + "</div>" +
    '<div class="cols-x">' + buckets.map(b => '<span class="num' + (st.month === b.y + "-" + b.m ? " on" : "") + '" data-m="' + b.y + "-" + b.m + '">' +
      String(b.m + 1).padStart(2, "0") + "/" + String(b.y).slice(2) + "</span>").join("") + "</div>";
}
/* THE MONTH'S LIST. A column of the chart is the permits that run out in one
   month. Pressed, it lists them under the chart in a box of its own — the
   nearest end first — and every row opens its card, as the rows of the box
   below it do. Pressing the column again, or the ✕, puts the list away; the
   other two kinds (people, vehicles, staff) show the same month of theirs. */
function monthListHTML(arrive){
  if(!st.month) return "";
  const now = NCM.today0(), kind = st.chart, ym = st.month.split("-");
  const rows = expiring(kind).filter(x => x[0] >= now && monthKey(x[0]) === st.month).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  return '<section class="panel monthlist' + (arrive ? " arrive" : "") + '"><div class="panel-h"><h3 class="panel-t">' +
      esc(t("monthListT", MONTHS[lang][+ym[1]], ym[0], t(kind === "emp" ? "segEmp" : kind === "ind" ? "segInd" : "segVeh"))) + "</h3>" +
      '<div style="display:flex;align-items:center;gap:10px"><span class="count">' + t("rows", rows.length) + "</span>" +
      '<button class="btn sm" data-act="month-x" aria-label="' + t("close") + '">✕</button></div></div>' +
    (rows.length ? boxTable(kind, rows, true) : '<div class="empty"><h3>' + t("none") + "</h3></div>") + "</section>";
}
// the chart shows which month is open; the list is drawn under it — and, when a column was just pressed, brought into view
function paintMonth(arrive){
  [].forEach.call($("months").querySelectorAll("[data-month],[data-m]"), el => el.classList.toggle("on", (el.dataset.month || el.dataset.m) === st.month));
  const box = $("monthlist");
  box.innerHTML = monthListHTML(arrive);
  freeze();
  if(arrive && st.month) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
/* One box per standing, each a count of its own — «في انتظار الرد» and
   «غير محدد» are separate boxes, never one sum. A standing the row does not
   normally show (a ban on a vehicle, say) gets a box the day it has anyone in
   it, so the boxes always add up to the first one. */
const CAT_TILE = { ok:["cOk","ok"], soon:["cSoon","warn"], expired:["cExpired","bad"], ban:["cBan","ban"],
                   renew:["cRenew","bad"], temp:["cTemp","mute"], pending:["cPending",""], undet:["cUndet","mute"] };
function permitTiles(view, totalLabel, total, c, show){
  const cats = show.concat(Object.keys(CAT_TILE).filter(k => show.indexOf(k) === -1 && c[k]));
  const n = cats.length + 1;
  return '<div class="tiles" style="--n:' + n + ";--half:" + Math.ceil(n / 2) + '">' +
    tile(totalLabel, total, "job", view + ":all") +
    cats.map(k => tile(t(CAT_TILE[k][0]), c[k] || 0, CAT_TILE[k][1], view + ":" + k, k === "soon" && c[k] > 0)).join("") + "</div>";
}

/* THE REPORT (asked for, 6 October 2026): the dashboard's figures on one sheet of paper, for whoever is shown the
   system — today's date, every figure the three lists' own boxes count (so a figure here and the list it stands for
   are the same people), the companies, and what ends in each of the next twelve months. Opened from the dashboard. */
function renderRep(){
  const kpis = (view, title) => {
    const L = LISTS[view], all = L.all();
    return '<h3 class="rep-h">' + title + '</h3><div class="rep-kpis">' + L.chips.map(pair => {
      const n = countBy(all, r => L.pick(r, pair[0]));
      const tone = { valid: "ok", ok: "ok", expiring: "warn", soon: "warn", expired: "bad", banned: "ban", ban: "ban" }[pair[0]] || "";
      return !n && pair[0] !== "all" ? "" : '<button type="button" class="rep-k ' + tone + '" data-go="' + view + ":" + pair[0] + '"><b>' + n.toLocaleString("en-US") + "</b><span>" + t(pair[1]) + "</span></button>";
    }).join("") + "</div>";
  };
  let h = '<div class="rep-date">' + esc(fmt(NCM.today0())) + "</div>";
  if(M.emp) h += kpis("emp", t("navEmp"));
  if(M.ind) h += kpis("ind", t("navInd"));
  if(M.veh) h += kpis("veh", t("navVeh"));
  let left = "", right = "";
  if(M.ind){
    const by = new Map();
    M.ind.list.forEach(g => { const k = g.cur.company || t("unspecified"); if(!by.has(k)) by.set(k, { n: 0 }); const c = by.get(k); c.n++; c[g.p.cat] = (c[g.p.cat] || 0) + 1; });
    const rows = [...by.entries()].sort((a, b) => b[1].n - a[1].n), top = rows.slice(0, 12), rest = rows.slice(12);
    if(rest.length){ const c = { n: 0 }; rest.forEach(r => Object.keys(r[1]).forEach(k => { c[k] = (c[k] || 0) + r[1][k]; })); top.push([t("otherCompanies"), c]); }
    const cats = ["ok", "soon", "expired", "ban"];
    left = '<section class="panel"><div class="panel-h"><h3 class="panel-t">' + t("repCompanies") + '</h3></div><div class="tblwrap"><table class="tbl plain"><thead><tr><th class="nos">' + t("colCompany") + '</th><th class="nos">' + t("colTotal") + "</th>" +
      cats.map(k => '<th class="nos">' + t(CAT_TILE[k][0]) + "</th>").join("") + "</tr></thead><tbody>" +
      top.map(r => "<tr><td>" + esc(r[0]) + "</td><td><b>" + num(r[1].n) + "</b></td>" + cats.map(k => "<td>" + (r[1][k] ? num(r[1][k]) : dimDash) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div></section>";
  }
  const kinds = [["emp", "segEmp", M.emp], ["ind", "segInd", M.ind], ["veh", "segVeh", M.veh]].filter(k => k[2]);
  if(kinds.length){
    const now = NCM.today0(), months = [];
    for(let i = 0; i < 12; i++){ const d = new Date(now.getFullYear(), now.getMonth() + i, 1); months.push({ d, n: {} }); }
    kinds.forEach(k => expiring(k[0]).forEach(x => {
      const d = x[0], i = (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth();
      if(d >= now && i >= 0 && i < 12) months[i].n[k[0]] = (months[i].n[k[0]] || 0) + 1;
    }));
    const name = d => d.toLocaleDateString(isEN() ? "en-GB" : "ar-EG-u-nu-latn", { month: "long", year: "numeric" });
    right = '<section class="panel"><div class="panel-h"><h3 class="panel-t">' + t("monthsTitle") + '</h3></div><div class="tblwrap"><table class="tbl plain"><thead><tr><th class="nos">' + t("repMonth") + "</th>" +
      kinds.map(k => '<th class="nos">' + t(k[1]) + "</th>").join("") + "</tr></thead><tbody>" +
      months.map(m => "<tr><td>" + esc(name(m.d)) + "</td>" + kinds.map(k => "<td>" + (m.n[k[0]] ? num(m.n[k[0]]) : dimDash) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div></section>";
  }
  h += '<div class="rep-two">' + left + right + "</div>";
  page(pgHead(t("repTitle"), '<div class="pg-acts noprint"><button class="btn sm primary" data-act="print">' + t("print") + "</button></div>"), scrollPart(h));
}

function empSheet(list, opt){

  const standing = x => ({ v: stLabel(x) + (x.resigned ? " (" + t("resigned") + ")" : ""), tone: x.resigned ? "bad" : XTONE[x.st.k] || "",

    ["colStatus", "nowrap", standing], ["colPermitDate", "nowrap", x => x.pdate ? fmt(x.pdate) : x.permit_date]

/* «تصدير Excel» writes a real workbook: what is on screen — the same rows, in
   the same order, under the same filters — as a ruled table under the

const XTONE = { ok: "ok", warn: "warn", bad: "bad", ban: "bad", mute: "mute" };

const permitBan = g => !!g && g.p.cat === "ban";

async function saveXLSX(sheet, name){
  exportRows = sheet.rows ? sheet.rows.length : (sheet.sheets || []).reduce((n, x) => n + ((x && x.rows) || []).length, 0);

function saveBytes(bytes, name){
  if(!can("x-export")) return;

  exportRows = 0;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = name + " " + today().replace(/\//g, "-") + ".xlsx";

/* ============================================================
   SEARCH — a list goes in, one line each; a row per line comes out, in the
   same order, and a line that matched nobody keeps its row so the gap is
   seen rather than skipped.
   ============================================================ */
const MULTI_CAP = 5000;                     // per line: more than either sheet holds, so everything a line finds is shown — a guard, not a limit anyone meets
/* SEARCH HISTORY. Every search that is run is remembered — the list as it was
   typed, whether it was people or vehicles (employees are found under people),
   how many lines, when — newest first, the same search never twice. The small
   arrow beside the search box opens it; a line in it puts that list back in
   the box and runs it again.
   «ASE SEARCH» and «بحث خاص» have theirs too (asked for, 6 October 2026): the
   same arrow, the same list — each page showing and clearing its own searches
   only, HIST_MAX of them a page. A special search is kept with what it asked by.
   Where it is kept: on this PC the list is this PC's own. Online it is kept
   SEALED with the reader's own key (AES-GCM), a list per user: without the
   PIN it is noise, like everything else the online edition holds. */
const HIST_KEY = "ncm_system_history", HIST_MAX = 40;
const HIST_PAGE = { ind: "multi", veh: "multi", ase: "ase", spc: "spc", ask: "ask" };       // which page a kept search belongs to
const histHere = () => st.view === "ase" || st.view === "spc" || st.view === "ask" ? st.view : "multi";
let HIST = [];
const histSlot = () => HIST_KEY + ":" + (session ? session.u : "");
const toB64 = bytes => { let s = ""; for(let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); };
async function histCrypt(){
  const raw = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(session.k + "|ncm-system-history"));
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
}
async function histLoad(){
  HIST = [];
  try{
    if(!session) return;
    const kept = localStorage.getItem(histSlot());
    if(!kept) return;
    const o = JSON.parse(kept);
    const list = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(o.iv) }, await histCrypt(), b64(o.data))));
    // what comes off the disk is taken for nothing more than what it should be
    if(Array.isArray(list)) HIST = list.filter(x => x && typeof x.t === "string" && x.t).slice(0, HIST_MAX * 3)
      .map(x => Object.assign({ m: HIST_PAGE[x.m] ? x.m : "ind", t: x.t.slice(0, 6000), n: +x.n || 0, f: +x.f || 0, at: +x.at || 0 },
        x.m === "spc" ? { by: SPC_BY.indexOf(x.by) < 0 ? "place" : x.by } : null));
  }catch(e){ HIST = []; }

       or one id typed with a space in it. Fourteen digits in all is one
       national id however it was spaced ("2990102 2020231" is a man, not two
       half-numbers); otherwise pieces long enough to stand alone are separate
       entries, and anything else is one number with stray spaces. */

  };

    if(seenE.has(e.emp_code)) return;

      const g = M.ind && M.ind.byNid.get(d);

    }else{

      if(byCode) addE(byCode);

        if(M.ind) M.ind.list.forEach(g => { if(g.nid && g.nid.includes(d)) addG(g); });

       the closest first: the name that is exactly what was typed, then the
       names that hold it as it was typed, then the names that hold its words.
       ANY NAME WILL DO, even a single one. A name as common as «محمد» finds
       hundreds: of those only the first NAME_SHOW are listed (asked for so,

/* ============================================================
   «تجديد اليوم» — the one list both users feed and the admin alone sees.
   A «تجديد» button sits on every card. Pressed — by the admin or by a
   viewer — it puts that person or vehicle on a list kept in the database,
   so that a press on one PC shows on the other. The list has a page of its
   own, in the admin's menu only: the two renewal forms as they will be
   written — people (name, national id, NCM, job) and vehicles (type, plate,
   NCM) — and a file of each, named for the form and the day.
   WHAT THE DATABASE HOLDS is not who was pressed but a salted hash of it
   (the national id, the employee's code, the plate): the page that asks for
   the list finds each hash again among the people and vehicles it has read
   itself. Two tokens guard the list and the database tells them apart, so
   taking rows out is the admin's and nobody else's however a page is
   rewritten. Token and salt arrive sealed with the user's key.
   ON THIS PC'S OWN COPY nobody signs in, so nothing has unsealed them: the
   admin gives his PIN once per window — on the page, or at the first press —
   and the copy is connected until that window is closed.
   ============================================================ */
const FORMS = {
  // their words and their widths, as the forms have them — the same in both languages
  per: { file: "تجديد افراد", header: ["مسلسل", "الاسم", "الرقم القومي", "الشركة", "الوظيفة"], widths: [6.5703125, 39.28515625, 21.28515625, 14.85546875, 23.5703125] },
  veh: { file: "تجديد مركبات", header: ["مسلسل", "موديل المركبة - اللون", "الحروف - الأرقام", "الشركة"], widths: [6.5703125, 39.28515625, 31.42578125, 14.85546875] }
};
const FORM_COMPANY = "NCM";                         // the company column says this for everyone, as asked
const LINK_KEY = "ncm_system_link";
let RENEW = [], renewAt = 0, renewBusy = false, renewErr = false, todaySig = "";
let localLink = null;
// (kept on this PC from then on — asked for, 6 October 2026: no page asks for the PIN again; the PIN is asked for once)
try{ if(!ONLINE) localLink = JSON.parse(localStorage.getItem(LINK_KEY) || sessionStorage.getItem(LINK_KEY) || "null"); }catch(e){}
// what the list is reached with: where the database is, its key, the salt of the hashes, this user's token, and who he is
// what the list is reached with — the same in both editions: what this user's PIN opened
const link = () => session && session.rt && session.src.db ? { db: session.src.db, k: session.k, rs: session.rs, rt: session.rt, u: session.u } : (ONLINE ? null : localLink);
const isAdmin = () => !!session && session.role === "admin";        // both editions: what the PIN opened says it
/* WHO SEES WHAT (asked for, 6 October 2026). The admin says, user by user, which pages are in his menu and what he
   may do on them; it is kept in the database (system_users.pages) and read at sign-in and every minute after, so a
   change reaches a window that is already open. No list at all means everything a user may see. The admin's own
   pages are never on anybody's list: they are his because he is the admin, and nobody else's menu, page or message
   says that there is one. This is what the page shows — the sheets a user's key reads are the same for all. */
const PERM_PAGES = ["multi", "spc", "ase", "home", "emp", "ind", "veh", "snd", "rnw", "check", "cmp"];
/* WHAT IS ADDED LATER IS A PERMISSION OF ITS OWN (asked for, 6 October 2026: «خلي اللي أنا حددته الصبح يظهر لمديري هو
   بس اللي يظهر لحد ما… أحدد لو عايز يظهرله حاجة تانية ولا لا»). A user whose pages were chosen has a list, and
   what is not on his list he does not have: so a new page, or a new thing on a page he has, is given a key of its
   own here — the report (x-report), a man's file on paper (x-card) — and is not his until the admin presses its
   chip. The red of a transfer letter on «ASE SEARCH» goes with the compare page (cmp), which is where it came from. */
const PERM_CAN = ["x-export", "x-renew", "x-aseup", "x-report", "x-card"];
const PERM_WORD = { "x-export": "canExport", "x-renew": "canRenew", "x-aseup": "canAseup", "x-report": "canReport", "x-card": "canCard" };
const ADMIN_VIEWS = { today: 1, log: 1, cards: 1, src: 1, adm: 1, ask: 1 };
const perms = () => ONLINE && session && session.role !== "admin" && Array.isArray(session.pages) ? session.pages : null;
const can = k => { const mine = perms(); return !mine || mine.indexOf(k) >= 0; };
const canSee = v => ADMIN_VIEWS[v] ? isAdmin() && !(v === "cards" && ONLINE) : (v === "rep" ? can("home") && can("x-report") : can(v));      // the report is the dashboard's, on paper
const firstPage = () => PERM_PAGES.find(can) || "none";
let permsTimer = null;
/* What he sees is also remembered on the device, user by user: a sign-in the database cannot be reached for opens on
   what it was last told, not on everything. And a token the database no longer knows — a user taken off the list —
   is a sign-in that is over. */
const PERMS_KEY = "ncm_system_pages";
async function permsSync(){
  if(!session || !link() || session.role === "admin") return;
  const mine = session, slot = PERMS_KEY + ":" + session.u;
  try{
    const me = await dbCall("system_user_me", { p_name: session.u });
    if(session !== mine || !me) return;
    if(me.off) return signOut(t("sessionEnded"));
    const pages = Array.isArray(me.pages) ? me.pages.map(String) : null;
    try{ if(pages) localStorage.setItem(slot, JSON.stringify(pages)); else localStorage.removeItem(slot); }catch(x){}
    if(JSON.stringify(pages) === JSON.stringify(session.pages || null)) return;
    session.pages = pages; keepSession();
    if($("gate").hidden){ paintShell(); render(); }
  }catch(e){
    if(session !== mine) return;
    if(/ answered 40[13]$/.test(String(e && e.message))) return signOut(t("sessionEnded"));
    if(session.pages === undefined){ try{ const kept = JSON.parse(localStorage.getItem(slot) || "null"); if(Array.isArray(kept)){ session.pages = kept.map(String); keepSession(); } }catch(x){} }
  }
}
async function sha256hex(s){
  const b = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)));
  return [].map.call(b, x => x.toString(16).padStart(2, "0")).join("");
}
// one of the system's own functions in the database, called with this user's token
async function dbCall(fn, args){
  const l = link();
  if(!l) throw new Error("not connected");
  const r = await fetch(l.db + "/rest/v1/rpc/" + fn, { method: "POST", cache: "no-store",
    headers: { apikey: l.k, Authorization: "Bearer " + l.k, "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ p_token: l.rt }, args)) });
  if(!r.ok) throw new Error(fn + " answered " + r.status);
  return r.status === 204 ? null : r.json();
}
const renewCall = (fn, args) => dbCall("system_renew_" + fn, args);
// What a card stands for on the list. A person is his national id wherever he is written — so the employee and the
// permit holder who are one man are one line — and failing that the employee's code, or the name the sheet groups him by.
const empId = e => !e.foreign && e.nid ? "N:" + e.nid : "E:" + e.emp_code;
const indId = g => g.nid ? "N:" + g.nid : "K:" + g.key;
function renewWho(ref){
  const i = ref.indexOf(":"), type = ref.slice(0, i), key = ref.slice(i + 1);
  if(type === "emp" && M.emp){ const e = M.emp.byCode.get(key); return e ? { src: "emp", id: empId(e) } : null; }
  if(type === "ind" && M.ind){ const g = M.ind.groups.get(key); return g ? { src: "ind", id: indId(g) } : null; }
  if(type === "veh" && M.veh){ const g = M.veh.groups.get(key); return g ? { src: "veh", id: "V:" + g.key } : null; }

   hash he would have on the list. Worked out once for each reading of the
   sheets (a hash already worked out is not worked out again). */
let indexFor = null, renewIndex = new Map();
async function renewResolve(){
  if(indexFor === M || !link()) return;
  const model = M, idx = new Map(), jobs = [];
  const put = async (id, k, rec) => { const h = await renewHash(id), o = idx.get(h) || {}; o[k] = rec; idx.set(h, o); };
  if(model.emp) model.emp.list.forEach(e => jobs.push(() => put(empId(e), "emp", e)));
  if(model.ind) model.ind.list.forEach(g => jobs.push(() => put(indId(g), "ind", g)));
  if(model.veh) model.veh.list.forEach(g => jobs.push(() => put("V:" + g.key, "veh", g)));
  for(let i = 0; i < jobs.length; i += 400) await Promise.all(jobs.slice(i, i + 400).map(f => f()));
  renewIndex = idx; indexFor = model;
}

/* ============================================================
   «سجل النشاط» — who came in to the system, when, and what he did there;
   and the devices it is opened on, with the lock on each.
   Every sign-in online begins a VISIT; what is done in it — a page opened,
   a search run, a card looked at, a file exported, «تجديد» pressed — is
   written to the database as it happens, with the visit it belongs to. The
   admin's page (his menu only; the database hands the log to the admin's
   token and no other) shows each visit on its own, under the day and the
   hour it began. A wrong PIN is written by the database itself the moment
   the gate reports it, under the name it was tried for: those lines make a
   visit of their own, marked «قبل الدخول».
   A card is written as the same salted hash the renewal list uses — never a
   name or a number — and found again by the admin's page among what it has
   read. Nothing typed into the search is written: only how many lines were
   asked for and how many were found. This PC's own copy — the admin's desk —
   is not logged at all.
   THE DEVICES sit at the top of the page: every browser the system was
   opened in, who used it last, and whether it is locked. A device locked by
   three wrong PINs waits there for the admin to let it back in — or not —
   and any device can be locked by him on the spot.
   ============================================================ */
// one line of the log; never waited for, and never allowed to get in the way of what is being done
/* WHAT EXACTLY WAS DONE (asked for, 6 October 2026). A search is written down with what was typed, an export or a
   print with the page it came from, how that page was filtered and how many rows went out — so a line of the log
   can be opened on all of it. The database keeps 4000 characters of a line: a list longer than fits is cut at whole
   entries and says how many were left out, never in the middle of one. */
const LOG_ROOM = 3600;
function logFit(detail){
  let text = JSON.stringify(detail);
  if(text.length <= LOG_ROOM || !Array.isArray(detail.q)) return text.length <= LOG_ROOM ? text : JSON.stringify({ f: detail.f, v: detail.v, n: detail.n, m: detail.m });
  const d = Object.assign({}, detail, { q: detail.q.slice() });
  let cut = 0;
  while(d.q.length > 1 && JSON.stringify(Object.assign(d, { more: cut })).length > LOG_ROOM){ d.q.length = Math.max(1, Math.floor(d.q.length * .8)); cut = detail.q.length - d.q.length; }
  d.q = d.q.map(x => String(x).slice(0, 400));
  return JSON.stringify(d);
}
// where an export or a print came from: the page's own filters, or the search behind it
function logCtx(){
  const v = st.view, keep = o => { const c = {}; Object.keys(o).forEach(k => { if(o[k]) c[k] = o[k]; }); return c; };
  if(v === "emp" || v === "ind" || v === "veh"){ const f = st[v]; return { c: keep({ st: f.status, dept: f.dept, collar: f.collar, co: f.company, mail: f.mail, q: f.q }) }; }
  if(v === "snd" || v === "rnw") return { c: keep({ o: sndState().open || "" }) };
  if(v === "multi" && st.multi.res) return { c: { m: st.multi.res.mode }, q: parseTerms(st.multi.text).terms };
  if(v === "spc" && st.spc.res) return { c: { by: st.spc.res.by }, q: [String(st.spc.text || "").trim()] };
  return {};
}

/* ============================================================
   «قارئ البطاقات» — the admin's page, on this PC's own copy only.
   A Word or PDF file of ID-card photos is handed to the reader that runs on
   this PC (a scheduled Claude task, in the card reader's own folder); the
   sheet it makes — the permits form, filled in — lands in the export folder
   with every other export.

   A page cannot put a file where it likes: it can only download one. So the
   file is DOWNLOADED into the export folder under a name the reader knows
   («وارد قارئ البطاقات [id] name.zip»): a box holding the file as it is, byte
   for byte, and beside it a paper saying whom the system already knows (see
   cardsKnownList). The reader takes it from there. «مسح السجل» goes the same
   way, as a line of text under a name the reader knows for an order. What
   the reader is doing is read back from two small files it keeps beside this
   page — cards/watcher.json (is it awake) and cards/state.json (the files it
   has taken, where each one stands, and what it read in the last few) —
   asked for every few seconds while this page is open or a file is on its
   way.

   Nothing of this leaves the PC: the photos, the names and the numbers stay
   on its disk. The online edition has no such page — there is no reader
   behind it.
   ============================================================ */
const CARDS_KEY = "ncm_system_cards", CARDS_SEEN_KEY = "ncm_system_cards_seen", CARDS_CLEARED_KEY = "ncm_system_cards_cleared";
const CARDS_CLEAR = "مسح السجل";                     // the reader knows an order to clear its record by this name
const CARDS_PREFIX = "وارد قارئ البطاقات";              // the reader knows a file of ours by this name
const CARDS_DIR = "cards/", CARDS_EXPORT = "التصدير/";
const CARDS_ALIVE = 20000;                           // a reader not heard from for this long is not waiting any more
// sent: what this page handed over and the reader has not taken yet · jobs: the reader's own list · watcher: its last sign of life ·
// owed: the files whose end this window has still to announce
const CARD = { sent: [], jobs: [], watcher: null, stamp: 0, owed: new Set() };
let cardsSig = "", cardsBusy = false, cardsSeen = 0, cardsCleared = 0;
try{ const kept = JSON.parse(localStorage.getItem(CARDS_KEY) || "[]"); if(Array.isArray(kept)) CARD.sent = kept; }catch(e){}
try{ cardsSeen = +localStorage.getItem(CARDS_SEEN_KEY) || 0; cardsCleared = +localStorage.getItem(CARDS_CLEARED_KEY) || 0; }catch(e){}
const cardsKeep = () => { try{ localStorage.setItem(CARDS_KEY, JSON.stringify(CARD.sent)); }catch(e){} };
// a file beside this page, read (or only asked whether it is there)
function beside(path, only){
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    try{
      x.open("GET", new URL(path, location.href.split(/[?#]/)[0]).href);
      // only asked whether it is there: its first piece is answer enough — an export of fifteen megabytes is not read to the end for that
      if(only){ x.setRequestHeader("Range", "bytes=0-0"); x.onprogress = () => { resolve(true); try{ x.abort(); }catch(e){} }; }
      x.onload = () => resolve(only ? true : x.responseText);
      x.onerror = () => resolve(null);
      x.send();
    }catch(e){ resolve(null); }
  });
}
// every file there is to show, the newest first: the reader's list, and above it what it has not taken yet
function cardsList(){
  // what had finished when «مسح السجل» was pressed is off the page at once; the reader takes it off its own list when it next looks
  const list = CARD.jobs.filter(j => j.status === "reading" || (j.finished_at || j.received_at || 0) > cardsCleared);
  CARD.sent.forEach(x => list.push({ id: x.id, file: x.file, received_at: x.at, status: x.lost ? "lost" : "queued" }));
  return list.sort((a, b) => (b.received_at || 0) - (a.received_at || 0));
}
const cardsGoing = () => CARD.sent.some(x => !x.lost) || CARD.jobs.some(j => j.status === "reading");
// busy: a file is being read · desk: an order of «الشيتات» is being seen through · on: awake and waiting · off: nobody there
function cardsReader(){
  if(CARD.jobs.some(j => j.status === "reading" && (j.lease_until || 0) > Date.now())) return "busy";
  // seeing something «الشيتات» asked for through — a worker beside its wait, or card photos it is looking at
  if(DESK.orders.some(o => o.status === "running" && o.step !== "queued" && !deskStale(o))) return "desk";
  return CARD.watcher && Date.now() - (+CARD.watcher.alive_at || 0) < CARDS_ALIVE ? "on" : "off";
}
async function cardsSync(){
  if(ONLINE || cardsBusy) return;
  cardsBusy = true;
  try{
    const [s, w] = await Promise.all([beside(CARDS_DIR + "state.json"), beside(CARDS_DIR + "watcher.json")]);
    // a file caught while it is being written does not parse: what is on screen stays until the next asking
    try{ const state = s ? JSON.parse(s) : null; CARD.jobs = state && Array.isArray(state.jobs) ? state.jobs : []; CARD.stamp = state ? +state.updated_at || 0 : 0; }catch(e){}
    try{ CARD.watcher = w ? JSON.parse(w) : null; }catch(e){}
    // what was handed over and is now on the reader's list needs remembering no longer; what is neither on the
    // list nor in the export folder went somewhere the reader does not look
    CARD.sent.forEach(x => CARD.owed.add(x.id));
    const known = new Set(CARD.jobs.map(j => j.id));
    let changed = false;
    for(const x of CARD.sent.slice()){
      if(known.has(x.id)){ CARD.sent.splice(CARD.sent.indexOf(x), 1); changed = true; continue; }
      if(Date.now() - x.at < 2500) continue;          // the browser is still putting it down
      const lost = !(await beside(CARDS_EXPORT + x.name, true));
      if(lost && !x.lost){
        // taken between the two askings? the list is asked once more before the file is called lost
        const again = await beside(CARDS_DIR + "state.json");
        try{ const st2 = again ? JSON.parse(again) : null; if(st2 && Array.isArray(st2.jobs) && st2.jobs.some(j => j.id === x.id)){ CARD.jobs = st2.jobs; CARD.stamp = +st2.updated_at || 0; CARD.sent.splice(CARD.sent.indexOf(x), 1); changed = true; continue; } }catch(e){}
      }
      if(!!x.lost !== lost){ x.lost = lost; changed = true; }
    }
    if(changed) cardsKeep();
    // a file of ours that has come to its end says so, once, wherever the admin is — its own page shows it without being told
    CARD.jobs.forEach(j => {
      if(j.status === "reading") return CARD.owed.add(j.id);
      if(!CARD.owed.delete(j.id) || st.view === "cards") return;
      toast(j.status === "done" ? t("cdDoneToast", j.file, j.people || 0) : t("cdFailToast", j.file), j.status !== "done");
    });
  }finally{ cardsBusy = false; }
  cardsNav();
  if(st.view === "cards" && $("cards")) paintCards();
}
// the menu: how many files are on their way, or a tick for one that finished and has not been looked at
function cardsNav(){
  const nb = $("nb-cards");
  if(!nb) return;
  const list = cardsList(), going = list.filter(j => j.status === "queued" || j.status === "reading").length;
  const fresh = list.filter(j => (j.status === "done" || j.status === "failed") && (j.finished_at || 0) > cardsSeen);
  nb.textContent = going ? going : fresh.length ? "✓" : "";
  nb.className = "nb" + (!going && fresh.some(j => j.status === "failed") ? " alert" : "");
}
// a thing of ours gets its name from the moment it is sent
function cardsId(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + "-" +
         (Math.random().toString(36).slice(2, 5) + "000").slice(0, 3);
}
// put down in the export folder, the only way a page can put anything down: as a download
function cardsPut(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
/* WHOM THE SYSTEM ALREADY KNOWS travels with the file, so that the reader can
   write «R» — a renewal — in the status column against a card whose national
   id is on a permit or on the staff list (asked for, 5 October 2026). Someone
   under a ban is marked as such on the paper, and gets the letter like anyone
   else the system knows (the admin's word, the same day: «ياخد R برضو عادي»). It is this page's own reading of the sheets that says who is
   known — the same reading its «في السيستم» column shows. The ids are not
   written down: each goes as a salted hash, and the reader hashes what it has
   read the same way and looks for it. With no sheet read, the paper says so
   and nobody is given a letter. */
async function cardsKnownList(){
  if(!M.ind && !M.emp) return { v: 1, loaded: false };
  const ids = new Map();                             // national id -> under a ban?
  if(M.ind) M.ind.byNid.forEach((g, id) => { if(/^[0-9]{14}$/.test(id)) ids.set(id, permitBan(g)); });
  if(M.emp) M.emp.byNid.forEach((list, id) => { if(/^[0-9]{14}$/.test(id)) ids.set(id, !!ids.get(id) || list.some(empBan)); });
  const salt = [].map.call(crypto.getRandomValues(new Uint8Array(12)), x => x.toString(16).padStart(2, "0")).join("");
  const known = [], banned = [];
  await Promise.all([...ids].map(async pair => { const mark = (await sha256hex(salt + "|" + pair[0])).slice(0, 20); known.push(mark); if(pair[1]) banned.push(mark); }));
  return { v: 1, loaded: true, salt, size: 20, known, banned };
}
/* «مسح السجل». The page cannot rub out the reader's list itself; it puts an
   order down for the reader, and meanwhile stops showing what had finished by
   now. The sheets in the export folder are no part of the record and stay. */
function cardsClear(){
  if(!confirm(t("cdClearSure"))) return;
  cardsPut(new Blob(["clear"], { type: "text/plain" }), CARDS_PREFIX + " [" + cardsId() + "] " + CARDS_CLEAR + ".txt");
  cardsCleared = Date.now();
  try{ localStorage.setItem(CARDS_CLEARED_KEY, String(cardsCleared)); }catch(e){}
  CARD.sent = CARD.sent.filter(x => !x.lost);
  cardsKeep(); cardsNav(); paintCards();
  toast(t("cdCleared"));
}
/* HANDING A FILE OVER. The file is not read here and not changed: it is put
   down in the export folder, in its box, under the reader's name for it. Its
   id is the moment it was sent. One file at a time — a browser asks before it
   lets a page download several. */
async function cardsSend(file){
  if(ONLINE || !isAdmin() || !file) return;
  if(!/\.(docx|docm|pdf)$/i.test(file.name)) return toast(t("cdBadType"), true);
  if(!file.size) return toast(t("cdEmptyFile"), true);
  const id = cardsId();
  const clean = file.name.replace(/[\\/:*?"<>|\u0000-\u001f]/g, "-").replace(/\s+/g, " ").trim();
  const name = CARDS_PREFIX + " [" + id + "] " + clean + ".zip";
  let box;
  try{ box = await NCM.zip([["file.bin", new Uint8Array(await file.arrayBuffer()), true], ["known.json", JSON.stringify(await cardsKnownList())]]); }
  catch(e){ return toast(t("cdUnread", file.name), true); }
  cardsPut(new Blob([box], { type: "application/zip" }), name);
  CARD.sent.unshift({ id, file: clean, name, size: file.size, at: Date.now() });
  cardsKeep();
  toast(t("cdSent"));
  cardsNav();

/* ============================================================
   «الشيتات» — what the admin can ask of this PC from here (5 October 2026).
   Three things: the employees' sheet put into the database with the card
   photos that are waiting, the work sheet uploaded to the Drive and checked
   — the two daily routines, done now instead of at eight — and a new ASE
   export put in the place of the work sheet's «ASE Data» sheet. That last
   one has no day of its own (a new export comes every week or ten days):
   it is done when the admin hands the file over here, and only then.

   Asked the one way a page can ask anything of the PC it runs on: a small
   file put down in the export folder under a name the desk knows («أمر
   السيستم [id] موظفين.txt», «أمر السيستم [id] شيت.txt», «وارد ASE [id]
   name.xlsx»). The reader that waits there for card files hands them to
   the desk (tools/desk.py), which runs the routines' own programs; where
   each order stands is read back from cards/desk.json, as the card
   reader's page does with its own files. What comes back is figures and
   file names — never a person's name or number.
   ============================================================ */
const DESK_KEY = "ncm_system_desk";
const DESK_ORDER = "أمر السيستم", DESK_ASE = "وارد ASE";          // the desk knows a thing of ours by these names
const DESK_WORD = { employees: "موظفين", sheet: "شيت", ase: "ASE" };
const DESK_FROM_SYSTEM = "@system";          // an ASE order with no file: the copy on ASE SEARCH is what goes into the work sheet
const DESK_KINDS = ["employees", "sheet", "ase"];
const DESK_TITLE = { employees: "dkEmp", sheet: "dkSheet", ase: "dkAse" };
// the steps an order goes through, by kind: sent · taken up · then its own
const DESK_STEPS = { employees: ["dkA1", "dkA2", "dkE3", "dkE4", "dkE5"], sheet: ["dkA1", "dkA2", "dkS3", "dkS4"], ase: ["dkA1", "dkA2", "dkA3", "dkA4", "dkA5", "dkA6"] };
const DESK_WITH_READER = ["need_check", "asked_check", "checked"];      // the card photos are being looked at by the reader
// why an order was not done, in the desk's word for it -> ours
const DESK_ERR = { already_running: "dkEBusy", interrupted: "dkECut", took_too_long: "dkELong", program_missing: "dkEProgram",
  emp_sheet_open: "dkEEmpOpen", emp_sheet_missing: "dkEEmpMissing", emp_table_unreadable: "dkEDb", emp_sync_failed: "dkEEmpSync",
  sh_column_order_changed: "dkEShCols", sh_file_has_problems: "dkEShRows", sh_sheet_has_problems_after_upload: "dkEShAfter",
  sh_file_much_smaller_than_sheet: "dkEShSmall", sh_tabs_missing: "dkEShTabs", sh_failed: "dkEShFailed",
  work_sheet_open: "dkEOpen", work_sheet_missing: "dkEMissing", work_sheet_changed: "dkEChanged", work_sheet_busy: "dkEHeld", not_an_export: "dkENotAse",
  export_columns_changed: "dkECols", sheet_columns_changed: "dkESheetCols", export_empty: "dkEEmpty", export_much_smaller: "dkESmall", no_room: "dkERoom",
  wrong_password: "dkEPass", excel_check_failed: "dkECheck", file_check_failed: "dkECheck", not_received: "dkENotHere",
  copy_same: "dkESame", copy_empty: "dkENoCopy", copy_changed: "dkECopyBusy", copy_failed: "dkECopyFail" };
// what a routine says of its own end -> how it is to be taken (ok · aside: said, nothing to do · warn · bad) and the words for it
const DESK_FACT = { emp_same: ["ok", "dkF_emp_same"], emp_found: ["ok", "dkF_emp_found"], emp_skipped: ["warn", "dkF_emp_skipped"], emp_failed: ["bad", "dkF_emp_failed"],
  emp_unverified: ["bad", "dkF_emp_unverified"], emp_blank: ["aside", "dkF_emp_blank"], emp_missing: ["aside", "dkF_emp_missing"],
  emp_dup: ["warn", "dkF_emp_dup"], emp_odd: ["warn", "dkF_emp_odd"],
  ph_up: ["ok", "dkF_ph_up"], ph_failed: ["bad", "dkF_ph_failed"], ph_refused: ["bad", "dkF_ph_refused"], ph_unknown: ["bad", "dkF_ph_unknown"], ph_twice: ["bad", "dkF_ph_twice"],
  ph_unchecked: ["warn", "dkF_ph_unchecked"], ph_changed: ["warn", "dkF_ph_changed"], ph_differs: ["warn", "dkF_ph_differs"], ph_unclear: ["warn", "dkF_ph_unclear"],
  ph_other: ["aside", "dkF_ph_other"],
  sh_same: ["ok", "dkF_sh_same"], sh_up: ["ok", "dkF_sh_up"], sh_ids: ["aside", "dkF_sh_ids"], vf_ok: ["ok", "dkF_vf_ok"], vf_bad: ["bad", "dkF_vf_bad"], vf_none: ["bad", "dkF_vf_none"] };
// sent: asked for here and not yet taken by the desk · orders: the desk's own list · owed: what this window has still to announce the end of
const DESK = { sent: [], orders: [], stamp: 0, owed: new Set() };
let deskSig = "", deskBusy = false;
try{ const kept = JSON.parse(localStorage.getItem(DESK_KEY) || "[]"); if(Array.isArray(kept)) DESK.sent = kept; }catch(e){}
const deskKeep = () => { try{ localStorage.setItem(DESK_KEY, JSON.stringify(DESK.sent)); }catch(e){} };
const deskLive = o => !!o && (o.status === "queued" || o.status === "running");
/* An order nobody is telling of any more: the worker seeing it through says it is there every few seconds, and the
   reader looking at card photos is given twenty minutes. Past that the page stops waiting — the desk says the same
   the next time a reader looks. Nothing is ever left half-done by it: each program finishes or leaves things as
   they were. */
const deskStale = o => o.status === "running" && o.step !== "queued" && o.step !== "expected" && (DESK_WITH_READER.indexOf(o.step) !== -1
  ? Date.now() - (+o.asked_at || +o.beat || +o.at || 0) > 20 * 60000
  : Date.now() - (+o.beat || +o.started_at || +o.at || 0) > 180000);
// where a thing of one kind stands: the one on its way if there is one, else the last that came to an end
function deskNow(kind){
  const all = DESK.sent.filter(x => x.kind === kind).map(x => ({ id: x.id, kind, file: x.file, at: x.at, status: x.lost ? "lost" : "queued" }))
    .concat(DESK.orders.filter(o => o.kind === kind).map(o => deskStale(o) ? Object.assign({}, o, { status: "failed", error: "interrupted", finished_at: 0 }) : o))
    .sort((a, b) => (b.at || 0) - (a.at || 0));
  return all.find(deskLive) || all[0] || null;
}
const deskGoing = () => DESK.sent.some(x => !x.lost) || DESK.orders.some(o => o.status === "running" && !deskStale(o));
const deskFacts = o => ((o.result || {}).facts || []).filter(f => Array.isArray(f) && DESK_FACT[f[0]]);
// how an order that ran to its end is to be taken: by the worst thing it said
function deskTone(o){
  const tones = deskFacts(o).map(f => DESK_FACT[f[0]][0]);
  return tones.indexOf("bad") !== -1 ? "bad" : tones.indexOf("warn") !== -1 ? "warn" : "ok";
}
/* ONLINE the desk is spoken to through the database: an order is a row there (system_desk), the desk on the work PC
   takes it up and tells there, every few seconds, where each order stands and that it is awake. Only the admin's
   token is let in. The clocks of two machines are never quite one: times are read against the database's own. */
async function deskCloud(){
  if(!link()) return;
  deskBusy = true;
  try{
    const r = await dbCall("system_desk_list", {});
    const skew = Date.now() - (+r.now || Date.now());
    DESK.beat = r.beat ? +r.beat + skew : 0;
    DESK.orders = (r.orders || []).map(o => Object.assign({ id: o.id, kind: o.kind, file: o.file || "", at: +o.at + skew }, o.taken && o.state ? o.state : { status: "queued" }));
    DESK.orders.forEach(o => {
      if(deskLive(o)) return DESK.owed.add(o.id);
      if(!DESK.owed.delete(o.id) || st.view === "src") return;
      const well = o.status === "done" && deskTone(o) !== "bad";
      toast(t(well ? "dkDoneToast" : o.status === "done" ? "dkBadToast" : "dkFailToast", t(DESK_TITLE[o.kind] || "navSrc")), !well);
    });
  }catch(e){}
  finally{ deskBusy = false; }
  deskNav();
  if(st.view === "src" && $("desk")) paintDesk();
}
// is the reader on the work PC there? On that PC its own files say; online, the desk's last word to the database does
const deskReader = () => !ONLINE ? cardsReader() : Date.now() - (DESK.beat || 0) > 25000 ? "off" :
  DESK.orders.some(o => o.status === "running" && o.step !== "queued" && o.step !== "expected" && !deskStale(o)) ? "desk" : "on";
async function deskSync(){
  if(!isAdmin() || deskBusy) return;
  if(ONLINE) return deskCloud();
  deskBusy = true;
  try{
    const [d, w] = await Promise.all([beside(CARDS_DIR + "desk.json"), beside(CARDS_DIR + "watcher.json")]);
    // a file caught while it is being written does not parse: what is on screen stays until the next asking.
    // An order of a rehearsal that asked not to be seen (the desk's own trial runs) is not this page's business.
    const mine = list => list.filter(o => o && !o.hidden);
    try{ const state = d ? JSON.parse(d) : null; DESK.orders = state && Array.isArray(state.orders) ? mine(state.orders) : []; DESK.stamp = state ? +state.updated_at || 0 : 0; }catch(e){}
    try{ CARD.watcher = w ? JSON.parse(w) : null; }catch(e){}
    // what was asked for and is now on the desk's list needs remembering no longer; what is neither on the list
    // nor in the export folder went somewhere the desk does not look
    DESK.sent.forEach(x => DESK.owed.add(x.id));
    const known = new Set(DESK.orders.map(o => o.id));
    let changed = false;
    for(const x of DESK.sent.slice()){
      if(known.has(x.id)){ DESK.sent.splice(DESK.sent.indexOf(x), 1); changed = true; continue; }
      if(Date.now() - x.at < (x.kind === "ase" ? 9000 : 2500)) continue;          // the browser is still putting it down
      const lost = !(await beside(CARDS_EXPORT + x.name, true));
      if(lost && !x.lost){
        // taken between the two askings? the list is asked once more before the thing is called lost
        const again = await beside(CARDS_DIR + "desk.json");
        try{ const s2 = again ? JSON.parse(again) : null; if(s2 && Array.isArray(s2.orders) && s2.orders.some(o => o.id === x.id)){ DESK.orders = mine(s2.orders); DESK.stamp = +s2.updated_at || 0; DESK.sent.splice(DESK.sent.indexOf(x), 1); changed = true; continue; } }catch(e){}
      }
      if(!!x.lost !== lost){ x.lost = lost; changed = true; }
    }
    if(changed) deskKeep();
    // a thing of ours that has come to its end says so, once, wherever the admin is — its own page shows it without being told
    DESK.orders.forEach(o => {
      if(o.status === "running") return DESK.owed.add(o.id);
      if(!DESK.owed.delete(o.id) || st.view === "src") return;
      const well = o.status === "done" && deskTone(o) !== "bad";
      toast(t(well ? "dkDoneToast" : o.status === "done" ? "dkBadToast" : "dkFailToast", t(DESK_TITLE[o.kind] || "navSrc")), !well);
    });
  }finally{ deskBusy = false; }
  deskNav();
  if(st.view === "src" && $("desk")) paintDesk();
}
// the menu: how many things asked for here are on their way
function deskNav(){
  const nb = $("nb-src");
  if(!nb) return;
  const going = !isAdmin() ? 0 : DESK_KINDS.filter(k => deskLive(deskNow(k))).length;
  nb.textContent = going ? going : "";
}
/* ASKING. Nothing is run from here and no sheet is touched from here: the order — or the export, as it is, byte
   for byte — is put down in the export folder, and the desk takes it from there. A thing already on its way is
   not asked for twice. */
function deskAsk(kind){
  if(!isAdmin() || !DESK_WORD[kind] || deskLive(deskNow(kind))) return;
  const file = kind === "ase" ? DESK_FROM_SYSTEM : "";           // «ASE من السيستم»: an order, no file
  if(ONLINE) return deskAskOnline(cardsId(), kind, file);
  const id = cardsId(), name = DESK_ORDER + " [" + id + "] " + DESK_WORD[kind] + ".txt";
  cardsPut(new Blob(["run"], { type: "text/plain" }), name);
  DESK.sent.unshift({ id, kind, name, file, at: Date.now() });
  deskKeep(); deskNav(); paintDesk();
  [3200, 9000].forEach(ms => setTimeout(deskSync, ms));          // has it landed where the desk looks, and has it been taken
}
// online: the order is put in the database; it is shown at once, and the database's own word takes its place
function deskAskOnline(id, kind, file){
  DESK.orders.unshift({ id, kind, file, at: Date.now(), status: "queued" });
  DESK.owed.add(id);
  deskNav(); paintDesk();
  return dbCall("system_desk_ask", { p_id: id, p_kind: kind, p_file: file, p_who: session ? session.u : "" })
    .then(() => true, () => { DESK.orders = DESK.orders.filter(o => o.id !== id); toast(t("noConn"), true); return false; })
    .then(ok => { deskSync(); return ok; });
}
function deskAse(file){
  if(!isAdmin() || !file) return;
  if(!/\.xlsx$/i.test(file.name)) return toast(t("needXlsx"), true);
  if(!file.size) return toast(t("cdEmptyFile"), true);
  if(deskLive(deskNow("ase"))) return toast(t("dkAseBusy"), true);
  const id = cardsId();
  const clean = file.name.replace(/[\\/:*?"<>|\u0000-\u001f]/g, "-").replace(/\s+/g, " ").trim();
  const name = DESK_ASE + " [" + id + "] " + clean;
  // online the export still has to get to the work PC, and a page has one way to put a file anywhere: it is downloaded.
  // Opened on the work PC it lands in the export folder, where the desk is waiting for it by its id; from any other
  // machine it lands on that machine, and the desk says after a while that it never came.
  if(ONLINE) return deskAskOnline(id, "ase", clean).then(ok => { if(ok) cardsPut(file, name); });
  cardsPut(file, name);
  DESK.sent.unshift({ id, kind: "ase", file: clean, name, at: Date.now() });
  deskKeep(); deskNav(); paintDesk();
  [4200, 11000].forEach(ms => setTimeout(deskSync, ms));
}

// which step an order is at — the one being done: 1 sent, waiting to be taken up · from 2 on, its own steps

/* ============================================================
   «ASE SEARCH» — for everyone who signs in (asked for, 5 October 2026).
   A list of national ids, one a line, is looked up in a copy of the ASE
   export that the system keeps in its database (system_ase): what ASE has
   on each of them — every row, a person may have several — or that it has
   nothing. Whoever is signed in may load a new export into the copy from
   here, the manager too, with the admin and his PC away: the file is read
   in the browser and handed to the database a couple of thousand rows at a
   time, and takes the old copy's place only when all of it is there. (An
   export the admin hands the desk on «الشيتات» becomes the copy as well.)
   ============================================================ */
const ASE = { info: null, busy: null };          // info: what copy there is · busy: a file being loaded now {step, done, total}
const ASE_OURS = /N\.?\s?C\.?\s?M|TITAN/i;          // NCM · N.C.M · TITAN NCM · TITAN-NCM …
const ASE_COLS = ["asId", "asName", "asStatus", "asOrg", "asPos", "asArea", "asCit", "asLDate", "asLNo", "asConfirm", "asOwner", "asNote"];
// what was typed, as a list of ids: one a line (or apart by commas); digits made Latin, the gaps inside a number taken out
function aseTerms(text){
  const out = [], seen = new Set();
  NCM.toLatinDigits(text || "").split(/[\n\r,;،\t]+/).forEach(piece => {
    let p = piece.trim();
    if(/^[\d\s]+$/.test(p)) p = p.replace(/\s+/g, "");
    p = p.toUpperCase();
    if(p && !seen.has(p)){ seen.add(p); out.push(p); }
  });
  return out.slice(0, 1000);
}
async function aseInfo(){
  if(!link()) return;
  try{ ASE.info = await dbCall("system_ase_info", {}); }catch(e){}
  if(st.view === "ase") paintAseHead();
}
async function aseGo(){
  if($("at")) st.ase.text = $("at").value;
  const terms = aseTerms(st.ase.text);
  if(!terms.length || !link()) return;
  st.ase.res = { terms, rows: null };
  paintAse();
  try{
    const got = await dbCall("system_ase_find", { p_ids: terms });
    const by = new Map();
    (got || []).forEach(r => { if(!by.has(r[0])) by.set(r[0], []); by.get(r[0]).push(r.slice(1)); });
    st.ase.res = { terms, rows: terms.map(x => ({ term: x, hits: by.get(x) || [] })) }; st.ase.cat = "";
    logAct("search", { m: "ase", n: terms.length, f: terms.filter(x => by.has(x)).length, q: terms });
    histKeep({ m: "ase", t: terms.join("\n"), n: terms.length, f: terms.filter(x => by.has(x)).length });
  }catch(e){ st.ase.res = null; toast(t("noConn"), true); }
  paintAse();
}
/* LOADING AN EXPORT. Read here, in the browser; handed over in pieces; made the copy only when the database holds
   every row that was read. Stopped half-way — the tab closed, the line dropped — the old copy is still the copy. */
async function aseUpload(file){
  if(!file || !link() || ASE.busy || !can("x-aseup")) return;
  if(!/\.xlsx$/i.test(file.name)) return toast(t("needXlsx"), true);
  const who = link().u || "";
  ASE.busy = { step: "read", done: 0, total: 0 };
  paintAseHead();
  try{
    const rows = await NCM.readAse(file, n => { ASE.busy.done = n; paintAseHead(); });
    if(!rows.length) throw new Error("empty");
    const put = async (fn, args) => { for(let i = 0; ; i++){ try{ return await dbCall(fn, args); }catch(e){ if(i >= 3) throw e; await new Promise(r => setTimeout(r, 1500 * (i + 1))); } } };
    const batch = await put("system_ase_begin", { p_file: file.name, p_who: who });
    ASE.busy = { step: "put", done: 0, total: rows.length };
    for(let i = 0; i < rows.length; i += 2000){
      await put("system_ase_put", { p_batch: batch, p_rows: rows.slice(i, i + 2000) });
      ASE.busy.done = Math.min(rows.length, i + 2000);
      paintAseHead();
    }
    const end = await put("system_ase_commit", { p_batch: batch, p_rows: rows.length });
    if(!end || !end.ok) throw new Error("incomplete");
    for(let i = 0; i < 40; i++){ if(!(await put("system_ase_sweep", {}))) break; }       // the copy it replaced is cleared away
    toast(t("asLoaded", rows.length.toLocaleString("en-US")));
    logAct("ase", { n: rows.length });
  }catch(e){ toast(t(e && e.code === "NOT_ASE" ? "asNotAse" : "asUpFail"), true); }
  ASE.busy = null;
  await aseInfo();
  paintAseHead();
}

/* ============================================================
   «بحث خاص» — EVERYONE OF A PLACE, OF A LETTER, OF A COMPANY
   ============================================================
   Asked for on 6 October 2026: not a search for a person, but a list — type
   «البحيرة» and everyone whose address is in that governorate comes, type
   «الضبعة» and everyone living there, type a letter's number and everyone who
   was on that letter, a company and everyone of it. All of it from our own
   two sheets (the permits and the employees), nothing from ASE.

   He picks what he is asking by, and types it:
     · «محافظة / مدينة»: every word typed has to be a whole word of the address
       («قنا» is not «القناطر»; «ال» in front counts for nothing). Only when no
       address has them as whole words are they looked for as part of a word.
     · «رقم الخطاب»: digits alone are the letter's last number — what stands
       after its last «/» — and must be that number whole (9 is not 1239);
       typed with its strokes, it is looked for as written, anywhere in the number.
     · «الشركة»: what was typed has to be in the company's name.
   Several, with a comma between them, are several lists in one: any may hold.
   A man is one row, as on the search page. Every request he ever made is
   looked at; when it is an earlier one that answers, the row shows THAT
   request's address, letter and company, and says so under his name. */
const SPC_SHOW = 1500;                      // rows drawn on screen; the Excel file has them all
const SPC_BY = ["place", "letter", "company"];
const SPC_WORD = { place: "spPlace", letter: "spLetter", company: "spCompany" }, SPC_HINT = { place: "spHintPlace", letter: "spHintLetter", company: "spHintCompany" };       // what the box is, for a screen reader — nothing is written in it
const spcCache = new WeakMap();
const spcWord = w => { const f = foldArabic(w); return f.length > 3 && f.startsWith("ال") ? f.slice(2) : f; };
const spcWords = text => normalize(text).split(/[^\p{L}\p{N}]+/u).map(spcWord).filter(Boolean);
// one request (or one employee), ready to be asked: the words of its address, its letter's numbers, its company
function spcOf(o, address, letter, company){
  let k = spcCache.get(o);
  if(!k){
    const whole = normalize(letter).toUpperCase();
    k = { words: new Set(spcWords(address)), addr: foldArabic(address), co: foldArabic(company), letters: whole ? whole.split(/\s+/) : [], letter: whole.replace(/\s+/g, "") };
    spcCache.set(o, k);
  }
  return k;
}
const spcTail = x => { const tail = x.slice(x.lastIndexOf("/") + 1); return /^\d+$/.test(tail) ? tail.replace(/^0+(?=\d)/, "") : null; };
// what one thing typed asks of a request
function spcAsk(term, by){
  const plain = normalize(term), f = foldArabic(plain);
  if(by === "letter"){
    const typed = plain.toUpperCase().replace(/\s+/g, "");
    if(/^\d+$/.test(typed)){
      const n = typed.replace(/^0+(?=\d)/, "");
      return k => k.letters.some(x => spcTail(x) === n);
    }
    return k => !!typed && k.letter.includes(typed);
  }
  if(by === "company") return k => !!f && k.co.includes(f);
  const words = spcWords(plain);
  // (a name of two words is also taken written as one — «بنى سويف», «بنيسويف»)
  return (k, loose) => (words.length > 0 && words.every(w => k.words.has(w))) || ((loose || words.length > 1) && !!f && k.addr.includes(f));
}
function runSpc(){
  const sp = st.spc, terms = String(sp.text || "").split(/[,،;؛\n]+/).map(x => x.trim()).filter(Boolean);
  if(!terms.length){ sp.res = null; return; }
  const by = SPC_BY.indexOf(sp.by) < 0 ? "place" : sp.by, asks = terms.map(x => spcAsk(x, by));
  const build = loose => {
    const rows = [], seenE = new Set(), ok = k => asks.some(a => a(k, loose));
    if(M.ind) M.ind.list.forEach(g => {
      let rec = null;
      for(let i = g.records.length - 1; i >= 0 && !rec; i--){ const x = g.records[i]; if(ok(spcOf(x, x.address, x.letter, x.company))) rec = x; }      // the latest request that answers
      if(!rec) return;
      (g.emp || []).forEach(e => seenE.add(e.emp_code));
      rows.push({ g: rec === g.cur ? g : Object.assign(Object.create(g), { cur: rec }), emps: g.emp || [], old: rec !== g.cur });
    });
    if(M.emp) M.emp.list.forEach(e => {
      if(seenE.has(e.emp_code) || !ok(spcOf(e, e.address, e.letter_number, e.letter_company || "NCM"))) return;
      rows.push({ g: null, emps: [e] });
    });
    return rows;
  };
  let rows = build(false);
  if(!rows.length && by === "place") rows = build(true);
  // as the sheet has them: a letter's people together, and within that the rows of the permits sheet top to bottom — then those who are employees only, by code
  const nameOf = r => sortText(r.g ? r.g.name : r.emps[0].full_name), letterOfRow = r => letterOf(r, "letter", "letter_number");
  const rowOf = r => r.g ? r.g.cur.row || 0 : 1e9 + (parseInt(r.emps[0].emp_code, 10) || 0);
  rows.sort((a, b) => (by === "letter" ? letterOfRow(a).localeCompare(letterOfRow(b)) : 0) || rowOf(a) - rowOf(b) || nameOf(a).localeCompare(nameOf(b), "ar"));
  sp.res = { rows, by, terms: terms.length };
  if(sp.cat && !rows.some(r => spcCat(r) === sp.cat)) sp.cat = "";      // the box that was pressed counts nobody any more
}

/* ============================================================
   «مقارنة ASE» — WHERE OUR SHEETS AND THE ASE COPY DO NOT AGREE
   ============================================================
   Everyone of ours who has a national id — the permits sheet and the employees — is looked up in the copy of the ASE
   export that «ASE SEARCH» keeps, a few hundred ids at a time, and a line is shown for each one whose record does
   not agree with it. ASE may hold several rows for a man (a row a letter); what is read is the LATEST row under our
   own company (ASE_OURS), by the letter's date. What counts as not agreeing:
     · he is not in ASE at all;
     · ASE says RULES VIOLATION, and we do not have him as banned;
     · ASE says DELETED or RESIGNATION, and our permit for him is still valid;
     · a TRANSFER LETTER was made for him («Перевод») — whatever our permit says: his row stands in red (asked for,
       6 October 2026: «أي حد يظهر إنه اتعمله خطاب تحويل الصف بتاعه في الجدول يتلون بالأحمر»), here and on «ASE SEARCH»;
     · ASE has him under another company only;
     · we have him as banned, and ASE says nothing against him (ASE records only some kinds of ban — so this one is
       often as it should be; he wants it listed all the same: «سيبها في الفروقات عادي، أنا كنت بقولك معلومة بس»);
     · the letter number in our sheet is none of the letters ASE has for him.
   Nothing is changed anywhere: the page reads, and says. It is done again when the sheets are read again, or asked for. */
const CMP = { res: null, of: null, busy: false, err: false, done: 0, total: 0, cat: "" };
const CMP_KINDS = ["missing", "violation", "deleted", "left", "moved", "other", "banours", "letter"];
const CMP_WORD = { missing: "cmMissing", violation: "cmViolation", deleted: "cmDeleted", left: "cmLeft", moved: "cmMoved", other: "cmOther", banours: "cmBanOurs", letter: "cmLetter" };
const CMP_TONE = { missing: "mute", violation: "ban", deleted: "bad", left: "warn", moved: "ban", other: "red", banours: "bad", letter: "white" };
const CMP_MOVED = "ПЕРЕВОД";                         // ASE's own word for a transfer letter
const cmpDate = v => { const m = /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/.exec(String(v || "").trim()); return m ? +m[3] * 10000 + +m[2] * 100 + +m[1] : 0; };
const cmpKey = v => normalize(v).toUpperCase().replace(/\s+/g, "");
// everyone of ours who has a national id: a man is one line, whichever of the two sheets he is in
function cmpPeople(){
  const by = new Map(), id = v => /^\d{14}$/.test(v || "");
  if(M.ind) M.ind.list.forEach(g => { if(id(g.nid)) by.set(g.nid, { nid: g.nid, g, emps: g.emp || [] }); });
  if(M.emp) M.emp.list.forEach(e => {
    if(e.foreign || !id(e.nid)) return;
    const x = by.get(e.nid);
    if(!x) by.set(e.nid, { nid: e.nid, g: null, emps: [e] }); else if(!x.g && x.emps.indexOf(e) < 0) x.emps.push(e);
  });
  return [...by.values()];
}
// what does not agree for one man, given the rows ASE has for him
function cmpOne(x, hits){
  const what = [], e = x.emps[0];
  const valid = x.g ? x.g.p.cat === "ok" || x.g.p.cat === "soon" : x.emps.some(o => o.st.code === "VERIFIED" || o.st.code === "EXPIRING");
  const banned = permitBan(x.g) || x.emps.some(empBan);
  const letter = x.g ? x.g.cur.letter : (e.letter_number || "");
  if(!hits.length) return { what: ["missing"], ase: null };
  const latest = list => list.reduce((best, h) => !best || cmpDate(h[7]) >= cmpDate(best[7]) ? h : best, null);
  const ours = hits.filter(h => ASE_OURS.test(h[3] || "")), ase = latest(ours.length ? ours : hits), says = String(ase[2] || "").trim().toUpperCase();
  if(!ours.length) what.push("other");
  else{
    if(says === "RULES VIOLATION" && !banned) what.push("violation");
    if(says === "DELETED" && valid) what.push("deleted");
    if(says === "RESIGNATION" && valid) what.push("left");
    if(says === CMP_MOVED) what.push("moved");
    if(!says && banned) what.push("banours");
  }
  const mine = normalize(letter).toUpperCase().split(/\s+/).filter(Boolean);
  if(mine.length && !hits.some(h => mine.indexOf(cmpKey(h[8])) >= 0 || mine.indexOf(cmpKey(h[10])) >= 0)) what.push("letter");
  return { what, ase };
}
async function cmpRun(){
  if(CMP.busy || !link() || (!M.ind && !M.emp)) return;
  const of = M, people = cmpPeople(), by = new Map();
  CMP.busy = true; CMP.err = false; CMP.done = 0; CMP.total = people.length; paintCmp();
  try{
    await aseInfo();
    for(let i = 0; i < people.length; i += 400){
      const got = await dbCall("system_ase_find", { p_ids: people.slice(i, i + 400).map(x => x.nid) });
      (got || []).forEach(r => { if(!by.has(r[0])) by.set(r[0], []); by.get(r[0]).push(r.slice(1)); });
      CMP.done = Math.min(people.length, i + 400);
      if(st.view === "cmp") paintCmp();
    }
    // everyone looked up is kept, the ones who agree too: every box over the list can be pressed (asked for, 6 October 2026)
    const all = people.map(x => { const c = cmpOne(x, by.get(x.nid) || []); return { g: x.g, emps: x.emps, nid: x.nid, what: c.what, ase: c.ase }; });
    const first = r => r.what.length ? CMP_KINDS.indexOf(r.what[0]) : 99, name = r => sortText(r.g ? r.g.name : r.emps[0].full_name);
    all.sort((a, b) => first(a) - first(b) || name(a).localeCompare(name(b), "ar"));
    const rows = all.filter(r => r.what.length);
    CMP.res = { rows, all, checked: people.length, at: Date.now() }; CMP.of = of;
    if(CMP.cat && CMP.cat[0] !== "*" && !rows.some(r => r.what.indexOf(CMP.cat) >= 0)) CMP.cat = "";

  if(st.view === "cmp") paintCmp();
}

const cmpSays = r => !r.ase ? "" : String(r.ase[2] || "").trim() === "Перевод" ? "TRANSFER" : String(r.ase[2] || "").trim();

   many days, this month, next month, a named month), WHERE (a governorate or city of the address), of WHICH COMPANY,

const ASK_MONTHS = { "يناير": 0, "فبراير": 1, "مارس": 2, "ابريل": 3, "مايو": 4, "يونيو": 5, "يونيه": 5, "يوليو": 6, "يوليه": 6, "اغسطس": 7, "سبتمبر": 8, "اكتوبر": 9, "نوفمبر": 10, "ديسمبر": 11 };

  "عنوان عنوانه عنوانهم ساكن ساكنين سكان قسم وظيفه وظيفته اسم اسمه يوم ايام شهر اسبوع سنه جاي فات كلهم كله بس لسه هو هي ايه اي مين لو سمحت ممكن محتاج " +
  "عايزك تطلع تجيب جيب جبلي تجيبلي بتوعهم معاهم معاه عليهم عليه ان انه الذين التي الذي موجود موجودين عامل اتعمل اتعملهم اتعمله لهم له ليهم ase اسيه واحد واحده نفر انفار شخص اشخاص بتاعه بتاعهم بتاعتهم ولا مع").split(" ").map(w => spcWord(w)));
let askKnown = null;                                // what the sheets themselves name: places, companies, departments, jobs
function askVocab(){
  if(askKnown && askKnown.of === M) return askKnown;
  const k = { of: M, places: new Set(), names: new Set(), companies: new Map(), depts: new Map(), jobs: new Set() }, plain = v => spcWords(v).join(" ");
  const inAddr = new Map(), inName = new Map(), tally = (map, v) => new Set(spcWords(v)).forEach(w => { if(w.length > 1 && !/^\d+$/.test(w)) map.set(w, (map.get(w) || 0) + 1); });

// what was written, read: who, in what state, when, where, whose, which letter … — and what was left over
function askRead(text){
  const k = askVocab(), now = NCM.today0(), day = 86400000;

    const n = (m[1] ? +m[1] : 1) * ASK_UNIT[m[2]];

function askFind(a, text){
  const letters = a.letters.map(x => spcAsk(x, "letter")), has = (list, v) => list.some(w => v.indexOf(w) >= 0), inSpan = d => !!d && d >= a.from && d <= a.to;

    const words = a.unknown.concat(a.places, a.jobs, a.companies);

      (!words.length || words.every(w => (g.key + " " + spcWords(g.cur.owner + " " + g.cur.type).join(" ")).indexOf(w) >= 0)))
      .sort((x, y) => (x.cur.row || 0) - (y.cur.row || 0)).map(g => ({ g, emps: [] }));
  }
  if(a.bare && (a.unknown.length || a.names.length) && a.kind !== "veh") return findPeople(a.names.concat(a.unknown).join(" ")).list.filter(h => a.kind !== "emp" || h.emps.length);

/* ============================================================
   ADMIN — the users, and what each one sees
   ============================================================
   The admin's page, in his menu only. Every user is a box: his pages and what he may do, each a chip that is on or
   off and is kept the moment it is pressed; whether he may come in at all; and, for one added from here, another
   password or his removal. A user is added with a name and a password: the page seals, under that password, the
   same things the admin's own sign-in opened — with a viewer's token made for this user alone — and the database
   keeps the seal, so the gate has him the next time it is opened. The password itself goes nowhere.
   The users the page was built with are listed too: what they see is set here like anyone's, and so is another
   password (see gateUsers: the new seal takes the place of the page's own). The admin's own name is never switched
   off, and has two passwords to change: his ordinary way in, and the admin's. */
const ADM = { rows: [], at: 0, err: false, busy: "", pin: "", pinAdmin: false };
const admAll = () => PERM_PAGES.concat(PERM_CAN);
const admMe = () => (link() || {}).u || "";
async function admSync(){
  if(!isAdmin() || !link()) return;
  try{ ADM.rows = (await dbCall("system_user_list", {})) || []; ADM.err = false; ADM.at = Date.now(); }catch(e){ ADM.err = true; }
  paintAdm();
}
// everyone who has a way in: the page's own users first, then the ones added here — each with what the database says of him
function admUsers(){
  const by = new Map(ADM.rows.map(r => [r.name, r])), names = usersIn().map(u => u.name).filter((n, i, all) => all.indexOf(n) === i);
  const row = (name, added) => { const r = by.get(name) || {}; return { name, added, off: !!r.off, pages: Array.isArray(r.pages) ? r.pages : null }; };
  return names.map(n => row(n, false)).concat(ADM.rows.filter(r => r.added && names.indexOf(r.name) < 0).map(r => row(r.name, true)));
}

async function admSet(name, pages, off){
  try{
    await dbCall("system_user_set", { p_name: name, p_pages: pages, p_off: !!off, p_who: admMe() });
    const r = ADM.rows.find(x => x.name === name);
    if(r){ r.pages = pages; r.off = !!off; } else ADM.rows.push({ name, pages, off: !!off, added: false });
    ADM.err = false;
  }catch(e){ toast(t("adFail"), true); }
  paintAdm();
}
function admToggle(name, key){
  const u = admUsers().find(x => x.name === name);
  if(!u) return;
  const all = admAll(), now = new Set(u.pages || all);
  if(now.has(key)) now.delete(key); else now.add(key);
  const pages = all.filter(k => now.has(k));
  admSet(name, pages.length === all.length ? null : pages, u.off);      // everything on is no list at all
}
function admOff(name){
  const u = admUsers().find(x => x.name === name);
  if(u && name !== admMe()) admSet(name, u.pages, !u.off);
}
// what a new password opens: what the admin's own opened, with a viewer's token that is this user's alone — or, for
// the admin's own way in, with the admin's token, as the page's own seal of him has it
async function admSeal(pin, admin){
  const l = link(), src = ONLINE ? session.src : CLOUD;
  const token = admin ? l.rt : [].map.call(crypto.getRandomValues(new Uint8Array(32)), x => x.toString(16).padStart(2, "0")).join("");
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: KDF_ROUNDS, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const payload = JSON.stringify({ k: l.k, sheet: src.sheet || "", db: l.db, bucket: src.bucket || "", role: admin ? "admin" : "viewer", rs: l.rs, rt: token });
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(payload)));
  return { p_salt: toB64(salt), p_iv: toB64(iv), p_data: toB64(data), p_key: admin ? null : await sha256hex(token), p_admin: !!admin };
}
/* One name, two ways in, must not have one password: the gate takes whichever seal the password opens first. So a new
   password is tried on every seal the name has — the page's own and the database's — and is refused when it opens
   his OTHER way in. */
async function admClash(name, pin, admin){
  let seals = usersIn().filter(u => u.name === name);
  try{
    const got = await dbCall("system_gate_users", { p_device: "" });
    seals = seals.concat(((got && got.users) || []).concat((got && got.admins) || []).filter(u => u && u.name === name && u.data));
  }catch(e){}
  for(const seal of seals){
    try{ if((JSON.parse(await unseal(seal, pin)).role === "admin") !== !!admin) return true; }catch(e){}
  }
  return false;
}
async function admPut(name, pin, mark, admin){
  if(ADM.busy || !link()) return false;
  ADM.busy = mark; paintAdm();
  let ok = false, clash = false;
  try{
    clash = await admClash(name, pin, admin);
    if(!clash){
      const got = await dbCall("system_user_put", Object.assign({ p_name: name, p_who: admMe() }, await admSeal(pin, admin)));
      ok = !!(got && got.ok);
    }
  }catch(e){}
  ADM.busy = "";
  if(!ok){ toast(t(clash ? "adPinClash" : "adFail"), true); paintAdm(); }
  return ok;
}
const admDigits = v => NCM.toLatinDigits(String(v || "")).replace(/\D/g, "");
