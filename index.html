/* ============================================================
   LIVE LINK TO THE SHEETS
   Every few seconds each workbook is asked for one byte. The reply carries
   the time it was last saved, and costs a few milliseconds; only when that
   time has moved is the workbook actually read again. A save in Excel shows
   up here on its own, with nothing to press.
   ============================================================ */
const LIVE = location.protocol === "file:";
const RESUME_KEY = "ncm_system_resume";
/* A window that reloads itself to take a newer copy of the system comes back
   where it was: the page, the open sender, what was typed into the search.
   It is kept for the length of the reload only, in this tab only. */
function keepPlace(){
  try{ sessionStorage.setItem(RESUME_KEY, JSON.stringify({ view: st.view, snd: st.snd, rnw: st.rnw, text: $("mt") ? $("mt").value : st.multi.text, mode: st.multi.mode })); }catch(e){}
}
function takePlace(use){
  try{
    const was = JSON.parse(sessionStorage.getItem(RESUME_KEY) || "null");
    sessionStorage.removeItem(RESUME_KEY);
    if(!was || !use) return;                  // online, with nobody signed in, what was kept is simply dropped
    if(document.querySelector('#nav button[data-view="' + was.view + '"]')) st.view = was.view;
    if(was.snd) st.snd = Object.assign(st.snd, was.snd);
    if(was.rnw) st.rnw = Object.assign(st.rnw, was.rnw);
    st.multi.text = was.text || ""; if(was.mode === "veh" || was.mode === "ind") st.multi.mode = was.mode;
  }catch(e){}
}
const seen = { per: "", emp: "" };          // the save time of what is on screen
/* Is each sheet where it is meant to be? A sheet that has been moved or
   renamed cannot be re-read: what is on screen is then the last copy, growing
   older by the day. That must be said out loud rather than left looking live. */
const reach = { per: null, emp: null };
const lost = kind => live === true && reach[kind] === false;
let live = null;                            // null: not tried yet · true: reading the disk · false: the browser will not let us
let syncing = false;
function ask(kind, whole){
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    try{
      x.open("GET", fileURL(SOURCES[kind]));
      x.responseType = "arraybuffer";
      if(!whole) x.setRequestHeader("Range", "bytes=0-0");
      x.onload = () => resolve({ stamp: x.getResponseHeader("last-modified") || "", buf: x.response });
      x.onerror = () => resolve(null);
      x.send();
    }catch(e){ resolve(null); }
  });
}
async function sync(force){
  if(!LIVE || syncing) return;
  syncing = true;
  const fresh = [];
  let reached = 0, moved = false;
  try{
    for(const kind of ["per", "emp"]){
      const head = await ask(kind, false);
      if(reach[kind] !== !!head){ reach[kind] = !!head; moved = true; }
      if(!head) continue;
      reached++;
      if(!force && DATA[kind] && (!head.stamp || head.stamp === seen[kind])) continue;
      // Excel replaces the file as it saves; a read that lands in the middle
      // fails or parses to nonsense. Either way nothing is kept and the next
      // tick tries again — what is on screen stays until a clean read lands.
      try{
        const got = await ask(kind, true);
        if(!got || !got.buf) continue;
        const payload = await NCM.readFile({
          name: SOURCES[kind].split("/").pop(), size: got.buf.byteLength,
          lastModified: got.stamp ? Date.parse(got.stamp) : Date.now(),
          arrayBuffer: async () => got.buf
        });
        if(payload.kind !== kind) continue;
        payload.stamp = got.stamp; payload.path = SOURCES[kind];
        DATA[kind] = payload; seen[kind] = got.stamp;
        idb.set(kind, payload);
        fresh.push(kind);
      }catch(e){ console.warn("[NCM SYSTEM] " + kind + " not readable yet", e); }
    }
  }finally{ syncing = false; }
  const was = live;
  live = reached > 0;
  if(fresh.length){
    rebuild(true);
    // said only for a save that arrives while the system is open, not for the first read
    if(was !== null && !force) toast(t("updated", fresh.map(sheetName).join(t("and"))));
  }
  else if(was !== live || moved){ paintShell(); if(st.view === "src" || (!DATA.emp && !DATA.per)) render(); }
  return fresh;
}
async function refresh(){
  if(ONLINE){
    await cloudSync();
    const ok = net.per !== false && net.emp !== false;
    return toast(t(ok ? "reread" : "rereadFail"), !ok);
  }
  if(live){
    const fresh = await sync(true);
    const ok = !!(fresh && fresh.length);
    return toast(t(ok ? "reread" : "rereadFail"), !ok);
  }
  const kinds = ["per", "emp"].filter(k => HANDLES[k]);
  if(!kinds.length) return pick();
  const items = [];
  try{
    for(const k of kinds){
      const h = HANDLES[k];
      let perm = await h.queryPermission({ mode: "read" });
      if(perm !== "granted") perm = await h.requestPermission({ mode: "read" });
      if(perm !== "granted") continue;
      items.push({ kind: k, file: await h.getFile(), handle: h });
    }
  }catch(e){
    console.warn(e);
    toast(t("oldFilesFail"), true);
    return pick();
  }
  if(!items.length) return pick();
  // an unchanged file is not read again; the one that was saved since is
  const changed = items.filter(it =>
    !(DATA[it.kind] && DATA[it.kind].lastModified === it.file.lastModified && DATA[it.kind].size === it.file.size));
  if(!changed.length){ rebuild(); return toast(t("noNewSave")); }
  return takeFiles(changed);

/* ============================================================
   ONLINE — signing in, and the two sources read over the network
   ============================================================ */
const SESSION_KEY = "ncm_system_session", LAST_USER_KEY = "ncm_system_user", BUILT_KEY = "ncm_system_built";
let session = null;                          // { v, u: the user's name, k: his unsealed key } — in this tab only, never on disk for good
const net = { per: null, emp: null };        // did the last read of each source get through?
const sig = { per: "", emp: "" };            // fingerprint of what was read last, to tell "changed" from "the same again"
let cloudBusy = false, cloudTimer = null, lastCloud = 0;
let cloudGen = 0;                            // moves on at every sign-out: a read begun before it is thrown away when it lands
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function fingerprint(s){
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return s.length + ":" + (h >>> 0);
}
// Throws when the password is wrong: AES-GCM refuses to authenticate the blob.
async function unseal(user, pass){
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(user.salt), iterations: KDF_ROUNDS, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(user.iv) }, key, b64(user.data)));
}
function parseCSV(text){
  const rows = []; let row = [], cell = "", quoted = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(quoted){
      if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    }
    else if(ch === '"') quoted = true;
    else if(ch === ","){ row.push(cell); cell = ""; }
    else if(ch === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(ch !== "\r") cell += ch;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
/* The permits, exactly the way the app fetches them: the sheet's CSV export,
   tab by tab. The export wants a tab's gid, and every upload replaces the tabs
   and so changes the gids — they are looked up by NAME on each read. Only if
   that fails is gviz used: it blanks text cells in a column that is mostly
   dates, so a read that came that way is marked as a fallback. */
async function cloudPermits(key, at){
  const gids = {}, BS = String.fromCharCode(92), SHEET = at.sheet;
  try{
    const r = await fetch(SHEET + "/htmlview?_=" + Date.now(), { cache: "no-store" });
    if(r.ok){
      const html = await r.text(), re = /items\.push\(\{name: "((?:[^"\\]|\\.)*)"[\s\S]*?gid: "(\d+)"/g;
      let m;
      while((m = re.exec(html))){
        try{ gids[JSON.parse('"' + m[1].replace(/\\x([0-9a-fA-F]{2})/g, BS + "u00$1") + '"')] = m[2]; }catch(e){}
      }
    }
  }catch(e){}
  let fallback = false;
  /* What comes back has to be the tab's rows. Google sometimes answers with a
     web page instead — an error page, a sign-in page — and says 200 all the
     same; read as rows, that page emptied the permits and every search said
     "not in the sheet". A page, or nothing at all, is a read that failed: what
     is on screen stays, and the sheet is shown as out of reach. */
  const isRows = text => !!text.trim() && !/^\s*</.test(text);
  const tab = async name => {
    if(gids[name]){
      const r = await fetch(SHEET + "/export?format=csv&gid=" + gids[name] + "&_=" + Date.now(), { cache: "no-store" });
      if(r.ok){ const text = await r.text(); if(isRows(text)) return text; }
    }
    fallback = true;
    const g = await fetch(SHEET + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(name) + "&_=" + Date.now(), { cache: "no-store" });
    if(!g.ok) throw new Error("sheet " + g.status);
    const text = await g.text();
    if(!isRows(text)) throw new Error("the sheet answered with a page, not rows");
    return text;
  };
  const texts = await Promise.all([tab(CLOUD.tabs.ind), tab(CLOUD.tabs.veh)]);
  const shape = (text, maxCol) => {
    const rows = parseCSV(text);
    return { header: (rows[0] || []).slice(0, maxCol),
             rows: rows.slice(1).map((c, i) => ({ n: i + 2, c: c.slice(0, maxCol) })).filter(r => r.c.some(v => v !== "")) };
  };
  return { kind: "per", cloud: true, fallback, fileName: "Google Sheet", lastModified: Date.now(), loadedAt: Date.now(),
           size: texts[0].length + texts[1].length, sheets: { ind: shape(texts[0], 16), veh: shape(texts[1], 8) } };
}
/* The staff table, a page at a time: a plain select hands back the first 1000
   rows and says nothing about the rest. Ordering by id is what makes the pages
   line up. The rows are handed to the model in the shape of the sheet — same
   column names, same order — so one set of rules serves both editions. */
async function cloudEmployees(key, at){
  const recs = [], PAGE_ROWS = 1000;
  for(let from = 0; ; from += PAGE_ROWS){
    const r = await fetch(at.db + "/rest/v1/employees?select=*&order=id.asc&limit=" + PAGE_ROWS + "&offset=" + from,
      { headers: { apikey: key, Authorization: "Bearer " + key }, cache: "no-store" });
    if(r.status === 401 || r.status === 403){ const e = new Error("refused"); e.code = "AUTH"; throw e; }
    if(!r.ok) throw new Error("database " + r.status);
    const part = await r.json();
    recs.push(...part);
    if(part.length < PAGE_ROWS) break;
  }
  if(!recs.length) throw new Error("the database answered with no rows");
  const header = Object.keys(NCM.EMP_COLS);
  const text = v => (v === null || v === undefined) ? "" : String(v);
  return { kind: "emp", cloud: true, fileName: "employees", lastModified: Date.now(), loadedAt: Date.now(), size: recs.length,
           sheets: { emp: { header, rows: recs.map((rec, i) => ({ n: i + 2, c: header.map(h => text(rec[NCM.EMP_COLS[h]])) })) } } };
}
async function cloudSync(first){
  if(cloudBusy || !session) return [];
  cloudBusy = true; lastCloud = Date.now();
  const gen = cloudGen, key = session.k, at = { sheet: CLOUD.sheet, db: CLOUD.db };
  const fresh = [];
  let refused = false, moved = false;
  await Promise.all([["per", cloudPermits], ["emp", cloudEmployees]].map(async job => {
    const kind = job[0];
    try{
      const payload = await job[1](key, at);
      if(gen !== cloudGen) return;           // signed out while this was on its way: none of it is kept
      // a read that could only be had the poor way — it blanks the text cells of the permit column, the bans among them — never replaces a complete one
      if(payload.fallback && DATA[kind] && !DATA[kind].fallback) throw new Error("only the fallback read answered; the complete read on screen is kept");
      if(net[kind] !== true){ net[kind] = true; moved = true; }
      const f = fingerprint(JSON.stringify(payload.sheets));
      if(f !== sig[kind]){ sig[kind] = f; DATA[kind] = payload; fresh.push(kind); }
      else if(DATA[kind]) DATA[kind].loadedAt = Date.now();
    }catch(e){
      if(gen !== cloudGen) return;
      if(e && e.code === "AUTH") refused = true;
      else{
        console.warn("[NCM SYSTEM] " + kind + " could not be read", e);
        if(net[kind] !== false){ net[kind] = false; moved = true; }
      }
    }
  }));
  if(gen !== cloudGen) return [];            // the sign-out has already cleared the page and freed the lock
  cloudBusy = false;
  // a key the database no longer accepts is a sign-in that has been withdrawn
  if(refused){ signOut(t("sessionEnded")); return []; }
  if(fresh.length){
    rebuild(!first);
    if(!first) toast(t("updated", fresh.map(sheetName).join(t("and"))));
  }else{
    paintShell();
    if(moved && (st.view === "src" || (!DATA.emp && !DATA.per))) render();
  }
  return fresh;
}

/* The unsealed key lives in sessionStorage: it survives a reload of the tab

const IDLE_MS = 30 * 60 * 1000;
let lastTouch = Date.now();

function touched(){ if(idleTooLong()) signOut(t("idleOut")); else lastTouch = Date.now(); }

function signOut(message){

  st.multi.text = ""; st.multi.res = null;
  st.emp.q = st.ind.q = st.veh.q = ""; st.snd = { kind: "per", q: "", open: null, tab: "ind" }; st.rnw = { q: "", open: null, tab: "" }; st.view = "multi";

/* `quiet` is for a sheet that changed underneath an open page: the figures are
   redrawn where they stand, and a box someone is typing in is left alone —
   redrawing the whole page would take the cursor out of his hands. */
function rebuild(quiet){

  if(quiet && LISTS[st.view] && $("tbl") && M[LISTS[st.view].need]) return paintTable(st.view, true);
  const listPage = st.view === "snd" || st.view === "rnw";
  if(quiet && listPage && sndState().open === null && $("tbl")){ buildSenders(); return (st.view === "rnw" ? paintRenew : paintSenders)(); }
  if(quiet && listPage && $("tbl")){ const at = rowsAt($("tbl")); render(); return rowsTo($("tbl"), at); }
  render();
}
/* A NEW DAY. Every status — valid, about to run out, run out — and every count
   of days left is worked out against today's date at the moment the sheets are
   read. A window left open past midnight went on showing yesterday's: a permit
   that ran out at midnight stayed valid on screen until a sheet happened to
   change. The day the figures were worked out for is remembered; when it is no
   longer today they are worked out again, where they stand. */
let builtDay = NCM.today0().getTime();
function newDay(){
  if(NCM.today0().getTime() === builtDay || (!DATA.emp && !DATA.per)) return;
  rebuild(true);

/* Switching language changes the words and nothing else. The page stays laid
   out right to left in both — the menu keeps its side, every button and box
   its place — which is what the permits half of the app does too. */
function applyLang(){

function paintShell(){

  $("nb-ind").textContent = M.ind ? M.ind.list.length : "";
  $("nb-veh").textContent = M.veh ? M.veh.list.length : "";
  // how many are near their end: people, vehicles and employees together
  const due = (M.ind ? countBy(M.ind.list, g => g.p.cat === "soon") : 0) + (M.veh ? countBy(M.veh.list, g => g.p.cat === "soon") : 0) + (M.emp ? countBy(M.emp.list, EMP_PICK.expiring) : 0);

  nb.textContent = any ? M.issues : "";

  const mini = ONLINE

        (net[kind] === false ? t("noConnMini") : DATA[kind] && DATA[kind].fallback ? t("fallbackMini") : DATA[kind] ? num(stamp(DATA[kind].loadedAt)) : t("notYet")) + "</div>"
    : (kind, label) => '<div><span class="dot' + (lost(kind) ? " lost" : DATA[kind] ? " on" : "") + '"></span>' + t(label) + " " +
        (lost(kind) ? t("lostMini") : DATA[kind] ? num(stamp(DATA[kind].lastModified)) : t("notYet")) + "</div>";
  $("src-mini").innerHTML = mini("per", "miniPer") + mini("emp", "miniEmp");

/* BACK. Every move from one page to another leaves behind what that page was
   showing — which page, and how its list was filtered and sorted — and Back
   puts exactly that on screen again. What is typed into the search page and
   its answers are not part of it: they stay as they are whichever way you go. */
const trail = [];
const where = () => JSON.stringify({ view: st.view, emp: st.emp, ind: st.ind, veh: st.veh, snd: st.snd, rnw: st.rnw });
function leave(){
  const now = where();
  if(trail[trail.length - 1] !== now) trail.push(now);
  if(trail.length > 60) trail.shift();
}
function paintBack(){ $("back").disabled = !trail.length; }
function goBack(){
  if(!trail.length || !$("gate").hidden) return;
  const was = JSON.parse(trail.pop());
  if($("mt")) st.multi.text = $("mt").value;
  st.view = was.view; st.emp = was.emp; st.ind = was.ind; st.veh = was.veh; st.snd = Object.assign({ kind: "per", q: "", open: null, tab: "ind" }, was.snd || st.snd);
  st.rnw = Object.assign({ q: "", open: null, tab: "" }, was.rnw || st.rnw);
  closeDrawer();
  paintShell(); render();
}
function go(view){
  st.view = view;
  paintShell(); render();
}
/* EVERY PAGE IS TWO PARTS. A head that never moves — the mark, the title, the
   page's own buttons and filters — and under it the one part that scrolls,
   with a bar of its own. `body` arrives already wrapped in whichever of the
   two movers it is: .pg-scroll for a page of boxes, .pg-table for a table
   (there the rows move and the column names stay with the head). */
const BRAND =
  '<div class="brand cbrand">' +
    '<span class="ncm">N<i>C</i><b>M</b></span>' +
    '<span class="tagline">NUCLEAR CONCRETE MIXES</span>' +
    '<span class="hr"></span>' +
    '<span class="appname">SYSTEM</span>' +
  "</div>";
function page(head, body){
  out.innerHTML = '<div class="pg-fixed">' + BRAND + head + "</div>" + body;
}
const pgHead = (title, extra) => '<div class="pg-head"><div><h1 class="pg-t">' + title + "</h1></div>" + (extra || "") + "</div>";
const scrollPart = h => '<div class="pg-scroll">' + h + "</div>";
function render(){
  const blank = !DATA.emp && !DATA.per && st.view !== "src";
  if(blank) return renderWelcome();
  ({ home: renderHome, emp: () => renderList("emp"), ind: () => renderList("ind"), veh: () => renderList("veh"),
     check: renderChecks, src: renderSources, multi: renderMulti, snd: renderSenders, rnw: renderRenew }[st.view] || renderMulti)();
}
// where the rows of a table page have been scrolled to — kept across a repaint that is not the reader's doing
const rowsAt = host => { const w = host && host.querySelector(".tblwrap"); return w ? w.scrollTop : 0; };
const rowsTo = (host, y) => { const w = host && host.querySelector(".tblwrap"); if(w && y) w.scrollTop = y; };

function slotsHTML(){

const tile = (label, value, tone, goTo, pulse) =>
  '<button type="button" class="tile' + (tone ? " " + tone : "") + (pulse ? " pulse" : "") + '" data-go="' + esc(goTo) + '">' +
  '<span class="tile-k">' + esc(label) + '</span><span class="tile-v num">' + value + "</span></button>";

const EMP_PICK = {
  all:      () => true,
  active:   e => !e.resigned,
  valid:    e => !e.resigned && e.st.code === "VERIFIED",
  expiring: e => !e.resigned && e.st.code === "EXPIRING",
  expired:  e => !e.resigned && e.st.code === "EXPIRED",
  // "no permit" and "valid, but no date written" are two different findings and
  // get a chip each — the second is a permit that exists and a date that is missing
  nopermit: e => !e.resigned && (e.st.code === "NO PERMIT" || e.st.code === "UNKNOWN"),
  nodate:   e => !e.resigned && e.st.code === "NO DATE",
  banned:   e => !e.resigned && e.permit_status === "ممنوع",
  resigned: e => e.resigned,
  foreign:  e => e.works && e.foreign
};
/* The page opens on who is here. Those who left are one chip away, and
   «الكل» sits last: it is the one that mixes the two. */
const EMP_CHIPS = [["active","chActive"],["valid","chValid"],["expiring","chExpiring"],["expired","chExpired"],
                   ["nopermit","chNoPermit"],["nodate","stNoDate"],["banned","chBanned"],["foreign","chForeign"],["resigned","chResigned"],["all","chAll"]];
const PER_CHIPS = [["all","chAll"],["ok","cOk"],["soon","cSoon"],["expired","cExpired"],["ban","cBan"],
                   ["renew","cRenew"],["temp","cTemp"],["pending","cPending"],["undet","cUndet"]];
const countBy = (list, pick) => { let n = 0; for(const x of list) if(pick(x)) n++; return n; };
const catCount = list => { const c = {}; list.forEach(g => { c[g.p.cat] = (c[g.p.cat] || 0) + 1; }); return c; };

function barsHTML(pairs, unit){
  const max = Math.max(1, ...pairs.map(p => p[1]));
  return '<div class="bars">' + pairs.map(p =>
    '<div class="bar-row" data-tip="' + esc(p[0] + " — " + p[1] + " " + unit) + '">' +
      '<span class="bar-l">' + esc(p[0]) + "</span>" +
      '<span class="bar-track"><span class="bar-fill" style="width:' + (p[1] / max * 100).toFixed(1) + '%"></span></span>' +
      '<span class="bar-v num">' + p[1] + "</span></div>").join("") + "</div>";
}
function expiryDates(kind){
  if(kind === "emp") return M.emp ? M.emp.list.filter(e => !e.resigned && e.pdate && e.permit_status === "ساري").map(e => e.pdate) : [];
  const src = kind === "ind" ? M.ind : M.veh;
  return src ? src.list.filter(g => g.p.date).map(g => g.p.date) : [];
}
function monthsHTML(){
  const now = NCM.today0(), buckets = [];
  for(let i = 0; i < 12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    buckets.push({ y: d.getFullYear(), m: d.getMonth(), n: 0 });
  }
  expiryDates(st.chart).forEach(d => {
    if(d < now) return;
    const i = (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth();
    if(i >= 0 && i < 12) buckets[i].n++;
  });
  const max = Math.max(1, ...buckets.map(b => b.n));
  return '<div class="cols">' + buckets.map(b =>
      '<div class="col' + (b.n ? "" : " zero") + '" data-tip="' + esc(t("monthTip", MONTHS[lang][b.m], b.y, b.n)) + '">' +
        (b.n ? '<span class="col-v num">' + b.n + "</span>" : "") +
        '<span class="col-bar" style="height:' + (b.n / max * 100).toFixed(1) + '%"></span></div>').join("") + "</div>" +
    '<div class="cols-x">' + buckets.map(b => '<span class="num">' + String(b.m + 1).padStart(2, "0") + "/" + String(b.y).slice(2) + "</span>").join("") + "</div>";
}
/* One box per standing, each a count of its own — «في انتظار الرد» and
   «غير محدد» are separate boxes, never one sum. A standing the row does not
   normally show (a ban on a vehicle, say) gets a box the day it has anyone in
   it, so the boxes always add up to the first one. */
const CAT_TILE = { ok:["cOk","ok"], soon:["cSoon","warn"], expired:["cExpired","bad"], ban:["cBan","ban"],
                   renew:["cRenew","bad"], temp:["cTemp","mute"], pending:["cPending",""], undet:["cUndet","mute"] };
function permitTiles(view, totalLabel, total, c, show){
  const cats = show.concat(Object.keys(CAT_TILE).filter(k => show.indexOf(k) === -1 && c[k]));
  const n = cats.length + 1;
  return '<div class="tiles" style="--n:' + n + ";--half:" + Math.ceil(n / 2) + '">' +
    tile(totalLabel, total, "job", view + ":all") +
    cats.map(k => tile(t(CAT_TILE[k][0]), c[k] || 0, CAT_TILE[k][1], view + ":" + k, k === "soon" && c[k] > 0)).join("") + "</div>";
}
const sectH = (title, goTo) => '<div class="sect-h">' + title + '<button class="lnk" data-go="' + goTo + '">' + t("openList") + "</button></div>";

/* ============================================================
   «تصدير بيانات» — one workbook for one sender.
   The sender of a person is the «المرسل» column of the individuals sheet; of
   a vehicle, «تابعه». The same sender written different ways is one sender
   (the rules are spelled out above senderKey). What goes into the
   workbook is what that sender has standing NOW — each person's or vehicle's
   current record — and only two kinds of it: a permit that is still valid
   (near its end counts: it is still valid today), and a ban of any wording.
   Expired, waiting, undetermined, renewal and temporary ones are left out.

const SND_KEEP = { ok: "ok", soon: "ok", ban: "ban" };
let SND = [];
/* WHO A LINE IS REALLY FOR. The sender columns are typed by hand, so one
   sender turns up written many ways. Lines are filed together when they say
   the same thing, by these rules and no others:
     · a name followed by brackets is what is in the brackets:
         «العقيد احمد ( اسمنت ريلانس )» = «اسمنت ريلانس»   (a bracket left unclosed reads the same)
     · «العقيد احمد» in front of something, without brackets, is that something;
         on his own, with or without «شلبى», he is himself
     · spelling: أ/ا, ة/ه, ى/ي, a final ء, a doubled or stretched letter, «ال»
         in front of a word, capitals, spaces, dots and dashes do not count
     · a title in front (م. / مهندس / مستر) does not count
     · the order of the words does not count:  «سيوة ثلج» = «ثلج سيوة»
     · the same word in the other alphabet, or in the plural, is the same word
         (the short list below — it holds only what the sheet actually uses)
     · and, last, two names at least five letters long, with no number in
         them, that differ by ONE letter — one wrong, one missing, one extra,
         or two swapped — are one:
         «ريوبلاست» = «ريبولاست»,  «مان لفت» = «مان ليفت»
   What is NOT joined: a name and the same name with a word added
   («سيوة» / «سيوة تشوينات», «حسام مشتريات» / «حسام فوزى مشتريات»). Those may
   well be different things, and a guess here would put one sender's permits
   in another's file. */
const senderOf = raw => { const m = /[(（]\s*([^()（）]*?)\s*[)）]?\s*$/.exec(raw); return m && m[1] ? m[1] : raw; };
const SND_SAME = {
  blue: "بلو", white: "وايت", collar: "", khaled: "خالد", ahmed: "احمد",
  abna: "ابناء", sina: "سيناء", abo: "ابو", alwafa: "الوفا", wafa: "الوفا", el: "", al: "",
  cemint: "اسمنت", cement: "اسمنت", marwa: "المروه",
  "باصات": "باص", "قلابات": "قلاب", "مخازن": "مخزن", "اورانج": "اورنج"
};
const SND_TITLES = new Set(["م", "مهندس", "المهندس", "مستر"]);
function senderKey(raw){
  let words = senderOf(raw).split(/[\s.\-–—_،,\/]+/).map(w => foldArabic(w)).filter(Boolean);
  words = words.map(w => SND_SAME.hasOwnProperty(w) ? foldArabic(SND_SAME[w]) : w).filter(w => w && !SND_TITLES.has(w));
  // the colonel in front of something else is that something else
  if(words.length > 2 && words[0] === "العقيد" && words[1] === "احمد"){
    const rest = words.slice(2).filter(w => w !== "شلبي");
    words = rest.length ? rest : words.slice(0, 2);
  }
  return words.map(w => (w.length > 4 && w.startsWith("ال") ? w.slice(2) : w).replace(/ء/g, "").replace(/(.)\1+/g, "$1")).filter(Boolean).sort().join(" ");
}
// one letter apart: one changed, one dropped, one added, or two neighbours swapped
function oneApart(a, b){
  if(a === b) return true;
  const la = a.length, lb = b.length;
  if(Math.abs(la - lb) > 1) return false;
  let i = 0;
  while(i < la && i < lb && a[i] === b[i]) i++;
  if(la === lb) return a.slice(i + 1) === b.slice(i + 1) || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
  return la > lb ? a.slice(i + 1) === b.slice(i) : a.slice(i) === b.slice(i + 1);
}
function buildSenders(){
  const by = new Map();
  const take = (list, field, kind) => {
    if(!list) return;
    for(const g of list){
      const raw = g.cur[field] || "", who = senderOf(raw), k = senderKey(raw);
      let e = by.get(k);
      if(!e){ e = { k, forms: new Map(), written: new Set(), ind: [], veh: [], n: { indok: 0, indban: 0, vehok: 0, vehban: 0 } }; by.set(k, e); }
      e.forms.set(who, (e.forms.get(who) || 0) + 1);
      e.written.add(raw);
      const keep = SND_KEEP[g.p.cat];
      if(keep){ e[kind].push(g); e.n[kind + keep]++; }
    }
  };
  take(M.ind && M.ind.list, "sender", "ind");
  take(M.veh && M.veh.list, "owner", "veh");
  // the one-letter rule: the smaller of two such names is poured into the bigger
  const size = e => e.forms.size ? [...e.forms.values()].reduce((a, b) => a + b, 0) : 0;
  const keys = [...by.keys()];
  for(let i = 0; i < keys.length; i++) for(let j = i + 1; j < keys.length; j++){
    const a = by.get(keys[i]), b = by.get(keys[j]);
    if(!a || !b) continue;
    const x = keys[i].replace(/ /g, ""), y = keys[j].replace(/ /g, "");
    if(Math.min(x.length, y.length) < 5 || /\d/.test(x + y) || !oneApart(x, y)) continue;      // a number in a name tells two things apart: «خلاطة 132» is not «خلاطة 133»
    const into = size(a) >= size(b) ? a : b, from = into === a ? b : a;
    from.forms.forEach((n, w) => into.forms.set(w, (into.forms.get(w) || 0) + n));
    from.written.forEach(w => into.written.add(w));
    into.ind = into.ind.concat(from.ind); into.veh = into.veh.concat(from.veh);
    Object.keys(into.n).forEach(q => { into.n[q] += from.n[q]; });

    e.hay = [...e.written].map(foldArabic).join("|");      // found by any way it was written, the name before the brackets included
    return e;

/* ============================================================
   SEARCH — a list goes in, one line each; a row per line comes out, in the
   same order, and a line that matched nobody keeps its row so the gap is
   seen rather than skipped.
   ============================================================ */
const MULTI_CAP = 5000;                     // per line: more than either sheet holds, so everything a line finds is shown — a guard, not a limit anyone meets
/* SEARCH HISTORY. Every search that is run is remembered — the list as it was
   typed, whether it was people or vehicles (employees are found under people),
   how many lines, when — newest first, the same search never twice. The small
   arrow beside the search box opens it; a line in it puts that list back in
   the box and runs it again.
   Where it is kept: on this PC the list is this PC's own. Online it is kept
   SEALED with the reader's own key (AES-GCM), a list per user: without the
   PIN it is noise, like everything else the online edition holds. */
const HIST_KEY = "ncm_system_history", HIST_MAX = 40;
let HIST = [];
const histSlot = () => ONLINE ? HIST_KEY + ":" + session.u : HIST_KEY;
const toB64 = bytes => { let s = ""; for(let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); };
async function histCrypt(){
  const raw = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(session.k + "|ncm-system-history"));
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
}
async function histLoad(){
  HIST = [];
  try{
    if(ONLINE && !session) return;
    const kept = localStorage.getItem(histSlot());
    if(!kept) return;
    let list;
    if(!ONLINE) list = JSON.parse(kept);
    else{
      const o = JSON.parse(kept);
      list = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(o.iv) }, await histCrypt(), b64(o.data))));
    }
    // what comes off the disk is taken for nothing more than what it should be
    if(Array.isArray(list)) HIST = list.filter(x => x && typeof x.t === "string" && x.t).slice(0, HIST_MAX)
      .map(x => ({ m: x.m === "veh" ? "veh" : "ind", t: x.t.slice(0, 6000), n: +x.n || 0, f: +x.f || 0, at: +x.at || 0 }));
  }catch(e){ HIST = []; }
}
async function histSave(){
  try{
    if(!ONLINE) return localStorage.setItem(histSlot(), JSON.stringify(HIST));
    if(!session) return;
    const slot = histSlot(), iv = crypto.getRandomValues(new Uint8Array(12));
    const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await histCrypt(), new TextEncoder().encode(JSON.stringify(HIST))));
    localStorage.setItem(slot, JSON.stringify({ iv: toB64(iv), data: toB64(data) }));
  }catch(e){}
}
function histAdd(){
  const res = st.multi.res;
  if(!res || !res.terms) return;
  const text = parseTerms(st.multi.text).terms.join("\n").slice(0, 6000);
  HIST = HIST.filter(x => !(x.m === res.mode && x.t === text));
  HIST.unshift({ m: res.mode, t: text, n: res.terms, f: res.found, at: Date.now() });
  if(HIST.length > HIST_MAX) HIST.length = HIST_MAX;
  histSave();
}
function histHTML(){
  if(!HIST.length) return '<div class="hist-empty">' + t("histEmpty") + "</div>";
  return HIST.map((x, i) => {

}

function histPick(i){

  if(!x) return;

function parseTerms(text){
  const terms = [], seenT = new Set(); let dup = 0;
  NCM.toLatinDigits(text).split(/[\n\r,;،\t]+/).forEach(piece => {
    let parts = [piece.trim()];
    /* Digits with gaps on one line are either several ids pasted side by side
       or one id typed with a space in it. Fourteen digits in all is one
       national id however it was spaced ("2990102 2020231" is a man, not two
       half-numbers); otherwise pieces long enough to stand alone are separate
       entries, and anything else is one number with stray spaces. */
    if(/^[\d\s]+$/.test(parts[0]) && /\s/.test(parts[0])){
      const toks = parts[0].split(/\s+/), joined = toks.join("");
      parts = joined.length === 14 ? [joined] : toks.every(x => x.length >= 5) ? toks : [joined];
    }
    parts.forEach(p => {
      p = normalize(p);
      if(!p) return;
      const k = foldArabic(p);
      if(seenT.has(k)){ dup++; return; }
      seenT.add(k); terms.push(p);
    });
  });
  return { terms, dup };
}
const capped = all => ({ list: all.slice(0, MULTI_CAP), more: Math.max(0, all.length - MULTI_CAP) });
const NAME_SHOW = 50;                       // of a name that finds more people than this, this many are listed and the rest are counted
// what was typed, a word at a time, folded the way names and plates are folded for matching
const wordsOf = term => term.split(/\s+/).map(w => foldArabic(w)).filter(Boolean);
function findPeople(term){
  const d = digitsOnly(term), f = foldArabic(term), numeric = /^[\d\s-]+$/.test(term);
  const hits = [], seenG = new Set(), seenE = new Set();
  // a man who is in both sheets is one row, not two
  const addG = g => {
    if(seenG.has(g.key)) return;
    seenG.add(g.key);
    (g.emp || []).forEach(e => seenE.add(e.emp_code));
    hits.push({ g, emps: g.emp || [] });
  };
  const addE = e => {
    if(seenE.has(e.emp_code)) return;
    if(e.per) return addG(e.per);
    seenE.add(e.emp_code);
    hits.push({ g: null, emps: [e] });
  };
  if(numeric){
    if(d.length === 14){
      const g = M.ind && M.ind.byNid.get(d);
      if(g) addG(g);
      ((M.emp && M.emp.byNid.get(d)) || []).forEach(addE);
    }else{
      const byCode = M.emp && M.emp.byCode.get(d);
      if(byCode) addE(byCode);
      if(d.length >= 5){
        if(M.ind) M.ind.list.forEach(g => { if(g.nid && g.nid.includes(d)) addG(g); });
        if(M.emp) M.emp.list.forEach(e => { if(e.nid && e.nid.includes(d)) addE(e); });
      }
    }
  }else if(f){
    /* A NAME TYPED IN PART finds everyone it is part of. Every word typed has
       to be in the name, in any order and with anything between them — so
       «ابراهيم سالم» finds «ابراهيم احمد محمد سالم». All of them are shown,
       the closest first: the name that is exactly what was typed, then the
       names that hold it as it was typed, then the names that hold its words.
       ANY NAME WILL DO, even a single one. A name as common as «محمد» finds
       hundreds: of those only the first NAME_SHOW are listed (asked for so,
       3 October 2026) — the closest first, as above — and the line ends by
       saying how many more there are, so another name can be added to it. */
    const words = wordsOf(term), hasAll = s => words.every(w => s.includes(w));
    const en = e => e.full_name_en.toLowerCase().replace(/\s+/g, "");
    const rankG = g => {
      let best = 9;
      for(const n of g.names.keys()){ const r = n === f ? 0 : n.includes(f) ? 1 : hasAll(n) ? 2 : 9; if(r < best) best = r; }
      return best;
    };
    const rankE = e => {
      const a = foldArabic(e.full_name), b = en(e);
      return a === f || b === f || foldArabic(e.national_id) === f ? 0 : a.includes(f) || b.includes(f) ? 1 : hasAll(a) || hasAll(b) ? 2 : 9;
    };
    const found = [];
    if(M.ind) M.ind.list.forEach(g => { const r = rankG(g); if(r < 9) found.push({ r, name: g.name, add: () => addG(g) }); });
    if(M.emp) M.emp.list.forEach(e => { const r = rankE(e); if(r < 9) found.push({ r, name: e.full_name, add: () => addE(e) }); });
    found.sort((a, b) => a.r - b.r || sortText(a.name).localeCompare(sortText(b.name), "ar"));
    found.forEach(x => x.add());
    if(hits.length > NAME_SHOW) return { list: hits.slice(0, NAME_SHOW), more: hits.length - NAME_SHOW, names: true };
  }
  return capped(hits);
}
function findVehicles(term){
  if(!M.veh) return capped([]);
  const f = foldArabic(term), d = digitsOnly(term), numeric = /^[\d\s-]+$/.test(term);
  if(numeric){
    /* THE NUMBER ALONE, without the letters, finds every plate that has that
       number in it, whatever its letters. All of them are shown: the plate
       numbered exactly so first, then the plates whose number begins with
       it, then the rest. */
    if(!d) return capped([]);
    const rank = g => { const x = g.key.replace(/\D/g, ""); return x === d ? 0 : x.startsWith(d) ? 1 : 2; };
    return capped(M.veh.list.filter(g => g.key.includes(d)).map(g => ({ g, r: rank(g) }))
      .sort((a, b) => a.r - b.r || a.g.key.localeCompare(b.g.key, "ar")).map(x => ({ g: x.g })));
  }
  const exact = M.veh.groups.get(f);
  if(exact) return capped([{ g: exact }]);
  // letters, or letters and numbers, typed in part: every piece typed has to be in the plate
  const words = wordsOf(term);
  return capped(M.veh.list.filter(g => g.key.includes(f) || words.every(w => g.key.includes(w))).map(g => ({ g })));
}
function runMulti(){
  const m = st.multi, parsed = parseTerms(m.text), rows = [];
  let found = 0;
  parsed.terms.forEach((term, i) => {
    const hits = m.mode === "veh" ? findVehicles(term) : findPeople(term);
    if(!hits.list.length){ rows.push({ n: i + 1, term, miss: true }); return; }
    found++;
    hits.list.forEach(h => rows.push(Object.assign({ n: i + 1, term }, h)));
    if(hits.more) rows.push({ n: i + 1, term, more: hits.more, names: !!hits.names });
  });
  m.res = { rows, mode: m.mode, terms: parsed.terms.length, dup: parsed.dup, found, miss: parsed.terms.length - found };
}

function paintMulti(keep){
  const res = st.multi.res, box = $("mres");
  if(!box) return;
  if(!res || !res.terms){ box.innerHTML = ""; return; }      // nothing asked, nothing shown
  const at = keep ? rowsAt(box) : 0;
  const cols = MULTI_COLS[res.mode];
  const cats = {};
  res.rows.forEach(r => { if(r.g) cats[r.g.p.cat] = (cats[r.g.p.cat] || 0) + 1; });
  const sum = '<div class="sum">' +
    '<span class="pill white">' + t("sumAsked") + " " + num(res.terms) + "</span>" +
    '<span class="pill ok">' + t("sumFound") + " " + num(res.found) + "</span>" +
    (res.miss ? '<span class="pill bad">' + t("sumMiss") + " " + num(res.miss) + "</span>" : "") +
    (res.dup ? '<span class="pill">' + t("sumDup") + " " + num(res.dup) + "</span>" : "") +
    Object.keys(CAT_PILL).filter(k => cats[k]).map(k => '<span class="pill ' + CAT_PILL[k] + '">' + t(CAT_TILE[k][0]) + " " + num(cats[k]) + "</span>").join("") +
    "</div>";
  /* An answer is only as whole as the sheets behind it. With the permits not
     loaded, a man who is banned comes back "not found" (or as an employee and
     nothing more) — so the answers say which sheet they are without. */
  const lacking = res.mode === "veh" ? (M.veh ? [] : ["per"]) : [M.ind ? "" : "per", M.emp ? "" : "emp"].filter(Boolean);
  box.innerHTML =
    (lacking.length ? '<div class="note warn">' + esc(t("searchLacks", lacking.map(sheetName).join(t("and")))) + "</div>" : "") +
    '<section class="panel"><div class="panel-h">' + sum +
      '<div class="noprint" style="display:flex;gap:8px"><button class="btn sm" data-act="multi-csv">' + t("exportExcel") + '</button><button class="btn sm" data-act="print">' + t("print") + "</button></div></div>" +
    '<div class="tblwrap"><table class="tbl"><thead><tr><th class="nos">#</th>' +
      cols.map(c => '<th class="nos">' + t(c.tk) + "</th>").join("") + "</tr></thead><tbody>" +
    res.rows.map(r => {
      const lead = '<td class="ix">' + r.n + "</td>", term = '<span class="term">' + esc(r.term) + "</span>";
      if(r.miss) return '<tr class="miss">' + lead + '<td colspan="' + cols.length + '">' + term + pill("bad", t("missRow")) + "</td></tr>";
      if(r.more) return '<tr class="more">' + lead + '<td colspan="' + cols.length + '">' + esc(t(r.names ? "moreNames" : "moreRow", r.term, r.more)) + "</td></tr>";
      /* What was typed is only repeated when it is not already sitting in the
         row: a line that was a national id shows that id two cells along. */
      const key = res.mode === "veh" ? r.g.key : (r.g ? r.g.nid : r.emps[0].nid);
      const typed = (res.mode === "veh" ? foldArabic(r.term) : r.term) !== key
        ? '<span class="typed">' + t("typed") + esc(r.term) + "</span>" : "";
      return '<tr data-open="' + esc(multiOpen(r)) + '">' + lead +
        cols.map((c, i) => '<td class="' + (c.cls || "") + '">' + c.h(r) + (i === 0 ? typed : "") + "</td>").join("") + "</tr>";
    }).join("") + "</tbody></table></div></section>";
  rowsTo(box, at);
}

async function exportMulti(){
  const res = st.multi.res;
  if(!res || !res.rows.length) return;
  const cols = MULTI_COLS[res.mode], rows = [], red = [], at = tk => cols.findIndex(c => c.tk === tk);
  res.rows.forEach(r => {
    if(r.more) return;
    // red when the permit found is a ban, or when the employee behind the line is a banned one
    red.push(!r.miss && (permitBan(r.g) || (r.emps || []).some(empBan)));
    if(!r.miss) return rows.push([r.n].concat(cols.map(c => xcell(c, r))));
    // nobody found: the line still takes its place, with what was typed where it would have been — a number
    // under the national id, anything else under the name (a plate under the plate) — and the reason in red
    const line = cols.map(() => "");
    line[res.mode === "veh" ? at("colPlate") : /^\d+$/.test(digitsOnly(r.term)) && digitsOnly(r.term) === r.term.replace(/\s+/g, "") ? at("colNid") : at("colName")] = r.term;
    line[at("colPermit")] = { v: t("csvMiss"), tone: "bad" };
    rows.push([r.n].concat(line));
  });
  await saveXLSX({
    name: t("csvSearch"), rtl: !isEN(),
    header: [t("colSerial")].concat(cols.map(c => t(c.tk))),
    text: cols.map((c, i) => c.nid || c.tk === "colPlate" ? i + 1 : -1).filter(i => i >= 0),      // ids, letter numbers and plates stay exactly as written
    rows, red
  }, t("csvSearch"));
  toast(t("exportedLines", res.terms));
}

function renderChecks(){
  const groups = new Map();
  M.checks.forEach(c => { if(!groups.has(c.scope)) groups.set(c.scope, []); groups.get(c.scope).push(c); });
  let h = "";
  groups.forEach((list, scope) => {
    h += '<div class="sect-h">' + esc(isEN() ? (SCOPE_EN[scope] || scope) : scope) + "</div>";
    list.forEach(c => {
      const n = c.rows.length;
      // what the check means is one hover away rather than a line under every title
      h += '<details class="chk ' + (n ? c.sev : "clean") + '" data-chk="' + c.id + '"><summary title="' + esc(chk(c, 1)) + '">' +
        '<span class="cn">' + (n || "✓") + "</span><span>" + esc(chk(c, 0)) + "</span>" +
        (c.sev === "info" && n ? '<span class="tag">' + t("infoOnly") + "</span>" : "") + "</summary><div data-body></div></details>";
    });

function fillCheck(el){
  const body = el.querySelector("[data-body]");
  if(body.dataset.done) return;
  body.dataset.done = "1";
  const c = M.checks.find(x => x.id === el.dataset.chk);
  if(!c || !c.rows.length){ body.innerHTML = '<div class="empty" style="padding:22px"><h3>' + t("clean") + "</h3></div>"; return; }
  const cut = c.rows.slice(0, 400);
  const cell = v => { const s = String(v); return /^\d[\d\/]*$/.test(s) ? num(s) : esc(isEN() && CELL_EN[s] ? CELL_EN[s] : s); };
  body.innerHTML = (c.rows.length > 400 ? '<div class="note" style="margin:10px">' + t("first400", c.rows.length) + "</div>" : "") +
    '<div class="tblwrap"><table class="tbl"><thead><tr>' + chk(c, 2).map(x => '<th class="nos">' + esc(x) + "</th>").join("") + "</tr></thead><tbody>" +
    cut.map(r => "<tr" + (r.open ? ' data-open="' + esc(r.open) + '"' : ' style="cursor:default"') + ">" +
      r.cells.map(v => "<td>" + cell(v) + "</td>").join("") + "</tr>").join("") +

});
$("back").addEventListener("click", goBack);
// the keys and the mouse button that mean "back" everywhere else mean it here too
window.addEventListener("keydown", e => { if(e.altKey && e.key === "ArrowLeft"){ e.preventDefault(); goBack(); } });
window.addEventListener("mouseup", e => { if(e.button === 3){ e.preventDefault(); goBack(); } });
/* Same switch as the app's: the choice is remembered on this PC, and whatever
   is on screen is redrawn in the other language where it stands — the list
   typed into the search box, its answers and the open page all stay. */
$("lang").addEventListener("click", () => {
  lang = isEN() ? "ar" : "en";
  try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
  if($("mt")) st.multi.text = $("mt").value;
  closeDrawer();
  applyLang(); paintShell(); render();
});
$("pick").addEventListener("change", e => {
  const items = [].map.call(e.target.files, f => ({ file: f, handle: null }));
  e.target.value = "";
  if(!ONLINE) takeFiles(items);
});
/* The gate's own wiring. The real field is the hidden one: tapping the row of
   boxes focuses it, which keeps one keyboard in charge instead of several
   little fields fighting over it — the app's arrangement. */
$("gate-user").addEventListener("click", () => openUsers($("gate-list").hidden));
$("gate-list").addEventListener("click", e => { const b = e.target.closest("[data-user]"); if(b) pickUser(+b.dataset.user); });
$("gate").addEventListener("click", e => { if(!e.target.closest("#upick")) openUsers(false); });
$("upick").addEventListener("keydown", e => {
  const open = !$("gate-list").hidden, opts = $("gate-list").children;
  if(e.key === "Escape" && open){ e.stopPropagation(); openUsers(false); $("gate-user").focus(); }
  else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if(!open) return openUsers(true);
    const at = [].indexOf.call(opts, document.activeElement), step = e.key === "ArrowDown" ? 1 : -1;
    opts[(at + step + opts.length) % opts.length].focus();
  }
});
// no user picked yet: the boxes send the hand back to the user box instead of taking digits for nobody
const toPin = () => { if(gateUser()) $("pin").focus(); else openUsers(true); };
$("pinboxes").addEventListener("click", e => { e.stopPropagation(); toPin(); });
$("pinboxes").addEventListener("keydown", e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); toPin(); } });
$("pin").addEventListener("input", () => {
  const pin = $("pin");
  if(!gateUser()){ pin.value = ""; paintBoxes(); return openUsers(true); }
  // anything that is not a digit never reaches a box; Arabic-Indic digits are digits
  pin.value = NCM.toLatinDigits(pin.value).replace(/\D/g, "").slice(0, PIN_LEN);
  if(!gateBusy) $("gate-err").textContent = "";
  paintBoxes();
  if(pin.value.length === PIN_LEN) submitPin();      // the last digit opens it
});
$("pin").addEventListener("focus", () => $("pinboxes").classList.add("focus"));
$("pin").addEventListener("blur", () => $("pinboxes").classList.remove("focus"));
$("pin").addEventListener("keydown", e => { if(e.key === "Enter") submitPin(); });
$("logout").addEventListener("click", () => signOut());
["pointerdown", "keydown", "wheel"].forEach(name => window.addEventListener(name, touched, { passive: true, capture: true }));

document.addEventListener("click", e => {
  const tg = e.target;
  const opener = tg.closest("[data-open]");
  if(opener && opener.dataset.open){ openDrawer(opener.dataset.open); return; }
  if(tg.closest("#veil") || tg.closest("#dr-x")) return closeDrawer();
  if(tg.closest("#zoom")) return $("zoom").classList.remove("on");
  if(tg.matches("img[data-shot]")){ $("zoom-img").src = tg.src; $("zoom").classList.add("on"); return; }

  // the history closes on a click anywhere outside it
  if($("hist") && !$("hist").hidden && !tg.closest("#hist") && !tg.closest("[data-act=hist]")) histToggle(false);
  const histRow = tg.closest("[data-hist]");
  if(histRow) return histPick(+histRow.dataset.hist);
  const act = tg.closest("[data-act]");
  if(act){
    const a = act.dataset.act;
    if(a === "pick") return pick();
    if(a === "refresh") return refresh();
    if(a === "csv") return exportList(st.view);
    if(a === "print") return window.print();
    if(a === "multi-go") return goMulti();
    if(a === "multi-csv") return exportMulti();
    if(a === "multi-clear"){ st.multi.text = ""; st.multi.res = null; return renderMulti(); }
    if(a === "hist") return histToggle();
    if(a === "hist-clear"){ HIST = []; histSave(); return histToggle(false); }
    if(a === "wipe"){
      if(!confirm(t("wipeConfirm"))) return;
      DATA.emp = DATA.per = null; HANDLES.emp = HANDLES.per = null;
      Promise.all(["emp", "per", "h_emp", "h_per"].map(k => idb.set(k, null))).then(() => { rebuild(); toast(t("wiped")); });
      return;
    }
  }
  const snd = tg.closest("[data-snd]");
  if(snd) return exportSender(snd.dataset.snd);
  const sndKind = tg.closest("[data-snd-kind]");
  if(sndKind){ st.snd.kind = sndKind.dataset.sndKind === "emp" ? "emp" : "per"; st.snd.q = ""; st.snd.open = null; return renderSenders(); }
  const sndTab = tg.closest("[data-snd-tab]");
  if(sndTab){ sndState().tab = sndTab.dataset.sndTab; return render(); }
  const sndOpen = tg.closest("[data-snd-open]");
  if(sndOpen){ leave(); const s = sndState(); s.open = sndOpen.dataset.sndOpen; s.tab = ""; return render(); }
  const goTo = tg.closest("[data-go]");
  if(goTo){
    const parts = goTo.dataset.go.split(":");
    leave();
    Object.assign(st[parts[0]], { status: parts[1], q: "", dept: "", collar: "", company: "", mail: "" });
    return go(parts[0]);
  }
  const chart = tg.closest("[data-chart]");
  if(chart){
    st.chart = chart.dataset.chart;
    [].forEach.call(chart.parentNode.children, b => b.classList.toggle("on", b === chart));
    $("months").innerHTML = monthsHTML();
    return;
  }
  const mmode = tg.closest("[data-mmode]");
  if(mmode){
    if($("mt")) st.multi.text = $("mt").value;      // the list is kept; only what it is looked up in changes
    st.multi.mode = mmode.dataset.mmode; st.multi.res = null;
    return renderMulti();
  }
  if(!LISTS[st.view]) return;
  const view = st.view, f = st[view];
  const chip = tg.closest("[data-chip]");
  if(chip){ f.status = chip.dataset.chip; return paintTable(view); }
  const th = tg.closest("th[data-sort]");
  if(th){
    f.sort = { k: th.dataset.sort, d: f.sort.k === th.dataset.sort ? -f.sort.d : 1 };
    return paintTable(view);
  }
});
let lqTimer = null;
out.addEventListener("input", e => {
  if(e.target.id === "mt"){ st.multi.text = e.target.value; return multiLines(); }
  if(e.target.id === "sq"){
    clearTimeout(lqTimer);
    lqTimer = setTimeout(() => { sndState().q = e.target.value; (st.view === "rnw" ? paintRenew : paintSenders)(); }, 160);
    return;
  }
  if(e.target.id !== "lq") return;
  const view = st.view;
  clearTimeout(lqTimer);
  lqTimer = setTimeout(() => { st[view].q = e.target.value; paintTable(view); }, 160);
});
out.addEventListener("change", e => {
  const sel = e.target.closest("[data-sel]");
  if(!sel) return;
  st[st.view][sel.dataset.sel] = sel.value; paintTable(st.view);
});
out.addEventListener("toggle", e => { if(e.target.matches && e.target.matches("details.chk") && e.target.open) fillCheck(e.target); }, true);
// Enter is a new line in the list, as in any text box; Ctrl+Enter runs it
out.addEventListener("keydown", e => {
  if(e.target.id === "mt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); goMulti(); }
});
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if($("hist") && !$("hist").hidden) return histToggle(false);
  if($("zoom").classList.contains("on")) return $("zoom").classList.remove("on");
  closeDrawer();
});
// a card with no photo on disk says so instead of showing a broken picture
document.addEventListener("error", e => {
  const img = e.target;
  if(img && img.matches && img.matches("img[data-shot]")) img.parentNode.innerHTML = '<div class="noshot">' + t("noPhoto") + "</div>";
}, true);

/* drop anywhere */
let dragDepth = 0;
const hasFiles = e => !ONLINE && e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], "Files") !== -1;
window.addEventListener("dragenter", e => { if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("dropveil").classList.add("on"); });
window.addEventListener("dragover", e => { if(hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", e => { if(!hasFiles(e)) return; if(--dragDepth <= 0){ dragDepth = 0; $("dropveil").classList.remove("on"); } });
window.addEventListener("drop", async e => {
  if(!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $("dropveil").classList.remove("on");
  // the handles have to be asked for before the first await, while the drop is still live
  const pending = [].map.call(e.dataTransfer.items || [], it => {
    if(it.kind !== "file") return null;
    const file = it.getAsFile();
    const hp = it.getAsFileSystemHandle ? it.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null);
    return { file, hp };
  }).filter(Boolean);
  const items = [];
  for(const p of pending){
    if(!p.file || !/\.xlsx$/i.test(p.file.name)) continue;
    const h = await p.hp;
    items.push({ file: p.file, handle: h && h.kind === "file" ? h : null });
  }
  if(!items.length) return toast(t("needXlsx"), true);
  takeFiles(items);
});

/* tooltip for chart marks */
const tip = $("tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if(!el){ tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, e.clientX - w / 2)) + "px";
  tip.style.top = Math.max(8, e.clientY - 42) + "px";
});

/* ---------- boot ----------
   What was read last time is on screen straight away; then the sheets on disk
   are asked whether they have been saved since, and from there on every few
   seconds, and again the moment this window is looked at — which is exactly
   when someone has just come back from saving in Excel. */
setInterval(() => { if(!document.hidden) newDay(); }, 60000);
window.addEventListener("focus", newDay);
document.addEventListener("visibilitychange", () => { if(!document.hidden) newDay(); });
if(ONLINE){
  /* Online: nothing is drawn and nothing is fetched until someone has signed
     in. A browser that signed in before is let straight through — the key it
     kept is tried against the database on the first read, and a key that is
     no longer accepted lands back at the gate. Nothing read online is saved
     on the device: every opening reads afresh. */
  applyLang(); paintShell();
  try{
    try{ localStorage.removeItem(SESSION_KEY); localStorage.removeItem(LAST_USER_KEY); }catch(x){}   // earlier builds kept these here; they no longer may
    const kept = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
    if(kept && kept.v === SESSION_V && kept.k && USERS.some(u => u.name === kept.u)){
      if(Date.now() - (+kept.seen || 0) > IDLE_MS) sessionStorage.removeItem(SESSION_KEY);
      else{ session = kept; lastTouch = +kept.seen; }
    }
  }catch(e){}
  takePlace(!!session);
  if(session) startOnline(); else showGate();
  /* A NEWER COPY. When the system is published anew, an open window takes the
     new copy by itself — nobody has to know to press Ctrl+F5. The published
     folder carries a small file with the stamp of what is published; it is
     asked for every minute and a half and whenever the window is looked at.
     A different stamp, seen twice running, and the page is loaded again from
     an address the browser has not cached, coming back signed in and where it
     was. It is done once per stamp: if what comes back is still the old copy
     (a server slow to catch up) the window waits rather than going round. */
  let newer = "";
  const watchBuild = async () => {
    try{
      const r = await fetch("version.json?_=" + Date.now(), { cache: "no-store" });
      if(!r.ok) return;
      const b = String((await r.json()).build || "");
      if(!/^[0-9a-f]{8,40}$/.test(b) || b === BUILD) return;
      if(sessionStorage.getItem(BUILT_KEY) === b) return;
      if(b !== newer){ newer = b; return; }
      // not in the middle of something: a card open, a PIN half typed, a sign-in being checked
      if($("drawer").classList.contains("on") || gateBusy || $("pin").value) return;
      sessionStorage.setItem(BUILT_KEY, b);
      if(session){ idleTick(); keepPlace(); }
      location.replace(location.pathname + "?v=" + b);
    }catch(e){}
  };
  setInterval(() => { if(!document.hidden) watchBuild(); }, 90000);
  window.addEventListener("focus", watchBuild);
  watchBuild();
  // coming back to the window — or the PC waking up — is the moment to ask whether it was left too long
  const back = () => { if(idleTooLong()) signOut(t("idleOut")); else if(session && Date.now() - lastCloud > 30000) cloudSync(); };
  window.addEventListener("focus", back);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) back(); });
  setInterval(idleTick, 20000);
}else (async () => {
  takePlace(true);          // a window that reloaded itself to take a newer copy of the system comes back where it was
  histLoad();
  applyLang(); paintShell(); render();
  const [emp, per, hEmp, hPer] = await Promise.all([idb.get("emp"), idb.get("per"), idb.get("h_emp"), idb.get("h_per")]);
  if(emp && emp.sheets) DATA.emp = emp;
  if(per && per.sheets) DATA.per = per;
  // only a copy that came off the disk by itself carries a save time worth trusting
  seen.emp = (emp && emp.stamp && emp.path === SOURCES.emp) ? emp.stamp : "";
  seen.per = (per && per.stamp && per.path === SOURCES.per) ? per.stamp : "";
  HANDLES.emp = hEmp || null; HANDLES.per = hPer || null;
  if(DATA.emp || DATA.per) rebuild(); else paintShell();
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if(!LIVE) return;
  if(!DATA.emp && !DATA.per) busy(true, t("readingSheets"));
  await sync();
  busy(false);
  if(live === false) render();
  if(!live) return;                                   // the browser will not let us; the sheets page takes over
  setInterval(() => { if(!document.hidden) sync(); }, WATCH_MS);
  window.addEventListener("focus", () => sync());
  document.addEventListener("visibilitychange", () => { if(!document.hidden) sync(); });
  /* The page watches ITSELF the way it watches the sheets. When this file is
     saved anew — the system was changed — an open window takes the new one by
     itself instead of going on showing the old until someone thinks to close
     it. The new save time has to be seen twice running, so a file caught
     half-written is never loaded; and the page it was on, and what was typed
     into the search, come back after the reload. */
  let selfStamp = null, selfNew = null;
  const watchSelf = () => {
    const x = new XMLHttpRequest();
    x.open("GET", location.href.split(/[?#]/)[0]);
    x.setRequestHeader("Range", "bytes=0-0");
    x.onload = () => {
      const s = x.getResponseHeader("Last-Modified");
      if(!s) return;
      if(selfStamp === null){ selfStamp = s; return; }
      if(s === selfStamp){ selfNew = null; return; }
      if(s !== selfNew){ selfNew = s; return; }
      keepPlace();
      location.reload();
    };
    x.onerror = () => {};
    try{ x.send(); }catch(e){}
  };
  watchSelf();
  setInterval(() => { if(!document.hidden) watchSelf(); }, WATCH_MS);
  window.addEventListener("focus", watchSelf);
})();
})();
</script>
