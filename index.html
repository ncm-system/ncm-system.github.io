<style>
/* ============================================================
   NCM SYSTEM — the desk-side companion to the NCM PERMISSION app.
   Same design tokens as the app, so the two read as one product.
   This page only READS the two workbooks. It never writes to a
   sheet, to Supabase, to Google, or to the app.
   ============================================================ */
:root{
  --bg:#edf2f8;
  --panel:#ffffff;
  --panel-2:#f3f7fb;
  --tint:#e6eef8;
  --blue:#1565c0;
  --blue-soft:#1e75d6;
  --blue-deep:#0e4c93;
  --green:#4ba548;
  --navy:#1f4e79;
  --grey:#4a5a6b;
  --ok:#12874f;    --ok-bg:#dff3e7;    --ok-br:#8fd3ae;
  --warn:#b96e08;  --warn-bg:#fcebd5;  --warn-br:#efc383;
  --bad:#c22f2f;   --bad-bg:#fbe3e3;   --bad-br:#efa9a9;
  --ban:#a31515;
  --mute:#4a5a6b;  --mute-bg:#edf0f3;  --mute-br:#cbd3db;
  --text:#0b1114;
  --text-2:#2a3238;
  --muted:#3b4a5c;
  --line:#e2e9f2;
  --line-2:#c0d3ec;
  --card:rgba(182,213,247,.42);
  --card-line:#c9d9ea;
  --r-sm:10px;
  --r:14px;
  --r-lg:18px;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;
  --side:262px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{
  background-color:var(--bg);
  /* the same three washes the app carries — the glass needs them to show */
  background-image:
    radial-gradient(900px 460px at 50% -10%, rgba(21,101,192,.09) 0%, transparent 62%),
    radial-gradient(680px 420px at 12% 42%, rgba(75,165,72,.06) 0%, transparent 64%),
    radial-gradient(760px 520px at 92% 88%, rgba(21,101,192,.07) 0%, transparent 66%);
  background-repeat:no-repeat;background-attachment:fixed;
}
body{
  background:transparent;color:var(--text);font-family:var(--sans);font-weight:500;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  font-feature-settings:"locl" 0;font-variant-numeric:lining-nums;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;}
button,input,select{font-family:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}

/* ---------- shell ---------- */
/* THE WINDOW DOES NOT SCROLL. Each page is a head that stays where it is —
   the mark, the title, the page's own buttons and filters, the table's column
   names — and under it ONE part that moves, with a bar of its own beside it to
   drag. The menu and the signature never move either. */
html,body{height:100%;overflow:hidden;}
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh;}
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:26px 14px 16px;overflow-y:auto;
  background:rgba(255,255,255,.58);border-inline-end:1px solid var(--line-2);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1;}
.ncm{
  font-family:var(--sans),'Arial Black',system-ui;font-weight:900;font-size:34px;line-height:1;
  color:var(--blue);direction:ltr;unicode-bidi:isolate;
}
.ncm i{font-style:normal;color:var(--green);}
.ncm b{font-weight:inherit;color:var(--grey);}
.tagline{font-size:9.5px;letter-spacing:.17em;text-indent:.17em;color:var(--navy);margin-top:10px;direction:ltr;unicode-bidi:isolate;white-space:nowrap;}
.brand .hr{display:block;width:46px;height:1px;margin:11px auto 9px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);}
.appname{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.13em;text-indent:.13em;line-height:1;color:var(--blue);}

.nav{display:flex;flex-direction:column;gap:5px;margin-top:26px;}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;
  border-radius:var(--r);border:1px solid transparent;background:none;
  color:var(--text-2);font-size:14.5px;font-weight:800;text-align:start;white-space:nowrap;
  transition:background .14s,color .14s,box-shadow .18s;
}
.nav button svg{flex:none;opacity:.85;}
.nav button:hover{background:var(--tint);}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(21,101,192,.28);}
.nav .nb{
  margin-inline-start:auto;font-family:var(--mono);font-size:12px;font-weight:700;
  padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--blue);
}
.nav .nb.alert{background:var(--bad-bg);color:var(--bad);}
.nav button.on .nb{background:rgba(255,255,255,.22);color:#fff;}
.nav .sep{height:1px;background:var(--line-2);opacity:.7;margin:8px 6px;}

/* ---------- language switch — the app's own button ---------- */
.side-lang{display:flex;justify-content:center;margin-top:18px;}
.langbtn{
  display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--tint);color:var(--blue);
  transition:background .16s,transform .12s;
}
.langbtn:hover{background:#d9e6f7;}
.langbtn:active{transform:scale(.94);}
.langbtn svg{flex:none;}
.langbtn span{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.1em;line-height:1;}
.side-foot{margin-top:auto;padding-top:18px;}
.side-user{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;padding:7px 8px 7px 12px;
  border-radius:var(--r);background:var(--tint);border:1px solid var(--line-2);
  font-family:var(--cond);font-weight:700;font-size:13.5px;letter-spacing:.1em;color:var(--blue);direction:ltr;
}
.side-user[hidden]{display:none;}
.side-user .fab{width:30px;height:30px;background:#fff;}

/* ---------- gate: sign-in for the online edition ---------- */
#gate{
  position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(560px 380px at 50% 30%, rgba(21,101,192,.07) 0%, transparent 70%), var(--bg);
}
#gate[hidden]{display:none;}
.gate-card{
  width:100%;max-width:470px;display:flex;flex-direction:column;align-items:stretch;gap:16px;text-align:center;
  border:1px solid var(--line);border-radius:26px;background:var(--panel);padding:44px 38px 32px;
  box-shadow:0 12px 34px rgba(21,101,192,.12);
}
.gate-card .cbrand{padding-top:0;margin-bottom:14px;}
.gate-card .cbrand .ncm{font-size:52px;}
.gate-card .cbrand .tagline{font-size:12.5px;margin-top:12px;}
.gate-card .cbrand .hr{width:58px;margin:14px auto 12px;}
.gate-card .cbrand .appname{font-size:25px;}
.gate-card .upick-btn{min-height:68px;border-radius:18px;}
.gate-card .uav{width:46px;height:46px;font-size:18px;}
.gate-card .uname{font-size:19px;}
.gate-card .uname.ph{font-size:17.5px;}
.gate-card .uopt .uav{width:40px;height:40px;font-size:16px;}
.gate-card .uopt .uname{font-size:18px;}
.gate-card .uopt{padding:9px 36px;}
.gate-card .credit{padding-top:14px;}
@media (max-width:520px){
  .gate-card{padding:32px 20px 24px;border-radius:22px;}
  .gate-card .cbrand .ncm{font-size:42px;}
}
/* The user box: the chosen user on its face, the others in a small list that
   opens over the PIN boxes — so opening it moves nothing. Always LTR: the
   names are Latin, and the box must look the same in both languages. */
.upick{position:relative;}
.upick-btn{
  position:relative;width:100%;min-height:58px;display:flex;align-items:center;justify-content:center;gap:11px;padding:8px 38px;direction:ltr;cursor:pointer;
  border:1.5px solid var(--line-2);border-radius:16px;background:var(--panel-2);font:inherit;
  transition:border-color .16s,background .16s,box-shadow .16s;
}
.upick-btn:hover{border-color:var(--blue);background:var(--panel);}
.upick.open .upick-btn,.upick-btn:focus-visible{border-color:var(--blue);background:var(--panel);box-shadow:0 0 0 3px rgba(21,101,192,.13);outline:none;}
.uav{
  flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.05em;color:#fff;
  background:linear-gradient(135deg,var(--blue-soft),var(--blue-deep));box-shadow:0 2px 6px rgba(14,76,147,.25);
}
.uav.g{background:linear-gradient(135deg,#5cba59,#3b8d39);box-shadow:0 2px 6px rgba(59,141,57,.25);}
.uav[hidden]{display:none;}
.uname{
  min-width:0;font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.12em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* nobody chosen yet: the box says what it is for. Arabic must not be letter-spaced — it breaks the joins. */
.uname.ph{font-family:inherit;font-size:15.5px;font-weight:800;letter-spacing:0;color:var(--blue);}
/* the arrow and the tick sit on the edge, out of the flow, so the name is centred on the box and not on what is left of it */
.uchev{position:absolute;right:13px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--blue);transition:transform .18s;}
.upick.open .uchev{transform:rotate(180deg);}
.upick-list{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;display:flex;flex-direction:column;gap:2px;padding:6px;
  border:1px solid var(--line-2);border-radius:16px;background:var(--panel);box-shadow:0 14px 32px rgba(14,76,147,.20);
  animation:upick-in .14s ease-out;
}
.upick-list[hidden]{display:none;}
@keyframes upick-in{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.uopt{
  position:relative;display:flex;align-items:center;justify-content:center;gap:11px;padding:7px 34px;border:0;border-radius:12px;background:none;
  direction:ltr;cursor:pointer;font:inherit;
}
.uopt .uav{width:34px;height:34px;font-size:14px;}
.uopt .uname{font-size:16px;}
.uopt:hover,.uopt:focus-visible{background:var(--tint);outline:none;}
.uopt.on .uname{color:var(--blue);}
.ucheck{position:absolute;right:10px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--blue);visibility:hidden;}
.uopt.on .ucheck{visibility:visible;}
#pin{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
/* One box per digit. Forced LTR: a number is written left to right in both
   languages, so the first digit typed has to land in the leftmost box. */
.pinboxes{display:flex;justify-content:center;gap:10px;cursor:text;direction:ltr;margin-top:12px;}
.pinboxes i{
  flex:0 1 56px;min-width:0;height:68px;border-radius:16px;font-style:normal;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line-2);background:var(--panel-2);
  font-family:var(--mono);font-size:25px;font-weight:700;color:var(--text);
  transition:border-color .16s,background .16s,box-shadow .16s;
}
.pinboxes i.on{border-color:var(--blue);background:var(--panel);}
.pinboxes.focus i.next{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.13);}
/* A PIN of seven or eight digits: the card a little wider and the boxes a little slimmer, so they stay on one line. */
.gate-card.long{max-width:540px;}
.pinboxes.many{gap:8px;}
.pinboxes.many i{flex-basis:50px;height:64px;border-radius:14px;font-size:23px;}
@media (max-width:520px){
  .pinboxes.many{gap:6px;}
  .pinboxes.many i{height:54px;border-radius:12px;font-size:21px;}
}
.gate-err{color:var(--bad);font-size:14.5px;min-height:22px;margin:8px 0 0;font-weight:800;}
.gate-err.busy{color:var(--muted);}
.gate-card .credit{padding:6px 0 0;}
.shake{animation:shake .36s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.src-mini{display:flex;flex-direction:column;gap:6px;}
.src-mini div{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mute-br);}
.dot.on{background:var(--ok);}
.dot.lost{background:var(--bad);}
/* margin-top:auto parks it at the foot of the column even when the page above
   it is short; on a long page it simply follows the content. */
.credit{flex:none;padding:10px 16px 12px;text-align:center;direction:ltr;line-height:1.55;}
.credit-by{display:block;font-size:9px;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;color:var(--green);opacity:.72;}
.credit-name{
  display:inline-block;margin-top:6px;padding:6px 14px;border-radius:999px;
  background:var(--tint);border:1px solid var(--line-2);
  font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.19em;text-indent:.19em;color:var(--blue);
}

.main{position:relative;min-width:0;height:100vh;display:flex;flex-direction:column;}
/* Back, between pages. It hangs in the corner of the page's fixed head, out of
   the flow and of a fixed width, so neither its coming alive nor a change of
   language moves anything. The arrow points the way "back" reads in a page
   laid out right-to-left — which this one is in both languages. */
.backbtn{
  position:absolute;top:16px;right:12px;z-index:3;width:92px;height:38px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0;
  border:1px solid var(--line-2);border-radius:999px;background:var(--panel);color:var(--blue);cursor:pointer;
  font:inherit;font-size:14px;font-weight:800;box-shadow:0 2px 8px rgba(21,101,192,.08);
  transition:background .16s,border-color .16s,opacity .16s;
}
.backbtn:hover:not(:disabled){background:var(--tint);border-color:var(--blue);}
.backbtn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(21,101,192,.18);}
.backbtn:disabled{opacity:.38;cursor:default;box-shadow:none;}
.backbtn svg{flex:none;}
.pg-fixed{flex:none;}
/* the one part of a page that moves */
.pg-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 6px 14px;margin-top:6px;}
.pg-scroll > .sect-h:first-child{margin-top:8px;}
/* a table page: the panel fills what is left, its rows move inside it and the
   column names stay at its top */
.pg-table{flex:1;min-height:0;display:flex;flex-direction:column;}
.pg-table > .panel{flex:1;min-height:0;display:flex;flex-direction:column;}
.pg-table > .panel > .panel-h{flex:none;}
.pg-table > .panel > .tblwrap{flex:1;min-height:0;overflow:auto;}
.pg-table > .panel > .empty{margin:auto;}
/* the bar itself: wide enough to take hold of, in the system's own blue */
.pg-scroll,.tblwrap,.dr-body,.multi-ta,.side{scrollbar-width:auto;scrollbar-color:#8fb3de var(--tint);}
.pg-scroll::-webkit-scrollbar,.tblwrap::-webkit-scrollbar,.dr-body::-webkit-scrollbar{width:14px;height:14px;}
.pg-scroll::-webkit-scrollbar-track,.tblwrap::-webkit-scrollbar-track,.dr-body::-webkit-scrollbar-track{background:var(--tint);border-radius:999px;}
.pg-scroll::-webkit-scrollbar-thumb,.tblwrap::-webkit-scrollbar-thumb,.dr-body::-webkit-scrollbar-thumb{
  background:#8fb3de;border-radius:999px;border:3px solid var(--tint);min-height:48px;
}
.pg-scroll::-webkit-scrollbar-thumb:hover,.tblwrap::-webkit-scrollbar-thumb:hover,.dr-body::-webkit-scrollbar-thumb:hover{background:var(--blue);}
.tblwrap::-webkit-scrollbar-corner{background:var(--tint);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--tint);color:var(--blue);font-size:14px;font-weight:800;white-space:nowrap;
  transition:background .16s,transform .12s,filter .16s;
}
.btn:hover{background:#d9e6f7;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(21,101,192,.24);}
.btn.primary:hover{background:var(--blue-soft);}
.btn.danger{background:var(--bad-bg);border-color:var(--bad-br);color:var(--bad);}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:var(--r-sm);}
@keyframes spin{to{transform:rotate(360deg);}}

/* Every page is one column in the middle of the window, under the mark. The
   column is centred in the space beside the menu, and so is everything that
   heads it — the title, its buttons, the filters. Only the tables keep their
   own reading order. */
/* Every page takes the whole width of the window: only a narrow gap is left
   between it and the sidebar, and the same on the far side. */
#out{--pad-x:12px;--pad-t:10px;
  flex:1;min-height:0;display:flex;flex-direction:column;       /* fills the window between its top and the signature */
  padding:var(--pad-t) var(--pad-x) 0;width:100%;}
.pg-head{display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 2px 6px;text-align:center;}
.pg-t{margin:0;font-size:25px;font-weight:900;color:var(--navy);line-height:1.3;}
.sect-h{
  display:flex;align-items:center;justify-content:center;gap:12px;margin:26px 0 10px;
  font-size:13.5px;font-weight:800;color:var(--navy);letter-spacing:.03em;
}
/* a hairline on each side, so the heading sits in the middle of its row */
.sect-h::before,.sect-h::after{content:'';flex:1;height:1px;background:var(--line-2);opacity:.7;}
.sect-h .lnk{border:none;background:none;color:var(--blue);font-size:13px;font-weight:800;padding:0;}
.sect-h .lnk:hover{text-decoration:underline;}

/* ---------- tiles (the app's glass) ---------- */
/* every row on the board is six figures: one line on a wide screen, two even
   lines of three on a narrower one — never four and a stray two */
.tiles{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:10px;}
@media (max-width:1240px){ .tiles{grid-template-columns:repeat(var(--half,3),minmax(0,1fr));} }
@media (max-width:520px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr));} }
.tile{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  padding:15px 14px;border-radius:var(--r);width:100%;font:inherit;color:inherit;
  background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 6px 16px rgba(31,78,121,.07);
  backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);
  transition:transform .12s,box-shadow .18s;
}
.tile:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 8px 20px rgba(21,101,192,.16);}
.tile:active{transform:scale(.98);}
.tile-k{font-size:13px;font-weight:800;color:var(--muted);}
.tile-v{font-size:26px;font-weight:700;color:var(--text);line-height:1;}
.tile.job{background:rgba(182,213,247,.4);}
.tile.job .tile-k{color:var(--navy);}
.tile.job .tile-v{color:var(--blue);}
.tile.ok{background:rgba(197,235,212,.6);border-color:rgba(143,211,174,.7);}
.tile.ok .tile-k,.tile.ok .tile-v{color:#0c6b3d;}
.tile.warn{background:rgba(249,206,110,.62);border-color:rgba(222,163,48,.62);}
.tile.warn .tile-k,.tile.warn .tile-v{color:#7a4703;}
.tile.bad{background:rgba(250,214,214,.62);border-color:rgba(237,160,160,.62);}
.tile.bad .tile-k,.tile.bad .tile-v{color:#a81f1f;}
.tile.ban{background:rgba(150,20,20,.72);border-color:rgba(110,12,12,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 6px 16px rgba(120,15,15,.22);}
.tile.ban .tile-k{color:rgba(255,255,255,.86);}
.tile.ban .tile-v{color:#fff;}
.tile.mute .tile-v{color:var(--text-2);}
.tile.pulse{animation:tilePulse 1.9s ease-in-out .35s infinite;}
.tile.warn.pulse{--pulse:rgba(214,150,26,.55);}
.tile.bad.pulse{--pulse:rgba(206,70,70,.45);}
@keyframes tilePulse{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 6px 16px rgba(31,78,121,.07), 0 0 0 0 var(--pulse);}
  55%    {box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 6px 16px rgba(31,78,121,.07), 0 0 0 6px var(--pulse);}
}

/* ---------- panels ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-top:14px;}
.panel{
  background:rgba(255,255,255,.72);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:0 6px 18px rgba(21,101,192,.08);overflow:hidden;
}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
.panel-t{margin:0;font-size:15.5px;font-weight:800;color:var(--navy);}
.panel-b{padding:16px 18px;}

/* horizontal bars: one hue, value at the end, hover names the row */
.bars{display:flex;flex-direction:column;gap:9px;}
.bar-row{display:grid;grid-template-columns:140px minmax(0,1fr) 46px;align-items:center;gap:10px;font-size:13.5px;font-weight:700;}
.bar-l{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{height:12px;border-radius:4px;background:var(--tint);overflow:hidden;}
.bar-fill{display:block;height:100%;border-radius:4px;background:var(--blue);min-width:3px;}
.bar-row:hover .bar-fill{background:var(--blue-deep);}
.bar-v{font-size:13.5px;font-weight:700;color:var(--text);text-align:end;}

/* monthly columns */
.cols{display:flex;align-items:flex-end;gap:2px;height:190px;padding-top:22px;border-bottom:1px solid var(--line-2);}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;cursor:default;}
.col-v{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:4px;}
.col-bar{width:62%;max-width:34px;border-radius:4px 4px 0 0;background:var(--blue);min-height:2px;}
.col:hover .col-bar{background:var(--blue-deep);}
.col.zero .col-bar{background:var(--line-2);}
.cols-x{display:flex;gap:2px;margin-top:7px;}
.cols-x span{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--panel-2);}
.seg button{border:none;background:none;padding:6px 14px;font-size:13px;font-weight:800;color:var(--muted);}
.seg button.on{background:var(--blue);color:#fff;}

/* ---------- pills ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;line-height:1.5;
  padding:3px 11px;border-radius:999px;white-space:nowrap;
  color:var(--mute);background:var(--mute-bg);border:1px solid var(--mute-br);
}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-br);}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-br);}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-br);}
.pill.ban{background:var(--ban);color:#fff;border-color:var(--ban);}
.pill.blue{background:var(--blue);color:#fff;border-color:var(--blue);}
.pill.white{background:#fff;color:var(--text);border-color:var(--line-2);}
.pill.link{background:var(--tint);color:var(--blue);border-color:var(--line-2);}

/* ---------- list toolbar + table ---------- */
.tbl td.wide{min-width:190px;max-width:330px;white-space:normal;line-height:1.55;}
.tbl.plain tbody tr{cursor:default;}
.tbl.plain tbody tr[data-snd-open]{cursor:pointer;}
.tbl.plain th{cursor:default;}
.toolbar{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px 0 10px;}
.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.7);color:var(--text-2);
  font-size:13.5px;font-weight:800;transition:background .14s;
}
.chip:hover{background:var(--tint);}
.chip b{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);}
.chip.on{background:#ffd24d;border-color:#e0a800;color:#0b1114;}
.chip.on b{color:#5c4500;}
.field{
  padding:9px 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel-2);
  color:var(--text);font-size:14px;font-weight:700;outline:none;
}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.10);}
input.field{min-width:210px;}
.count{font-size:13.5px;font-weight:800;color:var(--muted);}
.count b{font-family:var(--mono);color:var(--blue);}

.tblwrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;}
.tbl th{
  position:sticky;top:0;z-index:2;text-align:start;padding:11px 11px;white-space:nowrap;
  font-size:12.5px;font-weight:800;color:var(--navy);background:var(--tint);
  border-bottom:1px solid var(--line-2);cursor:pointer;user-select:none;
}
.tbl th.nos{cursor:default;}
.tbl th i{font-style:normal;font-size:10px;margin-inline-start:5px;color:var(--blue);opacity:0;}
.tbl th.asc i,.tbl th.desc i{opacity:1;}
.tbl td{padding:10px 11px;border-bottom:1px solid var(--line);font-weight:700;color:var(--text);vertical-align:middle;}
.tbl tbody tr{cursor:pointer;transition:background .1s;}
.tbl tbody tr:hover{background:rgba(21,101,192,.06);}
.tbl tbody tr:last-child td{border-bottom:none;}
/* a name squeezed to one word a line is unreadable: the table scrolls sideways
   before it lets that happen */
.tbl td.name{min-width:190px;}
.tbl.dense th,.tbl.dense td{padding-inline:6px;}
.tbl.dense td.name{min-width:170px;}
.tbl.dense td.mid{min-width:104px;}
.tbl.dense td.wide{min-width:132px;}
.tbl td.mid{min-width:130px;}
.tbl td small{display:block;font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;direction:ltr;text-align:end;}
.dim{color:var(--muted);font-weight:500;}        /* the dash that stands for "nothing here" */
.tbl td.nowrap{white-space:nowrap;}
.empty{text-align:center;padding:46px 20px;color:var(--muted);}
.empty h3{margin:0 0 6px;font-size:16px;font-weight:800;color:var(--text-2);}
.empty p{margin:0;font-size:14px;line-height:1.9;}

/* ---------- multi search: a list in, a row per line out ---------- */
/* The mark and the list box sit in the middle of the page, one above the
   other, and the two stay put while the answers scroll underneath them — the
   same arrangement the app's own search screens use. The table gets the full
   width below: it is the part that needs the room. */
.multi-head{display:flex;flex-direction:column;align-items:center;padding:12px 0 4px;}
/* the centred mark: one size, one place, on every page */
.cbrand{padding-top:8px;}
.cbrand .ncm{font-size:40px;}
.cbrand .tagline{font-size:10.5px;}
.cbrand .appname{font-size:20px;}
.multi-box{position:relative;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;}
/* the history: a small arrow in the bar, and a list that opens over the answers — so opening it moves nothing */
.hist-btn svg{transition:transform .18s;}
.hist-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.hist-btn.on svg{transform:rotate(180deg);}
.hist{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto;padding:6px;
  border:1px solid var(--line-2);border-radius:16px;background:var(--panel);box-shadow:0 14px 32px rgba(14,76,147,.20);
}
.hist[hidden]{display:none;}
.hist-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:11px;background:none;cursor:pointer;font:inherit;text-align:start;}
.hist-row:hover,.hist-row:focus-visible{background:var(--tint);outline:none;}
.hist-row .pill{flex:none;}
.hist-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--text);unicode-bidi:plaintext;}
.hist-t b{color:var(--blue);}
.hist-at{flex:none;font-size:12px;color:var(--muted);}
.hist-empty{padding:14px;text-align:center;color:var(--muted);font-weight:700;font-size:13.5px;}
.hist-clear{flex:none;margin-top:4px;padding:9px;border:0;border-top:1px solid var(--line);background:none;color:var(--bad);font:inherit;font-size:13px;font-weight:800;cursor:pointer;}
.hist-clear:hover{background:var(--bad-bg);}
/* --mono ends in the generic "monospace", which answers for Arabic before
   Tajawal ever gets asked — so the stack is spelled out here instead. */
.multi-ta{
  display:block;width:100%;min-height:150px;resize:vertical;padding:11px 15px;text-align:center;
  border-radius:var(--r-lg);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);
  font-family:'IBM Plex Mono','Tajawal','Segoe UI',Tahoma,sans-serif;
  font-size:16px;font-weight:600;line-height:1.9;outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.multi-ta:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.10);}
.multi-bar{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;}
/* Every piece of this row has a width of its own rather than its word's:
   «بحث» and "Search" are not the same length, and a row sized by its words
   would shuffle sideways each time the language is switched. */
.multi-bar .seg button{width:86px;padding-inline:0;}
.multi-bar .btn{width:96px;padding-inline:0;}
.multi-bar .btn.primary{width:190px;padding-block:12px;font-size:15.5px;}
.multi-n{margin:0;width:96px;font-size:13px;font-weight:700;color:var(--muted);}
.sum{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
#mres .tbl td.name{min-width:175px;}
#mres .tbl td.mid{min-width:96px;}
.tbl td.ix{width:1%;white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:13px;}
.term{font-family:'IBM Plex Mono','Tajawal','Segoe UI',Tahoma,sans-serif;font-size:14.5px;font-weight:700;color:var(--text);margin-inline-end:10px;}
.typed{display:block;margin-top:2px;font-size:12px;font-weight:500;color:var(--muted);}
.tbl tr.miss,.tbl tr.more{cursor:default;}
.tbl tr.miss td{background:rgba(251,227,227,.55);}
.tbl tr.banrow td{background:#f8c4c4;color:#8e0f0f;border-bottom-color:#e39a9a;}
.tbl tr.banrow:hover td{background:#f4b4b4;}
.tbl tr.miss:hover td{background:rgba(251,227,227,.55);}
.tbl tr.more td{background:var(--panel-2);color:var(--muted);font-size:13px;}

/* ---------- onboarding / drop ---------- */
.hero{max-width:720px;margin:6vh auto 0;text-align:center;}
.dropcard{
  margin-top:22px;padding:38px 28px;border-radius:22px;
  border:2px dashed var(--line-2);background:rgba(255,255,255,.6);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.dropcard h2{margin:14px 0 6px;font-size:21px;font-weight:900;color:var(--navy);}
.dropcard p{margin:0 0 20px;font-size:14.5px;line-height:1.9;color:var(--muted);}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;text-align:start;}
.slot{padding:13px 15px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel-2);}
.slot.on{border-color:var(--ok-br);background:var(--ok-bg);}
.slot b{display:block;font-size:14.5px;font-weight:800;color:var(--text);}
.slot span{display:block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--muted);direction:ltr;text-align:end;unicode-bidi:plaintext;}
.note{
  margin-top:14px;padding:11px 15px;border-radius:var(--r);font-size:13.5px;font-weight:700;line-height:1.9;
  background:var(--tint);border:1px solid var(--line-2);color:var(--text-2);text-align:center;
}
.note.warn{background:var(--warn-bg);border-color:var(--warn-br);color:#7a4703;}
#dropveil{
  position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;
  background:rgba(21,101,192,.16);backdrop-filter:blur(4px);
  font-size:26px;font-weight:900;color:var(--blue-deep);border:4px dashed var(--blue);
}
#dropveil.on{display:flex;}

/* ---------- checks ---------- */
/* a list of one-line items reads badly stretched the full width; it is a
   column in the middle, like the search box */
.chk{margin:10px 0 0;border-radius:var(--r);border:1px solid var(--line-2);background:rgba(255,255,255,.72);overflow:hidden;}
.chk summary{
  display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;list-style:none;
  font-size:15px;font-weight:800;color:var(--text);
}
.chk summary::-webkit-details-marker{display:none;}
.chk summary .cn{
  flex:none;min-width:44px;text-align:center;font-family:var(--mono);font-size:14px;font-weight:700;
  padding:3px 10px;border-radius:999px;background:var(--mute-bg);color:var(--mute);border:1px solid var(--mute-br);
}
.chk.bad summary .cn{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-br);}
.chk.warn summary .cn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-br);}
.chk.clean summary .cn{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-br);}
.chk summary .tag{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--navy);background:var(--tint);border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;white-space:nowrap;}
.chk[open] summary{border-bottom:1px solid var(--line);}
.chk .tblwrap{max-height:460px;overflow:auto;}

/* ---------- drawer + record card (the app's card) ---------- */
#veil{position:fixed;inset:0;z-index:90;background:rgba(11,17,20,.34);opacity:0;pointer-events:none;transition:opacity .18s;}
#veil.on{opacity:1;pointer-events:auto;}
#drawer{
  position:fixed;top:0;bottom:0;left:0;z-index:100;width:min(520px,100vw);
  background:var(--bg);border-inline-start:1px solid var(--line-2);
  box-shadow:10px 0 40px rgba(11,17,20,.22);
  transform:translateX(-104%);transition:transform .22s ease-out;
  display:flex;flex-direction:column;
}
#drawer.on{transform:none;}
.dr-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);background:rgba(255,255,255,.7);}
.dr-top h2{flex:1;margin:0;font-size:15px;font-weight:800;color:var(--navy);}
.fab{
  flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-2);background:var(--tint);color:var(--blue);padding:0;
}
.fab:hover{background:#d9e6f7;}
.dr-body{flex:1;overflow-y:auto;padding:14px 16px 40px;}

.rec{
  border-radius:var(--r-lg);overflow:hidden;border:1px solid rgba(255,255,255,.68);background:var(--card);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(21,101,192,.13);
}
.rec + .rec{margin-top:12px;}
.rec[data-s="ok"]{--tone:var(--ok);}
.rec[data-s="warn"]{--tone:var(--warn);}
.rec[data-s="bad"]{--tone:var(--bad);}
.rec[data-s="ban"]{--tone:var(--ban);}
.rec[data-s="mute"]{--tone:var(--mute);}
.head{padding:20px 18px 16px;text-align:center;border-bottom:1px solid var(--card-line);}
.code{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;font-size:12px;font-weight:800;color:var(--blue);
  background:var(--tint);border:1px solid var(--line-2);border-radius:999px;padding:3px 12px;
}
.code em{font-style:normal;color:var(--muted);}
.nm{font-size:20px;font-weight:800;line-height:1.42;margin:0;color:var(--text);}
.nm-en{font-family:var(--cond);font-weight:800;letter-spacing:.04em;font-size:18px;color:var(--text-2);text-transform:uppercase;direction:ltr;margin:4px 0 0;}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.permit{
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--card-line);background:color-mix(in srgb, var(--tone) 16%, #ffffff);
}
.permit-k{font-size:13px;font-weight:800;color:var(--text);}
.permit-s{font-size:15.5px;font-weight:800;color:var(--tone);margin-top:3px;}
.permit-c{font-size:13.5px;color:var(--text);margin-top:4px;font-weight:800;}
.permit-d{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--tone);line-height:1;}
.permit-d.na{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--mute);}
.grp{padding:0 14px;}
.grp-t{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--text);padding:14px 4px 8px;}
.rows{margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.row{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:10px 14px;
  border-radius:var(--r-sm);background:rgba(255,255,255,.82);border:1px solid #c7d3e0;
}
.row dt{flex:none;font-size:13.5px;font-weight:800;color:var(--text-2);margin:0;}
.row dd{margin:0;font-size:15px;font-weight:800;color:var(--text);text-align:end;word-break:break-word;min-width:0;}
.row dd.bad{color:var(--bad);}
.row dd.warn{color:var(--warn);}
.rec-pad{height:14px;}
.shots{padding:0 14px 16px;margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.shot{margin:0;overflow:hidden;border-radius:var(--r);background:#f7fafd;border:1px solid #cdd7e2;}
.shot img{display:block;width:100%;height:auto;cursor:zoom-in;}
.noshot{display:flex;align-items:center;justify-content:center;padding:22px;background:var(--tint);color:var(--mute);font-size:13.5px;font-weight:800;}
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;
  border-radius:11px;border:1.5px solid var(--mute-br);background:var(--mute-bg);color:var(--mute);margin:12px 14px 0;
}
.banner.ok{background:var(--ok-bg);border-color:var(--ok-br);color:var(--ok);}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-br);color:var(--warn);}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-br);color:var(--bad);}
.banner.ban{background:#f6d6d6;border-color:#e08a8a;color:var(--ban);}
.banner .bt{font-size:13px;font-weight:800;}
.banner .bv{font-size:16.5px;font-weight:800;text-align:end;unicode-bidi:plaintext;}
.banner .bx{font-size:12px;font-weight:700;opacity:.85;margin-top:2px;text-align:end;}
.occ-n{
  display:flex;align-items:center;gap:8px;padding:12px 16px 0;font-size:12.5px;font-weight:800;color:var(--navy);
}
.occ-n .cur{background:#f7c58a;border:1px solid #d98b2b;color:#8a4e04;border-radius:999px;padding:1px 9px;}
.dr-sec{display:flex;align-items:center;gap:10px;margin:20px 2px 10px;font-size:13.5px;font-weight:800;color:var(--navy);}
.dr-sec::after{content:'';flex:1;height:1px;background:var(--line-2);}
.dr-sec b{font-family:var(--mono);color:var(--blue);}

#zoom{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.94);}
#zoom.on{display:flex;}
#zoom img{max-width:100%;max-height:92vh;border-radius:var(--r);}

/* ---------- busy / toast / tooltip ---------- */
#busy{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(237,242,248,.78);backdrop-filter:blur(5px);}
#busy.on{display:flex;}
.busy-card{display:flex;align-items:center;gap:14px;padding:20px 26px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(21,101,192,.16);font-size:15.5px;font-weight:800;color:var(--navy);}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--blue);animation:spin .7s linear infinite;flex:none;}
#toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);z-index:450;opacity:0;pointer-events:none;
  padding:12px 20px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:14.5px;font-weight:800;
  box-shadow:0 10px 30px rgba(11,17,20,.3);transition:opacity .2s,transform .2s;max-width:min(680px,92vw);line-height:1.8;
}

<!-- ============================================================
     CORE — no DOM in here. Reads an .xlsx with nothing but the
     browser (zip directory + DecompressionStream + the sheet XML),
     then builds the model with the SAME rules the app uses, so a
     figure here and a figure on a guard's phone cannot disagree.
     ============================================================ -->
<script id="core">
const NCM = (() => {
"use strict";

const EXPIRY_WINDOW = 30;                 // days that count as "expiring soon" — the app's number
const IND_TAB = "تصاريح أفراد";           // matched trimmed: the real tab carries a trailing space
const VEH_TAB = "تصاريح مركبات";
const EMP_TAB = "employees";

/* ---------- text ---------- */
function toLatinDigits(s){
  return String(s)
    .replace(/[٠-٩]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x0660 + 48))
    .replace(/[۰-۹]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x06F0 + 48));
}
function normalize(s){
  if(s === null || s === undefined) return "";
  return toLatinDigits(String(s)).replace(/\s+/g, " ").trim();
}
function clean(s){ return (s === null || s === undefined) ? "" : String(s).trim(); }
function digitsOnly(s){ return normalize(s).replace(/[^\d]/g, ""); }
/* One shape per Arabic letter, for MATCHING only — the same folding the
   permits app does. What is shown is always what the sheet says. */
function foldArabic(s){
  return normalize(s)
    .replace(/[ً-ْٰ]/g, "")
    .replace(/ـ/g, "")
    .replace(/[أإآ]/g, "ا")
    .replace(/[ىئ]/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .replace(/\s+/g, "")
    .toLowerCase();
}

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2, "0");
function today0(){ const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function mkDate(y, m, d){
  if(y < 1900 || y > 2200 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d); dt.setHours(0, 0, 0, 0);
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}
function fmt(dt){ return pad2(dt.getDate()) + "/" + pad2(dt.getMonth() + 1) + "/" + dt.getFullYear(); }
// The employees sheet: dd/mm/yyyy text (or ISO). Never the browser's own parser.
function parseStrict(v){
  const s = clean(v); if(!s) return null;
  let h;
  if((h = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return mkDate(+h[3], +h[2], +h[1]);
  if((h = s.match(/^(\d{4})[\-\/.](\d{1,2})[\-\/.](\d{1,2})/)))  return mkDate(+h[1], +h[2], +h[3]);
  return null;
}
// The permits sheet: a leading date, day first unless that is impossible,
// with whatever was typed after it kept as a note ("18-11-2025(ABNA SINA)").
const LEADING_DATE = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/;
function parseLoose(v){
  const s = normalize(v); const m = s.match(LEADING_DATE);
  if(!m) return null;
  const a = +m[1], b = +m[2], y = +m[3];
  let day, month;
  if(b > 12 && a <= 12){ month = a; day = b; } else { day = a; month = b; }
  const date = mkDate(y, month, day);
  if(!date) return null;
  const rest = s.slice(m[0].length).replace(/^[\s\-\/(),.:؛;]+/, "").replace(/[)\]]+$/, "").trim();
  return { date, text: fmt(date), rest, year: y };
}
function daysTo(dt){
  const t = today0();
  return Math.round((Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) -
                     Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
}

/* ---------- national id ---------- */
const GOV = {
  "01":"القاهرة","02":"الإسكندرية","03":"بورسعيد","04":"السويس","11":"دمياط","12":"الدقهلية",
  "13":"الشرقية","14":"القليوبية","15":"كفر الشيخ","16":"الغربية","17":"المنوفية","18":"البحيرة",
  "19":"الإسماعيلية","21":"الجيزة","22":"بني سويف","23":"الفيوم","24":"المنيا","25":"أسيوط",
  "26":"سوهاج","27":"قنا","28":"أسوان","29":"الأقصر","31":"البحر الأحمر","32":"الوادي الجديد",
  "33":"مطروح","34":"شمال سيناء","35":"جنوب سيناء","88":"خارج الجمهورية"
};
function nidInfo(d){
  if(!/^\d{14}$/.test(d) || !/^[23]/.test(d) || !GOV[d.slice(7, 9)]) return null;
  const birth = mkDate((d[0] === "2" ? 1900 : 2000) + +d.slice(1, 3), +d.slice(3, 5), +d.slice(5, 7));
  if(!birth) return null;
  const t = today0();
  let age = t.getFullYear() - birth.getFullYear();
  if(t.getMonth() < birth.getMonth() || (t.getMonth() === birth.getMonth() && t.getDate() < birth.getDate())) age--;
  return { birth: fmt(birth), age, gov: GOV[d.slice(7, 9)], govCode: d.slice(7, 9), male: (+d[12]) % 2 === 1 };
}

/* ============================================================
   XLSX — just enough of the format to read values.
   The 247k-row ASE Data tab is never even decompressed.
   ============================================================ */
// An error the page can say in its own words, in whichever language it is showing:
// `code` says what went wrong, `extra` carries the detail.
function fail(code, message, extra){
  const e = new Error(message);
  e.code = code; e.extra = extra;
  return e;
}
function zipEntries(buf){
  const dv = new DataView(buf), n = buf.byteLength;
  let eocd = -1;
  for(let i = n - 22; i >= Math.max(0, n - 22 - 65535); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw fail("NOT_XLSX", "الملف ده مش ملف إكسيل xlsx");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder("utf-8"), out = new Map();
  for(let i = 0; i < count; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
    out.set(dec.decode(new Uint8Array(buf, off + 46, nl)), {
      method: dv.getUint16(off + 10, true),
      csize:  dv.getUint32(off + 20, true),
      lho:    dv.getUint32(off + 42, true)
    });
    off += 46 + nl + el + cl;
  }
  return out;
}
async function unzip(buf, e){
  const dv = new DataView(buf);
  const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
  const bytes = new Uint8Array(buf, start, e.csize);
  if(e.method === 0) return new TextDecoder("utf-8").decode(bytes);
  if(e.method !== 8) throw fail("NOT_XLSX", "ضغط غير مدعوم جوّه الملف");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new TextDecoder("utf-8").decode(await new Response(stream).arrayBuffer());
}
const ENT = { amp:"&", lt:"<", gt:">", quot:'"', apos:"'" };
function xmlText(s){
  // A line break typed inside a cell sits in the file as CR LF. Every XML
  // parser hands that back as a single LF, and so must this — otherwise the
  // text comes out two characters longer per break than Excel itself has it.
  if(s.indexOf("\r") !== -1) s = s.replace(/\r\n?/g, "\n");
  if(s.indexOf("&") !== -1){
    s = s.replace(/&(?:#(\d+)|#x([0-9a-fA-F]+)|(amp|lt|gt|quot|apos));/g,
      (m, d, h, n) => d ? String.fromCodePoint(+d) : h ? String.fromCodePoint(parseInt(h, 16)) : ENT[n]);
  }
  if(s.indexOf("_x") !== -1) s = s.replace(/_x([0-9A-Fa-f]{4})_/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
  return s;
}
function attr(a, name){
  const m = new RegExp("(?:^|\\s)" + name + '="([^"]*)"').exec(a);
  return m ? m[1] : null;
}
function sharedStrings(xml){
  const out = [], re = /<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g;
  let m;
  while((m = re.exec(xml))){
    let body = m[1];
    if(!body){ out.push(""); continue; }
    if(body.indexOf("<rPh") !== -1) body = body.replace(/<rPh\b[\s\S]*?<\/rPh>/g, "");
    let s = "", k; const tr = /<t\b[^>]*?(?:\/>|>([\s\S]*?)<\/t>)/g;
    while((k = tr.exec(body))) if(k[1]) s += xmlText(k[1]);
    out.push(s);
  }
  return out;
}
/* Which cell styles are dates. A date in Excel is only a number wearing a
   date format, so the format is the one thing that tells them apart. */
function dateStyles(xml){
  const custom = {}; let m;
  const nf = /<numFmt\b([^>]*)>/g;
  while((m = nf.exec(xml))){
    const id = attr(m[1], "numFmtId"), code = attr(m[1], "formatCode");
    if(id !== null && code !== null) custom[id] = xmlText(code);
  }
  const isDateCode = code => {
    const c = code.replace(/"[^"]*"/g, "").replace(/\[[^\]]*\]/g, "").replace(/\\./g, "");
    return /[dmyhs]/i.test(c);
  };
  const block = (xml.match(/<cellXfs\b[\s\S]*?<\/cellXfs>/) || [""])[0];
  const out = [], xf = /<xf\b([^>]*)>/g;
  while((m = xf.exec(block))){
    const id = +(attr(m[1], "numFmtId") || 0);
    out.push((id >= 14 && id <= 22) || (id >= 27 && id <= 36) || (id >= 45 && id <= 47) || (id >= 50 && id <= 58)
             || (custom[id] !== undefined && isDateCode(custom[id])));
  }
  return out;
}
function colIndex(letters){
  let n = 0;
  for(let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}
function serialToDMY(serial){
  const ms = Math.round((Math.floor(serial) - 25569) * 86400000);
  const d = new Date(ms);
  if(isNaN(d.getTime())) return String(serial);
  return pad2(d.getUTCDate()) + "/" + pad2(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear();
}
function numText(raw){
  if(/^-?\d+$/.test(raw)) return raw;
  const n = Number(raw);
  if(!isFinite(n)) return raw;
  return (Number.isInteger(n) && Math.abs(n) < 1e21) ? n.toFixed(0) : String(n);
}
/* -> [{n: the row's number in Excel, c: [text per column]}], empty rows dropped */
function sheetRows(xml, shared, dateXf, maxCol){
  const rows = [], rre = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
  let m;
  while((m = rre.exec(xml))){
    if(!m[2]) continue;
    const rn = +(attr(m[1], "r") || 0) || rows.length + 1;
    const cells = []; let any = false, ci = -1, c;
    const cre = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    while((c = cre.exec(m[2]))){
      const ref = /(?:^|\s)r="([A-Z]+)\d+"/.exec(c[1]);
      ci = ref ? colIndex(ref[1]) : ci + 1;
      if(c[2] === undefined || (maxCol && ci >= maxCol)) continue;
      const t = attr(c[1], "t");
      let v = "";
      if(t === "inlineStr"){
        let k; const tr = /<t\b[^>]*?(?:\/>|>([\s\S]*?)<\/t>)/g;
        while((k = tr.exec(c[2]))) if(k[1]) v += xmlText(k[1]);
      }else{
        const vm = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(c[2]);
        if(!vm) continue;
        const raw = vm[1];
        if(t === "s") v = shared[+raw] || "";
        else if(t === "str") v = xmlText(raw);
        else if(t === "b") v = raw === "1" ? "TRUE" : "FALSE";
        else if(t === "e") v = "";
        else v = dateXf[+(attr(c[1], "s") || 0)] ? serialToDMY(+raw) : numText(raw);
      }
      if(v !== ""){ cells[ci] = v; any = true; }
    }
    if(any){
      for(let i = 0; i < cells.length; i++) if(cells[i] === undefined) cells[i] = "";
      rows.push({ n: rn, c: cells });
    }
  }
  return rows;
}

/* Reads one workbook and says which of the two it is. */
async function readFile(file, onStep){
  const step = onStep || (() => {});
  const buf = await file.arrayBuffer();
  const ent = zipEntries(buf);
  const get = async name => {
    const e = ent.get(name);
    if(!e) throw fail("NOT_XLSX", "ناقص جوّه الملف: " + name);
    return unzip(buf, e);
  };
  const wbXml = await get("xl/workbook.xml"), relXml = await get("xl/_rels/workbook.xml.rels");
  const rel = {}; let m;
  const rre = /<Relationship\b([^>]*)>/g;
  while((m = rre.exec(relXml))) rel[attr(m[1], "Id")] = attr(m[1], "Target");
  const tabs = [], sre = /<sheet\b([^>]*)>/g;
  while((m = sre.exec(wbXml))){
    const target = rel[attr(m[1], "r:id")] || "";
    tabs.push({ name: xmlText(attr(m[1], "name") || ""),
                path: target.charAt(0) === "/" ? target.slice(1) : "xl/" + target });
  }
  const find = want => tabs.find(t => t.name.trim() === want);
  const ind = find(IND_TAB), veh = find(VEH_TAB), emp = find(EMP_TAB);
  const kind = (ind && veh) ? "per" : emp ? "emp" : null;
  if(!kind){
    const found = tabs.map(t => t.name.trim()).join(" · ");
    throw fail("NOT_OURS", "«" + file.name + "» مش شيت التصاريح ولا شيت الموظفين — التابات اللي فيه: " + found, found);
  }
  step("بقرا النصوص من «" + file.name + "»");
  const shared = ent.has("xl/sharedStrings.xml") ? sharedStrings(await get("xl/sharedStrings.xml")) : [];
  const dateXf = ent.has("xl/styles.xml") ? dateStyles(await get("xl/styles.xml")) : [];
  const tab = async (t, maxCol, label) => {
    step("بقرا " + label);
    const rows = sheetRows(await get(t.path), shared, dateXf, maxCol);
    const header = rows.length ? rows[0].c : [];
    return { header, rows: rows.slice(1) };
  };
  const payload = {
    kind, fileName: file.name, lastModified: file.lastModified || 0, size: file.size || buf.byteLength,
    loadedAt: Date.now(), tabs: tabs.map(t => t.name), sheets: {}
  };
  if(kind === "per"){
    payload.sheets.ind = await tab(ind, 16, "تصاريح الأفراد");
    payload.sheets.veh = await tab(veh, 8, "تصاريح المركبات");
  }else{
    payload.sheets.emp = await tab(emp, 0, "الموظفين");
  }
  return payload;
}

/* ============================================================
   EMPLOYEES — the rules are the app's, word for word.
   ============================================================ */
const EMP_COLS = {
  "الكود":"emp_code", "الاسم":"full_name", "الاسم بالإنجليزي":"full_name_en",
  "الرقم القومي":"national_id", "الوظيفة":"job_title", "القسم":"department",
  "النوع":"category", "رقم الهاتف":"phone", "تاريخ التعيين":"hire_date",
  "العنوان":"address", "تاريخ التصريح":"permit_date", "حالة التصريح":"permit_status",
  "سبب المنع":"ban_reason", "انتهاء الاستقالة":"resignation_end_date", "ملاحظات":"notes",
  // the letter the permit came on — added to the table on 2 October 2026
  "رقم الخطاب":"letter_number", "تاريخ الخطاب":"letter_date", "الشركة":"letter_company", "ملاحظات الخطاب":"letter_note"
};
function empStatus(e){
  const raw = e.permit_status, dl = e.dl;
  if(raw === "ممنوع") return { k:"ban", label:"ممنوع", code:"BANNED" };
  if(e.resigned){
    if(raw === "ساري" && dl !== null && dl >= 0) return { k:"ok", label:"ساري", code:"VERIFIED" };
    return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
  }
  if(raw === "ساري"){
    if(e.permit_date === "ساري حتى الاستقالة") return { k:"ok", label:"ساري", code:"VERIFIED" };
    if(dl === null) return { k:"mute", label:"بدون تاريخ", code:"NO DATE" };
    if(dl < 0) return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
    if(dl <= EXPIRY_WINDOW) return { k:"warn", label:"قرب الانتهاء", code:"EXPIRING" };
    return { k:"ok", label:"ساري", code:"VERIFIED" };
  }
  if(raw === "منتهي الصلاحية") return { k:"bad", label:"تصريح منتهي", code:"EXPIRED" };
  if(raw === "بدون تصريح" || raw === "") return { k:"mute", label:"بدون تصريح", code:"NO PERMIT" };
  return { k:"mute", label:raw, code:"UNKNOWN" };
}
function byCode(a, b){
  const x = parseInt(digitsOnly(a.emp_code), 10), y = parseInt(digitsOnly(b.emp_code), 10);
  if(isNaN(x) && isNaN(y)) return 0;
  if(isNaN(x)) return 1;
  if(isNaN(y)) return -1;
  return x - y;
}
function buildEmployees(p){
  const sh = p.sheets.emp, idx = {};
  sh.header.forEach((h, i) => { const k = EMP_COLS[clean(h)]; if(k && !(k in idx)) idx[k] = i; });
  const missing = Object.keys(EMP_COLS).filter(h => !(EMP_COLS[h] in idx));
  const list = [];
  sh.rows.forEach(r => {
    const e = { row: r.n };
    Object.values(EMP_COLS).forEach(k => { e[k] = (k in idx) ? clean(r.c[idx[k]]) : ""; });
    if(!e.emp_code) return;
    e.resigned = !!e.resignation_end_date;                       // any value counts, even «غير محدد»
    e.foreign  = !(e.national_id.length === 14 && /^[0-9]+$/.test(e.national_id));
    e.pdate    = parseStrict(e.permit_date);
    e.dl       = e.pdate ? daysTo(e.pdate) : null;
    e.st       = empStatus(e);
    e.works    = !e.resigned && e.permit_status !== "ممنوع";     // worksHere() in the app
    e.nid      = digitsOnly(e.national_id);
    e.hay      = [foldArabic(e.full_name), e.full_name_en.toLowerCase().replace(/\s+/g, ""), e.emp_code,
                  e.nid, foldArabic(e.job_title), foldArabic(e.department), digitsOnly(e.phone),
                  foldArabic(e.letter_number), foldArabic(e.letter_company)].join("|");
    list.push(e);
  });
  list.sort(byCode);
  const byCodeMap = new Map(), byNid = new Map();
  list.forEach(e => {
    byCodeMap.set(e.emp_code, e);
    if(!e.foreign){ if(!byNid.has(e.nid)) byNid.set(e.nid, []); byNid.get(e.nid).push(e); }
  });
  return { list, byCode: byCodeMap, byNid, missing };
}

/* ============================================================
   PERMITS — columns are read by position, exactly as the app does.
   ============================================================ */
const IND_COL = { NAME:2, JOB:3, ID:4, ADDR:5, NOTE:6, SENDER:7, PERMIT:8, DAY:9, MAIL:10, LETTER:11, COMPANY:12, LDATE:13, ANOTE:14 };
const VEH_COL = { PLATE:2, TYPE:3, OWNER:4, PERMIT:5, DAY:6, MAIL:7 };
const EXPECT = {
  ind: ["الاسم","الوظيفة","الرقم القومى","العنوان","ملاحظات","المرسل","تصريح","Mail Day","MAIL TYPE","Letter Number"],
  veh: ["رقم السيارة","النوع","تابعه","تصريح","Mail Day","MAIL TYPE"]
};
const RENEW_WORDS = ["عايز تجديد","الرخصه منتهيه","غيرت لوحات","تجديد"];
function classify(rawValue){
  const s = normalize(rawValue);
  /* Two different answers that used to share one box: "pending" is a permit
     still out for a reply (an empty cell, or the words «فى انتظار الرد»), and
     "undet" is one whose standing nobody knows («غير محدد موقف», question
     marks, or any wording that is none of the others). */
  // `auto` marks the two wordings that are the system's own and not the sheet's,
  // so the page can say them in whichever language it is showing
  if(s === "") return { cat:"pending", cls:"warn", main:"في انتظار الرد", auto:"pending", note:"", date:null, dl:null, raw:s };
  if(/^[؟?]+$/.test(s.replace(/\s+/g, ""))) return { cat:"undet", cls:"mute", main:"غير محدد موقفه حتى الآن", auto:"undet", note:"", date:null, dl:null, raw:s };
  if(s.includes("منع")) return { cat:"ban", cls:"ban", main:s, note:"", date:null, dl:null, raw:s };
  if(RENEW_WORDS.some(w => s.includes(w))) return { cat:"renew", cls:"bad", main:s, note:"", date:null, dl:null, raw:s };
  if(s.includes("مؤقت")) return { cat:"temp", cls:"mute", main:s, note:"", date:null, dl:null, raw:s };
  const p = parseLoose(s);
  if(p){
    const dl = daysTo(p.date);
    return { cat: dl < 0 ? "expired" : dl <= EXPIRY_WINDOW ? "soon" : "ok",
             cls: dl < 0 ? "bad" : dl <= EXPIRY_WINDOW ? "warn" : "ok",
             main: p.text, note: p.rest, date: p.date, dl, raw: s, year: p.year };
  }
  if(s.includes("انتظار")) return { cat:"pending", cls:"warn", main:s, note:"", date:null, dl:null, raw:s };
  return { cat:"undet", cls:"mute", main:s, note:"", date:null, dl:null, raw:s };
}
// dated first in order, undated after them; the LAST one is what the app opens on
function sortByDay(records){
  return records.slice().sort((a, b) => {
    if(a.dayDate && b.dayDate) return a.dayDate - b.dayDate;
    if(a.dayDate) return -1;
    if(b.dayDate) return 1;
    return 0;
  });
}
function headerDrift(header, expect){
  const plain = s => normalize(s).replace(/ـ/g, "");
  const got = expect.map((_, i) => plain(header[2 + i]));
  return got.every((g, i) => g === plain(expect[i])) ? null : got;
}
function buildIndividuals(p){
  const sh = p.sheets.ind, C = IND_COL, groups = new Map();
  sh.rows.forEach(r => {
    const c = r.c;
    const idVal = normalize(c[C.ID]), nameVal = normalize(c[C.NAME]);
    if(!idVal && !nameVal) return;
    const key = idVal ? "ID:" + digitsOnly(idVal) : "NAME:" + nameVal;
    if(!groups.has(key)) groups.set(key, { key, name: nameVal, nationalId: idVal, nid: digitsOnly(idVal), records: [], names: new Map() });
    const g = groups.get(key);
    const f = foldArabic(nameVal);
    if(f && !g.names.has(f)) g.names.set(f, nameVal);
    const day = parseLoose(c[C.DAY]);
    g.records.push({
      row: r.n, name: nameVal, job: normalize(c[C.JOB]), address: normalize(c[C.ADDR]), note: normalize(c[C.NOTE]),
      sender: normalize(c[C.SENDER]), mail: normalize(c[C.MAIL]), letter: normalize(c[C.LETTER]),
      company: normalize(c[C.COMPANY]), ldate: normalize(c[C.LDATE]), anote: normalize(c[C.ANOTE]),
      permit: normalize(c[C.PERMIT]), day: normalize(c[C.DAY]), dayDate: day ? day.date : null,
      dayText: day ? day.text : "", dayNote: day ? day.rest : normalize(c[C.DAY]), p: classify(c[C.PERMIT])
    });
  });
  const list = [], byNid = new Map();
  groups.forEach(g => {
    g.records = sortByDay(g.records);
    g.cur = g.records[g.records.length - 1];
    g.p = g.cur.p;
    g.hay = [[...g.names.keys()].join("|"), g.nid, foldArabic(g.cur.job), foldArabic(g.cur.company), foldArabic(g.cur.sender)].join("|");
    if(g.nid) byNid.set(g.nid, g);
    list.push(g);
  });
  return { list, groups, byNid, rows: sh.rows.length, drift: headerDrift(sh.header, EXPECT.ind) };
}
function buildVehicles(p){
  const sh = p.sheets.veh, C = VEH_COL, groups = new Map();
  sh.rows.forEach(r => {
    const c = r.c, plate = normalize(c[C.PLATE]);
    if(!plate) return;
    const key = foldArabic(plate);
    if(!groups.has(key)) groups.set(key, { key, plate, records: [], forms: new Set() });
    const g = groups.get(key);
    g.forms.add(plate);
    const day = parseLoose(c[C.DAY]);
    g.records.push({
      row: r.n, plate, type: normalize(c[C.TYPE]), owner: normalize(c[C.OWNER]), mail: normalize(c[C.MAIL]),
      permit: normalize(c[C.PERMIT]), day: normalize(c[C.DAY]), dayDate: day ? day.date : null,
      dayText: day ? day.text : "", dayNote: day ? day.rest : normalize(c[C.DAY]), p: classify(c[C.PERMIT])
    });
  });
  const list = [];
  groups.forEach(g => {
    g.records = sortByDay(g.records);
    g.cur = g.records[g.records.length - 1];
    g.p = g.cur.p;
    g.hay = [g.key, foldArabic(g.cur.type), foldArabic(g.cur.owner)].join("|");
    list.push(g);
  });
  return { list, groups, rows: sh.rows.length, drift: headerDrift(sh.header, EXPECT.veh) };
}

/* ============================================================
   CHECKS — everything that is worth a second look, in one place.
   ============================================================ */
function runChecks(M){
  const out = [];
  const add = (id, scope, sev, title, hint, cols, rows) => out.push({ id, scope, sev, title, hint, cols, rows });
  const emp = M.emp, ind = M.ind, veh = M.veh;

  if(ind && ind.drift) add("s-ind", "شيت التصاريح", "bad", "ترتيب أعمدة «تصاريح أفراد» اتغيّر",
    "التطبيق بيقرا الأعمدة بالترتيب — أي تغيير بيبوّظ العرض من غير رسالة", ["الموجود دلوقتي"],
    [{ open: "", cells: [ind.drift.join(" · ")] }]);
  if(veh && veh.drift) add("s-veh", "شيت التصاريح", "bad", "ترتيب أعمدة «تصاريح مركبات» اتغيّر",
    "التطبيق بيقرا الأعمدة بالترتيب", ["الموجود دلوقتي"], [{ open: "", cells: [veh.drift.join(" · ")] }]);
  if(emp && emp.missing.length) add("s-emp", "شيت الموظفين", "bad", "أعمدة ناقصة في شيت الموظفين",
    "عناوين الأعمدة دي مش موجودة بالنص", ["العمود"], emp.missing.map(h => ({ open: "", cells: [h] })));

  if(emp){
    const E = emp.list, row = (e, extra) => ({ open: "emp:" + e.emp_code, cells: [e.emp_code, e.full_name].concat(extra) });
    const base = ["الكود", "الاسم"];
    add("e-nid", "الموظفين", "bad", "رقم قومي مش مظبوط", "أرقام بس لكن مش 14 خانة صحيحة (الأجنبي برقم جواز مش محسوب)",
      base.concat(["الرقم المكتوب"]),
      E.filter(e => /^[0-9]+$/.test(e.national_id) && ![7, 9].includes(e.national_id.length) && !nidInfo(e.national_id))
       .map(e => row(e, [e.national_id])));
    const dupN = [...emp.byNid.values()].filter(a => a.length > 1);
    add("e-dupnid", "الموظفين", "bad", "رقم قومي متكرر", "نفس الرقم القومي على أكتر من كود",
      base.concat(["الرقم القومي"]), dupN.flat().map(e => row(e, [e.national_id])));
    const seen = new Map(); E.forEach(e => seen.set(e.emp_code, (seen.get(e.emp_code) || 0) + 1));
    add("e-dupcode", "الموظفين", "bad", "كود متكرر", "نفس الكود على أكتر من صف",
      base.concat(["صف الإكسيل"]), E.filter(e => seen.get(e.emp_code) > 1).map(e => row(e, [e.row])));
    add("e-cat", "الموظفين", "bad", "النوع مش blue / white", "التطبيق مايعرفش يقرا غير الكلمتين دول بحروف صغيرة",
      base.concat(["المكتوب"]), E.filter(e => e.category !== "blue" && e.category !== "white").map(e => row(e, [e.category || "فاضي"])));
    add("e-nodate", "الموظفين", "warn", "ساري من غير تاريخ", "الحالة «ساري» وخانة التاريخ فاضية أو مش تاريخ — بيظهر في التطبيق «بدون تاريخ»",
      base.concat(["المكتوب في التاريخ"]), E.filter(e => e.st.code === "NO DATE").map(e => row(e, [e.permit_date || "فاضي"])));
    add("e-unknown", "الموظفين", "warn", "حالة تصريح مش معروفة", "كلمة غير «ساري / بدون تصريح / ممنوع / منتهي الصلاحية»",
      base.concat(["المكتوب"]), E.filter(e => e.st.code === "UNKNOWN").map(e => row(e, [e.permit_status])));
    const okWords = ["ساري حتى الاستقالة", "غير معروف", "غير محدد"];
    const badDates = [];
    E.forEach(e => [["تاريخ التعيين", e.hire_date], ["تاريخ التصريح", e.permit_date], ["انتهاء الاستقالة", e.resignation_end_date]]
      .forEach(([lab, v]) => { if(v && !parseStrict(v) && !okWords.includes(v)) badDates.push(row(e, [lab, v])); }));
    add("e-dates", "الموظفين", "warn", "تاريخ مش مقري", "خانة تاريخ فيها حاجة مش بصيغة يوم/شهر/سنة",
      base.concat(["الخانة", "المكتوب"]), badDates);
    add("e-ban", "الموظفين", "warn", "ممنوع من غير سبب", "الحالة «ممنوع» وخانة سبب المنع فاضية",
      base, E.filter(e => e.permit_status === "ممنوع" && !e.ban_reason).map(e => row(e, [])));
  }

  if(emp && ind){
    const E = emp.list, base = ["الكود", "الاسم"];
    const row = (e, extra) => ({ open: "emp:" + e.emp_code, cells: [e.emp_code, e.full_name].concat(extra) });
    const link = e => e.foreign ? null : ind.byNid.get(e.nid) || null;
    add("x-none", "بين الشيتين", "info", "موظف موجود ومالوش صف في شيت التصاريح",
      "مصري على رأس العمل ورقمه القومي مش موجود في «تصاريح أفراد»", base.concat(["الوظيفة", "حالة التصريح"]),
      E.filter(e => e.works && !e.foreign && !link(e)).map(e => row(e, [e.job_title, e.st.label])));
    add("x-date", "بين الشيتين", "warn", "تاريخ التصريح مختلف بين الشيتين",
      "التاريخ في شيت الموظفين غير آخر تصريح في شيت التصاريح", base.concat(["في شيت الموظفين", "في شيت التصاريح"]),
      E.filter(e => { const g = link(e); return !e.resigned && e.pdate && g && g.p.date && fmt(e.pdate) !== g.p.main; })
       .map(e => row(e, [fmt(e.pdate), link(e).p.main])));
    add("x-ban1", "بين الشيتين", "bad", "منع في شيت التصاريح ومش «ممنوع» في شيت الموظفين",
      "آخر تصريح للراجل «منع» وهو لسه على رأس العمل بحالة تانية", base.concat(["المكتوب في التصاريح", "حالته في الموظفين"]),
      E.filter(e => { const g = link(e); return !e.resigned && g && g.p.cat === "ban" && e.permit_status !== "ممنوع"; })
       .map(e => row(e, [link(e).p.main, e.permit_status || "فاضي"])));
    add("x-ban2", "بين الشيتين", "warn", "«ممنوع» في شيت الموظفين وآخر تصريح مش منع",
      "ممكن يكون المنع اتشال من شيت واحد بس", base.concat(["سبب المنع", "آخر تصريح"]),
      E.filter(e => { const g = link(e); return e.permit_status === "ممنوع" && g && g.p.cat !== "ban"; })
       .map(e => row(e, [e.ban_reason || "—", link(e).p.main])));
  }

  if(ind){
    const G = ind.list;
    const bad = [], sendBad = [], yearBad = [];
    G.forEach(g => g.records.forEach(r => {
      const open = "ind:" + g.key;
      if(r.day && !r.dayDate) sendBad.push({ open, cells: [r.row, r.name, r.day] });
      if(r.p.date && (r.p.year < 2020 || r.p.year > 2035)) yearBad.push({ open, cells: [r.row, r.name, r.permit] });
    }));
    G.forEach(g => { if(g.nationalId && !nidInfo(g.nid)) g.records.forEach(r => bad.push({ open: "ind:" + g.key, cells: [r.row, r.name, g.nationalId] })); });
    add("p-nid", "تصاريح الأفراد", "bad", "رقم قومي مش مظبوط", "مش 14 خانة صحيحة — الراجل ده مش هيتلاقى بالرقم",
      ["صف الإكسيل", "الاسم", "الرقم المكتوب"], bad);
    add("p-names", "تصاريح الأفراد", "warn", "نفس الرقم القومي بأكتر من اسم", "ممكن غلطة كتابة في الاسم أو رقم اتكرر على شخصين",
      ["الرقم القومي", "الأسماء المكتوبة"],
      G.filter(g => g.nid && g.names.size > 1).map(g => ({ open: "ind:" + g.key, cells: [g.nationalId, [...g.names.values()].join(" ← ")] })));
    const byName = new Map();
    G.forEach(g => { if(!g.nid) return; g.names.forEach((_, f) => { if(!byName.has(f)) byName.set(f, []); byName.get(f).push(g); }); });
    const sameName = [];
    byName.forEach(arr => { if(arr.length > 1) arr.forEach(g => sameName.push({ open: "ind:" + g.key, cells: [g.name, g.nationalId] })); });
    add("p-samename", "تصاريح الأفراد", "info", "نفس الاسم بأكتر من رقم قومي", "ممكن يكونوا شخصين فعلاً — محتاجة نظرة بس",
      ["الاسم", "الرقم القومي"], sameName);
    add("p-day", "تصاريح الأفراد", "warn", "تاريخ إرسال مش مقري", "خانة Mail Day فيها حاجة مش تاريخ",
      ["صف الإكسيل", "الاسم", "المكتوب"], sendBad);
    add("p-year", "تصاريح الأفراد", "warn", "سنة تصريح غريبة", "تاريخ تصريح بره 2020 – 2035",
      ["صف الإكسيل", "الاسم", "المكتوب"], yearBad);
  }

  if(veh){
    const G = veh.list, sendBad = [], yearBad = [];
    G.forEach(g => g.records.forEach(r => {
      const open = "veh:" + g.key;
      if(r.day && !r.dayDate) sendBad.push({ open, cells: [r.row, r.plate, r.day] });
      if(r.p.date && (r.p.year < 2020 || r.p.year > 2035)) yearBad.push({ open, cells: [r.row, r.plate, r.permit] });
    }));
    add("v-forms", "تصاريح المركبات", "info", "لوحة مكتوبة بأكتر من شكل", "التطبيق بيجمعهم في كارت واحد، بس الأحسن يتوحّدوا في الشيت",
      ["الأشكال المكتوبة"], G.filter(g => g.forms.size > 1).map(g => ({ open: "veh:" + g.key, cells: [[...g.forms].join(" ← ")] })));
    add("v-day", "تصاريح المركبات", "warn", "تاريخ إرسال مش مقري", "خانة Mail Day فيها حاجة مش تاريخ",
      ["صف الإكسيل", "رقم السيارة", "المكتوب"], sendBad);
    add("v-year", "تصاريح المركبات", "warn", "سنة تصريح غريبة", "تاريخ تصريح بره 2020 – 2035",
      ["صف الإكسيل", "رقم السيارة", "المكتوب"], yearBad);
  }
  return out;
}

function buildModel(data){
  const M = { emp: null, ind: null, veh: null, checks: [] };
  if(data.emp) M.emp = buildEmployees(data.emp);
  if(data.per){ M.ind = buildIndividuals(data.per); M.veh = buildVehicles(data.per); }
  if(M.emp && M.ind){
    M.emp.list.forEach(e => { e.per = e.foreign ? null : (M.ind.byNid.get(e.nid) || null); });
    M.ind.list.forEach(g => { g.emp = (g.nid && M.emp.byNid.get(g.nid)) || null; });
  }
  M.checks = runChecks(M);
  M.issues = M.checks.filter(c => c.sev !== "info").reduce((n, c) => n + c.rows.length, 0);
  return M;
}

/* ============================================================
   WRITING AN .xlsx — the other direction, for «تصدير Excel».
   A real workbook, not a CSV: one sheet, the company mark, a header that stays
   put, a filter on every column, rows ruled and banded, columns as wide as
   what is in them, dates that are dates and sort as dates, and long numbers
   (national ids) kept as text so Excel cannot turn them into 2.92E+13.
   Still nothing but the browser: the sheet XML is written by hand and zipped
   with CompressionStream.
   ============================================================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function deflateRaw(bytes){
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function zip(files){                       // files: [[name, text or bytes]]
  const enc = new TextEncoder(), parts = [], dir = [];
  let at = 0;
  for(const f of files){
    const name = enc.encode(f[0]), raw = typeof f[1] === "string" ? enc.encode(f[1]) : f[1], data = await deflateRaw(raw), crc = crc32(raw);
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true); head.setUint16(4, 20, true); head.setUint16(6, 0x0800, true); head.setUint16(8, 8, true);
    head.setUint16(10, 0, true); head.setUint16(12, 0x21, true);            // a fixed stamp: 1980-01-01
    head.setUint32(14, crc, true); head.setUint32(18, data.length, true); head.setUint32(22, raw.length, true);
    head.setUint16(26, name.length, true); head.setUint16(28, 0, true);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true); cen.setUint16(10, 8, true);
    cen.setUint16(12, 0, true); cen.setUint16(14, 0x21, true);
    cen.setUint32(16, crc, true); cen.setUint32(20, data.length, true); cen.setUint32(24, raw.length, true);
    cen.setUint16(28, name.length, true); cen.setUint32(42, at, true);
    parts.push(new Uint8Array(head.buffer), name, data);
    dir.push(new Uint8Array(cen.buffer), name);
    at += 30 + name.length + data.length;
  }
  const dirSize = dir.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, dirSize, true); end.setUint32(16, at, true);
  const all = parts.concat(dir, [new Uint8Array(end.buffer)]);
  const out = new Uint8Array(all.reduce((n, p) => n + p.length, 0));
  let o = 0; for(const p of all){ out.set(p, o); o += p.length; }
  return out;
}
const xmlOut = v => String(v).replace(/[^\x09\x0A\x0D\x20-\uD7FF\uE000-\uFFFD\u{10000}-\u{10FFFF}]/gu, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function colName(i){ let s = ""; for(i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; }
// how wide a value is on the sheet, in Excel's column units; Arabic letters run a little wider than digits
function cellWidth(v){
  let w = 0;
  for(const line of String(v).split("\n")){
    let n = 0;
    for(const ch of line) n += /[؀-ۿ]/.test(ch) ? 1.12 : /[A-Z]/.test(ch) ? 1.25 : 1;
    if(n > w) w = n;
  }
  return w;
}

function markBytes(){

/* sheet = { name, header: [text], rows: [[cell]], rtl, text: [column indexes that must stay text], red: [true for a row to be red] }
   The first row of every sheet is the company mark; the second is the header.
   A cell is a value, or { v, tone } with tone "ok" | "warn" | "bad" | "mute" — the colour the page shows it in.
   What a cell IS decides how it is written, never where it sits:
     dd/mm/yyyy                    -> a date
     a whole number, up to 9 digits, no leading zero -> a number
     anything else                 -> text                                    */
const TONES = ["", "ok", "warn", "bad", "mute"];
const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const EMU = 9525;                                // English Metric Units to the pixel
// styles: 0 plain · 1 the mark's row · 2 header · then band(3: plain, tinted, red) x tone(5) x kind(3: text, number, date)
const styleOf = (band, tone, kind) => 3 + band * 15 + Math.max(0, TONES.indexOf(tone || "")) * 3 + kind;
// One sheet of the workbook: its own XML, the drawing that puts the mark over it, and its tab name.
function sheetParts(sheet, used){
  const ncol = sheet.header.length, last = colName(ncol - 1), nrow = sheet.rows.length;
  const asText = new Set(sheet.text || []);
  const widths = sheet.header.map(h => cellWidth(h) + 4);          // + room for the filter arrow
  const rowsXML = [];
  sheet.rows.forEach((row, ri) => {
    const r = ri + 3, band = sheet.red && sheet.red[ri] ? 2 : ri % 2;      // 2: a red row, whatever its turn in the banding
    let cells = "";
    for(let ci = 0; ci < ncol; ci++){
      let cell = row[ci], tone = "";
      if(cell && typeof cell === "object"){ tone = cell.tone; cell = cell.v; }

/* ---------- small storage: the parsed sheets stay on this PC ---------- */
const idb = (() => {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("ncm_system", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  async function get(k){
    try{
      const d = await db();
      return await new Promise((res, rej) => {
        const q = d.transaction("kv").objectStore("kv").get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    }catch(e){ return undefined; }
  }
  async function set(k, v){
    try{
      const d = await db();
      await new Promise((res, rej) => {
        const tx = d.transaction("kv", "readwrite");
        if(v === null || v === undefined) tx.objectStore("kv").delete(k); else tx.objectStore("kv").put(v, k);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
      return true;
    }catch(e){ return false; }
  }
  return { get, set };
})();

const stamp = ms => {
  if(!ms) return "—";
  const d = new Date(ms), p = n => String(n).padStart(2, "0");
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
};
function daysWord(n){
  n = Math.abs(n);
  if(isEN()) return n === 1 ? "1 day" : n + " days";
  if(n === 1) return "يوم واحد";
  if(n === 2) return "يومين";
  if(n >= 3 && n <= 10) return n + " أيام";
  return n + " يوم";
